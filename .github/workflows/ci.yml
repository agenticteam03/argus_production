# CI once per change: on every pull request (opened, and each push to its branch) and on every push to main (where
# main-guard runs). A push to a task branch is not a second trigger: every task branch has a pull request from its
# first push (a draft until it is ready, GIT_WORKFLOW.md), so it already runs as `pull_request`.
# CI-COST: `test` and `frontend` run on pull requests only. A merge needs them green on the PR's last push with the
# branch up to date with main (REVIEW_PROTOCOL.md), so running them again on main tested the same code; main runs
# main-guard alone. A new push to a pull request cancels that PR's run still in progress (only the last push counts).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# OP-014 step 7: every action is pinned by commit SHA (the tag in the comment); a moved tag cannot change what runs.
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25          # OP-014: the Docker tests build the agent image and start throwaway Postgres containers
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argus_owner
          POSTGRES_DB: argus
          POSTGRES_HOST_AUTH_METHOD: trust   # throwaway CI database, reachable only inside the job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus_owner -d argus"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ARGUS_TEST_PG_OWNER_DSN: "host=localhost port=5432 dbname=argus user=argus_owner"
      # OP-014: the runner has Docker, so the credential-isolation, real-backup and real-Nginx edge tests run here too
      # instead of being skipped (the self-merge rule relies on them).
      ARGUS_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false   # OP-014 step 7 (zizmor): no git token left in .git for later steps
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Brain audit (forbidden files, secrets, addresses)
        run: python brain/tools/brain.py audit
      - name: Brain lint (structure, links, LF)
        run: python brain/tools/brain.py lint
      - name: Secret scan (gitleaks, full history)
        run: |
          # OP-014 step 7: the archive is checked against the release's published SHA-256 before it runs
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact
      # OP-014 step 4: the suite runs under coverage, and the PR's changed lines in argus/ and services/ must be at
      # least 80 % covered (diff-cover against main). Old, untested code never blocks: only the lines the PR changes.
      - name: Tests (offline + Postgres + brain.py) with coverage
        run: |
          pip install "pytest-cov==6.0.0" "diff-cover==9.2.0"
          pytest -q -rs --cov=argus --cov=services --cov-report=xml
      - name: Coverage on changed lines (diff-cover, 80 %)
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=80
      # OP-014 step 6: a known vulnerability in an installed Python package fails the build (the project itself is
      # editable, not on PyPI, so it is skipped). A step of this job, not a new job: SELF_MERGE_CHECKS stays as is.
      - name: Dependency audit (pip-audit)
        run: |
          pip install "pip-audit==2.10.1"
          pip-audit -l --skip-editable --progress-spinner off
      - name: OP-005 PromQL signal cases
        run: |
          docker run --rm --mount "type=bind,source=${{ github.workspace }}/tests/promql,target=/work,readonly" \
            --entrypoint promtool prom/prometheus:v3.5.0 test rules /work/op005_test.yml
      # OP-014 step 5: static analysis of the production code (not tests/). ruff: the default rules, config in
      # pyproject.toml. bandit: high severity fails the build (the medium findings were reviewed on 2026-10-20: SQL
      # built from constant table names and placeholders, the API's bind address, allowlisted URL reads).
      - name: Static analysis (ruff, bandit)
        run: |
          pip install "ruff==0.8.6" "bandit==1.8.0"
          ruff check argus services ops
          bandit -q -r argus services ops -lll
      # OP-014 step 7: the workflows (zizmor), the Dockerfiles (hadolint, and Trivy's configuration scan at high and
      # critical, exceptions in .trivyignore.yaml; both binaries checked against their published SHA-256) and the
      # shell scripts run as root on the VMs (shellcheck, warnings fail). Trivy as a binary, never its action (the
      # action was compromised in March 2026).
      - name: Workflow, image and script linting (zizmor, hadolint, shellcheck)
        run: |
          pip install "zizmor==1.31.1" "shellcheck-py==0.11.0.1"
          zizmor --offline .github/workflows/
          curl -sSfL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  hadolint" | sha256sum -c -
          chmod +x hadolint
          ./hadolint Dockerfile deploy/ui/Dockerfile deploy/vm-095/tunnel/Dockerfile services/target/Dockerfile
          shellcheck -S warning ops/*.sh
          curl -sSfL -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          ./trivy config --quiet --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml \
            --skip-dirs frontend/node_modules .

  # T-0016: the web UI in frontend/ — unit tests and the production build on every push.
  # Acceptance (Playwright) and contract checks join this job when they exist (T-0016 steps 2-3).
  frontend:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false   # OP-014 step 7 (zizmor)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # OP-014 step 6, OP-017: a high or critical advisory in any dependency fails the build, the dev tooling (Vite,
      # Vitest) included since its major upgrades (2026-10-21).
      - name: Dependency audit (npm, every dependency)
        run: npm audit --audit-level=high
      - name: Lint (ESLint)
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build (Vite)
        run: npm run build
      # T-0016: acceptance tests against the built app in real mode, the API faked from contracts/samples; every test
      # also runs the read-only network guard (frontend/e2e/fixtures.js)
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Acceptance tests and read-only guard (Playwright)
        run: npm run e2e
      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Free plan = no branch protection. This job turns red if main received a change that did not come through a pull
  # request approved (on its last push) by someone other than its author. Exceptions: brain/policies/main-exceptions.txt
  main-guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15         # verify-main asks GitHub about every merge on main: 3.5-4.5 min on 2026-10-21
    permissions:
      contents: read
      pull-requests: read
      checks: read            # a self-merge is valid only with green CI: verify-main reads the commit's check runs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false   # OP-014 step 7 (zizmor): no git token left in .git for later steps
      - name: Review rule on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python brain/tools/brain.py verify-main --ref HEAD
