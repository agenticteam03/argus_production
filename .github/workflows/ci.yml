# CI once per change: on every pull request (opened, and each push to its branch) and on every push to main (where
# main-guard runs). A push to a task branch is not a second trigger: every task branch has a pull request from its
# first push (a draft until it is ready, GIT_WORKFLOW.md), so it already runs as `pull_request`.
# CI-COST: `test` and `frontend` run on pull requests only. A merge needs them green on the PR's last push with the
# branch up to date with main (REVIEW_PROTOCOL.md), so running them again on main tested the same code; main runs
# main-guard alone. A new push to a pull request cancels that PR's run still in progress (only the last push counts).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25          # OP-014: the Docker tests build the agent image and start throwaway Postgres containers
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argus_owner
          POSTGRES_DB: argus
          POSTGRES_HOST_AUTH_METHOD: trust   # throwaway CI database, reachable only inside the job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus_owner -d argus"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ARGUS_TEST_PG_OWNER_DSN: "host=localhost port=5432 dbname=argus user=argus_owner"
      # OP-014: the runner has Docker, so the credential-isolation, real-backup and real-Nginx edge tests run here too
      # instead of being skipped (the self-merge rule relies on them).
      ARGUS_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Brain audit (forbidden files, secrets, addresses)
        run: python brain/tools/brain.py audit
      - name: Brain lint (structure, links, LF)
        run: python brain/tools/brain.py lint
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact
      - name: Tests (offline + Postgres + brain.py)
        run: pytest -q -rs
      - name: OP-005 PromQL signal cases
        run: |
          docker run --rm --mount "type=bind,source=${{ github.workspace }}/tests/promql,target=/work,readonly" \
            --entrypoint promtool prom/prometheus:v3.5.0 test rules /work/op005_test.yml

  # T-0016: the web UI in frontend/ — unit tests and the production build on every push.
  # Acceptance (Playwright) and contract checks join this job when they exist (T-0016 steps 2-3).
  frontend:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build (Vite)
        run: npm run build
      # T-0016: acceptance tests against the built app in real mode, the API faked from contracts/samples; every test
      # also runs the read-only network guard (frontend/e2e/fixtures.js)
      - name: Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Acceptance tests and read-only guard (Playwright)
        run: npm run e2e
      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Free plan = no branch protection. This job turns red if main received a change that did not come through a pull
  # request approved (on its last push) by someone other than its author. Exceptions: brain/policies/main-exceptions.txt
  main-guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Review rule on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python brain/tools/brain.py verify-main --ref HEAD
