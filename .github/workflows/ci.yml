# CI on every push to any branch (except the lease branch) and on every pull request.
name: ci
on:
  push:
    branches-ignore: [session]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argus_owner
          POSTGRES_DB: argus
          POSTGRES_HOST_AUTH_METHOD: trust   # throwaway CI database, reachable only inside the job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus_owner -d argus"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ARGUS_TEST_PG_OWNER_DSN: "host=localhost port=5432 dbname=argus user=argus_owner"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Brain audit (forbidden files, secrets, addresses)
        run: python brain/tools/brain.py audit
      - name: Brain lint (structure, links, LF)
        run: python brain/tools/brain.py lint
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact
      - name: Runbook pin from config/runbooks.lock
        id: pin
        run: echo "commit=$(sed -n 's/^commit=//p' config/runbooks.lock)" >> "$GITHUB_OUTPUT"
      - name: Runbook library at the pinned commit (private repo, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: agenticteam03/runbooks
          ref: ${{ steps.pin.outputs.commit }}
          ssh-key: ${{ secrets.RUNBOOKS_DEPLOY_KEY }}
          path: _runbooks
      - name: Tests (offline + Postgres + brain.py)
        env:
          ARGUS_RUNBOOKS_DIR: ${{ github.workspace }}/_runbooks/runbooks
        run: pytest -q -rs

  # Free plan = no branch protection. This job turns red if main received a change that did not come through a pull
  # request approved (on its last push) by someone other than its author. Exceptions: brain/policies/main-exceptions.txt
  main-guard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Review rule on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python brain/tools/brain.py verify-main --ref HEAD
