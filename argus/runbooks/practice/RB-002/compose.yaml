name: argus-rb002-practice

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: argus-lab-rb002:local
    container_name: argus-lab-rb002
    init: true
    restart: "no"
    ports:
      - "127.0.0.1:18082:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 5s
    networks:
      - practice

networks:
  practice:
    name: argus-rb002-net
    driver: bridge
