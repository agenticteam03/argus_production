# T-0023: the scenarios ops/e2e/run.py may run (docs/INCIDENTS.md §4, IMPLEMENTATION_PLAN §7). Reviewed like code:
# these commands are the ONLY ones the runner runs on a VM, over `ssh argus-vm095` / `ssh argus-vm166`.
#
#   host      the VM where the scenario's commands run (start, gates, reset)
#   hosts     the VMs whose session marker and nonint-check are verified (default: [host])
#   pre_gate  wait until the signal is clean before starting (so run N never sees run N-1's failure)
#   gate      wait until the signal the detector reads shows the failure (never a fixed sleep)
#             - promql: queried on the host's own Prometheus, last value or "none" (vm-166: 127.0.0.1:18090;
#               vm-095: inside argus-v18-prometheus, which publishes no host port)
#             - expect: a comparison (">=3", "==0") or a regular expression on the last line
#   request   what is sent to POST /api/v1/investigations (target, reason, kind)
#   expect    outcome (or a list), class (null = none), root_cause, first_runbook, model: none, reads_on (a host:
#             every read must stay on it), findings_any
#   reset     runs once a start was attempted, also after an error; a failed reset stops the batch. Idempotent:
#             it must succeed when what it removes is already gone
#   E2E-8:    a command may run on another host ({host: vm-095, run: ...}), a gate may name its `host`, pre_gate and
#             gate may be lists, and `investigations` (a list of {request, expect}) are sent together, each
#             graded; every host a command, gate or request touches must be in `hosts`. SC-01/SC-02's anchors
#             (&sc01_...) are reused by SC-12 and the identity proof ID-1, so they never drift apart.
# SC-04, SC-05, SC-06 (E2E-1): the commands and gates of their VM proofs (T-0020, T-0024, T-0028); the gates use
# the detector's own signal and threshold. SC-08 (E2E-4): the same, from T-0029's VM proof.

scenarios:
  - id: H-1
    title: healthy check of the vm-166 api (no failure)
    host: vm-166
    request: {target: "vm-166/container:argus-lab-api", reason: "is it healthy?", kind: check}
    expect: {outcome: no_incident, model: none, reads_on: vm-166}

  - id: H-2
    title: healthy check of the vm-095 twin (same name, other host)
    host: vm-095
    request: {target: "vm-095/container:argus-lab-api", reason: "is it healthy?", kind: check}
    expect: {outcome: no_incident, model: none, reads_on: vm-095}

  - id: SC-01
    title: OOM restart loop on vm-166 (killed by its own 64 MiB limit)
    host: vm-166
    pre_gate: &sc01_pre_gate
      promql: 'max_over_time(argus_container_restart_count{argus_host="vm-166",container="argus-lab-worker"}[10m]) - min_over_time(argus_container_restart_count{argus_host="vm-166",container="argus-lab-worker"}[10m])'
      expect: "^(none|0)$"
      timeout_s: 900
      every_s: 30
    start:
      - &sc01_start cd /opt/argus-v18/app/deploy/lab && sudo docker compose -f compose.lab.yml --profile sc01 up -d argus-lab-worker-oom
    gate: &sc01_gate
      promql: 'max_over_time(argus_container_restart_count{argus_host="vm-166",container="argus-lab-worker"}[10m]) - min_over_time(argus_container_restart_count{argus_host="vm-166",container="argus-lab-worker"}[10m])'
      expect: ">=3"
      timeout_s: 300
      every_s: 15
    request: &sc01_request {target: "vm-166/container:argus-lab-worker", reason: "keeps restarting", kind: report}
    expect: &sc01_expect {outcome: diagnosed, class: container_restart_loop, first_runbook: RB-001, reads_on: vm-166}
    reset:
      - &sc01_reset cd /opt/argus-v18/app/deploy/lab && sudo docker compose -f compose.lab.yml --profile sc01 rm -sf argus-lab-worker-oom

  - id: SC-02
    title: non-OOM crash loop on vm-095 (same container name as SC-01)
    host: vm-095
    pre_gate: &sc02_pre_gate
      promql: 'max_over_time(argus_container_restart_count{argus_host="vm-095",container="argus-lab-worker"}[10m]) - min_over_time(argus_container_restart_count{argus_host="vm-095",container="argus-lab-worker"}[10m])'
      expect: "^(none|0)$"
      timeout_s: 900
      every_s: 30
    start:
      - &sc02_start cd /opt/argus-v18/app/deploy/lab && sudo docker compose -f compose.lab.yml --profile sc02 up -d argus-lab-worker-crash
    gate: &sc02_gate
      promql: 'max_over_time(argus_container_restart_count{argus_host="vm-095",container="argus-lab-worker"}[10m]) - min_over_time(argus_container_restart_count{argus_host="vm-095",container="argus-lab-worker"}[10m])'
      expect: ">=3"
      timeout_s: 300
      every_s: 15
    request: &sc02_request {target: "vm-095/container:argus-lab-worker", reason: "keeps restarting", kind: report}
    expect: &sc02_expect {outcome: diagnosed, class: container_restart_loop, first_runbook: RB-008, reads_on: vm-095}
    reset:
      - &sc02_reset cd /opt/argus-v18/app/deploy/lab && sudo docker compose -f compose.lab.yml --profile sc02 rm -sf argus-lab-worker-crash

  - id: SC-03
    title: the cache stops; the api is the victim, the cache the root cause (vm-166)
    host: vm-166
    pre_gate:
      promql: 'min(argus_probe_success{argus_host="vm-166",owner="argus-lab-api"})'
      expect: "==1"
      timeout_s: 300
      every_s: 15
    start:
      - sudo docker stop argus-lab-cache
    gate:
      promql: 'min(argus_probe_success{argus_host="vm-166",owner="argus-lab-api"})'
      expect: "==0"
      timeout_s: 180
      every_s: 10
    request: {target: "vm-166/container:argus-lab-api", reason: "api returns errors", kind: report}
    expect: {outcome: diagnosed, class: dependency_unavailable, root_cause: "vm-166/container:argus-lab-cache",
             first_runbook: RB-003, reads_on: vm-166}
    reset:
      - sudo docker start argus-lab-cache

  - id: SC-04
    title: a worker leaks database sessions; the leaker is the root cause, not the database (vm-166)
    host: vm-166
    pre_gate:
      promql: 'min_over_time((argus_db_connections_used{argus_host="vm-166",container="argus-lab-db"} / (argus_db_connections_usable{argus_host="vm-166",container="argus-lab-db"} > 0))[5m:30s])'
      expect: "<0.9"
      timeout_s: 600
      every_s: 30
    start:
      - cd /opt/argus-v18/app/deploy/lab && sudo docker compose -f compose.lab.yml --profile sc04 up -d argus-lab-leaker
    gate:
      promql: 'min_over_time((argus_db_connections_used{argus_host="vm-166",container="argus-lab-db"} / (argus_db_connections_usable{argus_host="vm-166",container="argus-lab-db"} > 0))[5m:30s])'
      expect: ">=0.9"
      timeout_s: 900
      every_s: 30
    request: {target: "vm-166/container:argus-lab-db", reason: "clients cannot get a database connection", kind: report}
    expect: {outcome: diagnosed, class: postgresql_connection_exhaustion, root_cause: "vm-166/container:argus-lab-leaker",
             first_runbook: RB-004, reads_on: vm-166}
    reset:
      - sudo docker rm -f argus-lab-leaker

  - id: SC-05
    title: a filler writes the lab filesystem to 92 %; the writer is the root cause (vm-166)
    host: vm-166
    # needs the lab filesystem /srv/argus-lab-fill (ops/lab-fill-mount.sh, T-0024), kept mounted on vm-166
    pre_gate:
      promql: 'max(min_over_time((1 - node_filesystem_avail_bytes{argus_host="vm-166",mountpoint=~"/|/srv/argus-lab-fill"} / node_filesystem_size_bytes{argus_host="vm-166",mountpoint=~"/|/srv/argus-lab-fill"})[5m:30s]))'
      expect: "<0.9"
      timeout_s: 600
      every_s: 30
    start:
      - cd /opt/argus-v18/app/deploy/lab && sudo docker compose -f compose.lab.yml --profile sc05 up -d argus-lab-filler
    gate:
      promql: 'max(min_over_time((1 - node_filesystem_avail_bytes{argus_host="vm-166",mountpoint=~"/|/srv/argus-lab-fill"} / node_filesystem_size_bytes{argus_host="vm-166",mountpoint=~"/|/srv/argus-lab-fill"})[5m:30s]))'
      expect: ">=0.9"
      timeout_s: 1500
      every_s: 30
    request: {target: "vm-166/host:vm-166", reason: "the disk is almost full", kind: report}
    expect: {outcome: diagnosed, class: disk_pressure, root_cause: "vm-166/container:argus-lab-filler",
             first_runbook: RB-005, reads_on: vm-166}
    reset:
      - sudo docker rm -f argus-lab-filler && sudo rm -f /srv/argus-lab-fill/argus-lab-filler.dat

  - id: SC-06
    title: a burner throttled at its 0.3-core CPU quota; the container itself is CPU-bound (vm-166)
    host: vm-166
    pre_gate:                     # no burner samples in the last 5 minutes: run N never sees run N-1's throttling
      promql: 'min_over_time((rate(container_cpu_cfs_throttled_periods_total{argus_host="vm-166",name="argus-lab-burner"}[3m]) / (rate(container_cpu_cfs_periods_total{argus_host="vm-166",name="argus-lab-burner"}[3m]) > 0))[5m:30s])'
      expect: "^none$"
      timeout_s: 900
      every_s: 30
    start:
      - cd /opt/argus-v18/app/deploy/lab && sudo docker compose -f compose.lab.yml --profile sc06 up -d argus-lab-burner
    gate:                         # the detector's two conditions: throttled >= 0.5 and quota used >= 0.8, 5-minute minimums
      promql: 'min_over_time((rate(container_cpu_cfs_throttled_periods_total{argus_host="vm-166",name="argus-lab-burner"}[3m]) / (rate(container_cpu_cfs_periods_total{argus_host="vm-166",name="argus-lab-burner"}[3m]) > 0))[5m:30s]) >= 0.5 and on(name) min_over_time((rate(container_cpu_usage_seconds_total{argus_host="vm-166",name="argus-lab-burner"}[3m]) / on(name) (container_spec_cpu_quota{argus_host="vm-166",name="argus-lab-burner"} / container_spec_cpu_period{argus_host="vm-166",name="argus-lab-burner"}))[5m:30s]) >= 0.8'
      expect: ">=0.5"
      timeout_s: 900
      every_s: 30
    request: {target: "vm-166/container:argus-lab-burner", reason: "this container is slow", kind: report}
    expect: {outcome: diagnosed, class: cpu_saturation, root_cause: "vm-166/container:argus-lab-burner",
             first_runbook: RB-006, reads_on: vm-166}
    reset:
      - sudo docker rm -f argus-lab-burner

  - id: SC-08
    title: nginx in front of a slow upstream answers 504; the upstream is the root cause, not the proxy (vm-166)
    host: vm-166
    pre_gate:                     # no probe samples of nginx in the last 5 minutes: run N never sees run N-1's 504s
      promql: 'max(avg_over_time(argus_http_probe_gateway_error{argus_host="vm-166",owner="argus-lab-nginx"}[5m]))'
      expect: "^none$"
      timeout_s: 900
      every_s: 30
    start:
      - cd /opt/argus-v18/app/deploy/lab && sudo docker compose -f compose.lab.yml --profile sc08 up -d argus-lab-slow argus-lab-nginx
    gate:                         # the detector's signal and threshold: half or more of the 5-minute probes are 502/504
      promql: 'max(avg_over_time(argus_http_probe_gateway_error{argus_host="vm-166",owner="argus-lab-nginx"}[5m]))'
      expect: ">=0.5"
      timeout_s: 900
      every_s: 30
    request: {target: "vm-166/container:argus-lab-nginx", reason: "users get gateway timeouts", kind: report}
    expect: {outcome: diagnosed, class: nginx_upstream_failure, root_cause: "vm-166/container:argus-lab-slow",
             first_runbook: RB-015, reads_on: vm-166}
    reset:                        # only SC-08's two containers (never `compose down`: it would take the lab with it)
      - sudo docker rm -f argus-lab-nginx argus-lab-slow

  - id: SC-07
    title: a healthy backend on the wrong network (vm-166)
    host: vm-166
    pre_gate:
      promql: 'min(argus_probe_success{argus_host="vm-166",owner="argus-lab-client"})'
      expect: "^none$"
      timeout_s: 600
      every_s: 30
    start:
      - cd /opt/argus-v18/app/deploy/lab && sudo docker compose -f compose.lab.yml --profile sc07 up -d
    gate:
      promql: 'min(argus_probe_success{argus_host="vm-166",owner="argus-lab-client"})'
      expect: "==0"
      timeout_s: 180
      every_s: 10
    request: {target: "vm-166/container:argus-lab-client", reason: "the client cannot reach its backend", kind: report}
    expect: {outcome: diagnosed, class: dependency_unavailable, root_cause: "vm-166/container:argus-lab-backend",
             first_runbook: RB-003, reads_on: vm-166}
    reset:
      - sudo docker rm -f argus-lab-client argus-lab-backend && { ! sudo docker network inspect argus-lab-iso >/dev/null 2>&1 || sudo docker network rm argus-lab-iso; }

  - id: SC-09
    title: a report with no matching class on a healthy target (no model call)
    host: vm-095
    request: {target: "vm-095/container:argus-lab-api", reason: "users see stale data", kind: report}
    expect: {outcome: unsupported_escalated, class: null, model: none, reads_on: vm-095}

  - id: SC-11
    title: a target outside the inventory is refused before anything is read
    host: vm-166
    request: {target: "vm-166/container:argus-api-1", reason: "check", kind: report}
    expect: {outcome: refused, class: null, model: none, reads_on: vm-166}

  # E2E-8: SC-10 and SC-12 stop an Argus service; their reset starts it first (`docker start` also succeeds when it is
  # already running), so a failed run never leaves monitoring or the read path down.
  - id: SC-10
    title: vm-095's node-exporter stopped is a monitoring blind spot of vm-095, never a healthy host; vm-166 unaffected
    host: vm-095
    hosts: [vm-095, vm-166]
    pre_gate:
      promql: 'up{argus_host="vm-095",job="argus-v18-node-exporter"}'
      expect: "==1"
      timeout_s: 300
      every_s: 15
    start:
      - sudo docker stop argus-v18-node-exporter
    gate:                         # the scrape is down: what scrape_targets_down counts (T-0027)
      promql: 'up{argus_host="vm-095",job="argus-v18-node-exporter"}'
      expect: "==0"
      timeout_s: 180
      every_s: 10
    investigations:
      - request: {target: "vm-095/host:vm-095", reason: "is the host healthy?", kind: check}
        expect: {outcome: no_action_escalated, class: monitoring_blind_spot, first_runbook: RB-014, model: none,
                 reads_on: vm-095}
      - request: {target: "vm-166/container:argus-lab-api", reason: "is it healthy?", kind: check}
        expect: {outcome: no_incident, model: none, reads_on: vm-166}
    reset:
      - sudo docker start argus-v18-node-exporter

  - id: SC-12
    title: vm-166's read gateway stopped during an OOM loop escalates on vm-166 (no made-up diagnosis); vm-095 still answers
    host: vm-166
    hosts: [vm-166, vm-095]
    pre_gate: *sc01_pre_gate
    start:
      - *sc01_start
      - sudo docker stop argus-v18-read-gateway
    gate:
      - *sc01_gate                # Prometheus still counts the restarts (the exporter has its own Docker socket)
      - cmd: sudo docker inspect -f '{{.State.Running}}' argus-v18-read-gateway
        expect: "^false$"
        timeout_s: 60
    investigations:
      - request: *sc01_request
        expect: {outcome: [no_action_escalated, undiagnosable], class: container_restart_loop, reads_on: vm-166}
      - request: {target: "vm-095/container:argus-lab-api", reason: "is it healthy?", kind: check}
        expect: {outcome: no_incident, model: none, reads_on: vm-095}
    reset:
      - sudo docker start argus-v18-read-gateway
      - *sc01_reset

  - id: ID-1
    title: identity proof - SC-01 on vm-166 and SC-02 on vm-095 together (same container name, two hosts)
    host: vm-166
    hosts: [vm-166, vm-095]
    pre_gate:
      - *sc01_pre_gate
      - {<<: *sc02_pre_gate, host: vm-095}
    start:
      - *sc01_start
      - {host: vm-095, run: *sc02_start}
    gate:
      - *sc01_gate
      - {<<: *sc02_gate, host: vm-095}
    investigations:
      - {request: *sc01_request, expect: *sc01_expect}
      - {request: *sc02_request, expect: *sc02_expect}
    reset:
      - *sc01_reset
      - {host: vm-095, run: *sc02_reset}
