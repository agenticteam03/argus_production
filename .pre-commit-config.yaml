# Install once per clone:  pip install -e ".[dev]"  then  pre-commit install
# Runs on every `git commit`: the Brain audit (secrets, addresses, forbidden files) and lint (brain/policies/SECURITY.md).
# gitleaks runs in CI on every push (full history). It is not a local hook because Windows Application Control can
# block its binary; to run it locally with Docker Desktop:
#   docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact
repos:
  - repo: local
    hooks:
      - id: brain-audit
        name: brain audit (forbidden files, secrets, addresses, local paths)
        entry: python brain/tools/brain.py audit --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: brain-lint
        name: brain lint (structure, links, LF line endings)
        entry: python brain/tools/brain.py lint
        language: system
        pass_filenames: false
        always_run: true
