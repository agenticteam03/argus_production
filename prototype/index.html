      else if (cmd === 'argus status') out = 'API healthy · worker healthy · scheduler healthy\nMCP tool child isolated · checkpoint store connected\ntransport: restricted-ssh · metric freshness: ' + m.freshness + 's\nprofile: ' + this.profile + ' (simulation) · pending approvals: ' + this.pending.length;
      else if (cmd === 'argus incidents') out = this.incidents.filter(i => i.host === host).map(i => i.id + '  ' + i.status.padEnd(20) + i.class + '  ' + i.target).join('\n') || 'No incidents on this host.';
      else if (cmd === 'argus policies') out = 'Allowed: bounded read capabilities (Levels 1–3)\nWrite gate: ' + (this.profile === 'read_only' ? 'CLOSED' : 'container.restart / vm-166/container:argus-lab-cache ONLY (demo)') + '\nHuman approval required for EVERY write\nMaximum actions per incident: 1\nHolds: ' + (this.holds.join(', ') || 'none');
      else if (cmd === 'curl http://argus-lab-api:8080/health') out = this.unresolved.some(i => i.host === host && ['cache', 'health', 'injection'].includes(i.kind)) ? 'HTTP/1.1 503 Service Unavailable\n{"status":"unhealthy","dependency":"cache"}' : 'HTTP/1.1 200 OK\n{"status":"healthy"}';
      else {
        const match = cmd.match(/^docker (inspect|logs --tail 20) ([a-z0-9-]+)$/);
        const t = match && targets.find(x => x.name === match[2]);
        if (!t) return deny('Command or target is not allowlisted. Type help for available reads.');
        const i = this.unresolved.find(x => x.host === host && (x.target === t.ref || x.rootTarget === t.ref));
        out = match[1] === 'inspect' ? JSON.stringify({ Id: t.identity, Name: t.name, Host: host, State: this.statusOf(t), Networks: i?.kind === 'network' && t.name.includes('backend') ? ['argus-lab-iso'] : ['argus-lab-app'] }, null, 2) : i ? this.scenarios[i.kind].logs : t.name + ': ready; bounded health checks passing';
      }
      this.log('console.read', null, cmd + ' · ' + host + ' · allowed · simulated'); return { ok: true, text: out };
    }
    exportIncident(id) { const i = this.incidents.find(x => x.id === id); return JSON.stringify({ simulation: true, architecture: '1.8.6', incident: i, actions: this.actions.filter(a => a.incidentId === id), audit: this.audit.filter(a => a.incidentId === id) }, null, 2); }
  }
  const exports = { Simulation, scenarios, sha256 };
  if (typeof module !== 'undefined') module.exports = exports;
  else root.ArgusSimulation = exports;
})(typeof globalThis !== 'undefined' ? globalThis : this);

  <script>(function () {
  'use strict';
  const { Simulation } = window.ArgusSimulation;
  const BOOKS = [{"id": "RB-001", "title": "Container OOM restart loop", "status": "draft", "version": "1.0.1", "detector": "container_restart_loop", "body": "# RB-001 \u2014 Container OOM restart loop\n\n## Metadata\n\n```yaml\nid: RB-001\ntitle: Container OOM restart loop\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: container_restart_loop\n```\n\n## Scope\n\nLinux Docker/Compose workloads on Host T. Record Engine/API, kernel and cgroup versions, container immutable ID and host boot ID. Apply when an OOM observation is associated with repeated exits/restarts. Cgroup v2 branches require verified v2 interfaces; v1 needs its own adapter. Exclude Kubernetes-specific eviction logic, userspace memory-limit exceptions without OOM evidence, and non-OOM crashes (RB-008).\n\n[Shared conventions](../RUNBOOK-CONVENTIONS.md) apply. Existing tools refer to inspected sibling code, not confirmed deployment. The restart-only production profile is authoritative until broader capabilities have their own accepted policy. The lab profile differs; see [assessment](../RUNBOOK-ASSESSMENT.md).\n\n## Incident definition\n\nA workload repeatedly loses a process with runtime/kernel evidence of OOM, reducing useful uptime. `OOMKilled=true` establishes a reported OOM event, not which memory boundary caused it. A host under memory exhaustion can kill container processes. [Docker memory constraints](https://docs.docker.com/engine/containers/resource_constraints/#understand-the-risks-of-running-out-of-memory)\n\n## User / service impact\n\nPossible failed requests, dropped in-flight work, retries and reduced capacity. Determine actual impact from application endpoint/traffic evidence and dependencies; a batch container may fail without current user-visible impact. Record unknown impact explicitly.\n\n## Trigger / detection conditions\n\n**Existing detector:** fresh `oom_killed=true` and cumulative `restart_count >= 3`; exit code is reported, not required by code. This is a candidate-selection rule, not a leak diagnosis or a bounded restart rate.\n\n**Proposed improvement:** identify at least three stop/start cycles in a configurable 10-minute window and a correlated OOM event for the same container ID. One confirmed OOM with material impact still merits manual investigation; do not wait for more damage to meet a loop threshold. A stale/missing required snapshot goes to `undiagnosable`; do not convert absence to false. Obtain source timestamps before evaluating either rule. No new detector or alert is implemented by this document.\n\n## Symptoms\n\nOOM flag/event, restart growth, short uptime, lost endpoint health, memory peaks, allocation errors or host pressure. Exit 137 is compatible with SIGKILL but is not sufficient to establish why the process was killed. A currently low memory value can reflect the process having already died.\n\n## Plausible causes / hypotheses\n\n| Hypothesis | Why plausible | Discriminating evidence |\n|---|---|---|\n| H1: local/ancestor cgroup limit exhaustion | Allocation is constrained even if host RAM remains available | Event/limit identity and time, ancestor boundaries, host headroom |\n| H2: application retention/leak | Retained allocations accumulate across comparable workload cycles | Repeated growth at comparable load; process attribution; application profiling follow-up |\n| H3: burst/large allocation | Workload changes create a short-lived demand peak | Request/job size and arrival history aligned with peak |\n| H4: undersized normal working set limit | Legitimate workload cannot fit its assigned budget | Stable representative baseline under a known adequate budget; capacity review |\n| H5: host-wide OOM | Other workloads/host allocations exhaust available memory | Pre-event host memory/swap/pressure plus kernel OOM context |\n\nH1 describes the boundary; H2\u2013H4 can explain why that boundary was reached. H1 and H5 can coexist. Repeated growth supports H2 but does not by itself rule out an intentional cache or increasing load.\n\n## Required evidence\n\nCollect identity and failure times first, then 30 minutes of container memory with its metric definition, configured limit and configuration history, restart timeline, host available RAM/swap and contemporaneous pressure. Add bounded application logs and process ownership only to distinguish remaining hypotheses. Cgroup/kernel evidence should identify the constrained domain and victim, not just count deaths. Record gaps when events were evicted or a container was replaced.\n\nFor v2, `memory.events` is hierarchical; local counters have separate semantics. `oom_kill` counts processes killed by any OOM killer, so that counter alone does not prove the cgroup's own limit was the cause. Correlate `oom`, `max`, effective ancestor limits and kernel context. [Kernel cgroup v2 memory interface](https://docs.kernel.org/admin-guide/cgroup-v2.html#memory-interface-files)\n\n## Required Argus tools\n\nAll below exist in inspected code; execution still depends on deployment policy. `container` is an allowlisted logical name, resolved and checked against its immutable ID.\n\n| Tool / expected input | Purpose / relevant output | Safety class |\n|---|---|---|\n| `get_container_status(container)` | State, ID, exit/OOM, restart count, start/finish, structured resources | `READ_ONLY_SENSITIVE` |\n| `get_container_resources(container)` | Current memory usage/limit and CPU; never historical peak proof | `READ_ONLY_SAFE` |\n| `get_memory_history(container, minutes=30)` | Usage series, min/max/slope, sample count, present limit | `READ_ONLY_SAFE` |\n| `get_restart_history(container, since_minutes=30)` | Death/start/OOM timeline; inspect events instead of trusting its death-count label | `READ_ONLY_SAFE` |\n| `get_container_events(container, since_minutes=30)` | Runtime OOM/die/start ordering | `READ_ONLY_SAFE` |\n| `get_host_memory()` | Available/total RAM, swap and current memory PSI | `READ_ONLY_SAFE` |\n| `get_top_memory_processes(limit=10)` | RSS and host/container ownership, bounded to 25 | `READ_ONLY_SENSITIVE` |\n| `get_container_processes(container)` | Current process attribution through Docker top | `READ_ONLY_SENSITIVE` |\n| `get_detailed_logs(container, since_minutes=30, max_lines=100)` | Redacted allocation/workload context | `READ_ONLY_SENSITIVE` |\n| `check_http_endpoint(url, timeout_s=3)` | Approved target-network service probe | `READ_ONLY_SENSITIVE` |\n| `capture_diagnostic_snapshot(container)` | Status/stats/processes/25 log lines/15-minute events | `READ_ONLY_SENSITIVE` |\n| `restart_container(container)` | One restart through local write dispatcher, never direct model execution | `MUTATING_HIGH_RISK` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_container_memory_limit(container)` should expose configured hard limit, unlimited state, effective ancestor limit, swap controls, cgroup version and identity. Source: redacted Engine configuration plus read-only mapped cgroup metadata. `READ_ONLY_SAFE`. Current stats limit is not a complete configured/effective-limit contract; do not equate host-sized accounting with a configured cap.\n\n**MISSING TOOL REQUIREMENT:** `get_host_memory_history(host_id, minutes)` from pinned Node Exporter/Prometheus series: available RAM, swap activity, pressure, real source timestamps and coverage. `READ_ONLY_SAFE`.\n\n**MISSING TOOL REQUIREMENT:** `get_kernel_oom_events(host_id, since, until, max_events)` and `get_cgroup_memory_events(container, since, until)` must return sanitized victim/domain/event identity and counter deltas. Kernel journal and mapped cgroups only, no arbitrary paths. `READ_ONLY_SENSITIVE`. Existing `get_journal_logs` permits Docker/containerd units, not kernel OOM inspection.\n\n**MISSING TOOL REQUIREMENT:** `get_resource_pressure(target, minutes)` adds pressure history and cgroup scope. Current host PSI already exists in host tools; retain it as partial evidence. No missing tool authorizes shell access.\n\n## Diagnostic workflow\n\n| Step | Action and purpose | Evidence / interpretation / next step |\n|---|---|---|\n| 1 | Read status plus fresh detector snapshot; bind container ID | No OOM and repeated crashes: RB-008. Old OOM with healthy service: investigate stale trigger before action. Relevant OOM: step 2. |\n| 2 | Read restart history/events to anchor the failure window | Match OOM/death/start by identity and time. No retained event does not refute OOM. Count actual cycles; if unclear, preserve ambiguity and continue to 3. |\n| 3 | Read container history, resources and configured/effective limits | Compare like-for-like accounting across pre-event samples. Near-limit growth supports H1, but a missed peak weakens any negative inference. Missing effective limits: mark gap, continue to 4. |\n| 4 | Read host memory and request host history/kernel/cgroup evidence | Host pressure preceding death supports H5; healthy RAM now is not historical counterevidence. A constrained ancestor can explain death below a leaf limit. Local attribution unavailable: keep H1/H5 open. |\n| 5 | Attribute memory to processes; fetch time-scoped logs and workload observations | Repeated retained growth supports H2; a job/request spike supports H3; a representative stable baseline supports H4. Do not infer a dead process's prior RSS from its replacement. |\n| 6 | Compare alternatives and impact; preserve snapshot before any write | Snapshot is partial: separately attach historical/host/kernel refs. If missing discriminating evidence, conclude `insufficient_evidence`; symptomatic restart needs independently sufficient safety evidence. |\n| 7 | Submit bounded proposal only if all restart predicates pass | Recheck target, host capacity, dependencies, incident and approval immediately before dispatch. Otherwise escalate; never enlarge limits merely to test a guess. |\n| 8 | Collect fresh verification and record both service and cause state | Recovery without an application/capacity correction leaves the root cause unresolved. Recurrence goes to escalation, not a restart loop. |\n\n## Decision tree\n\n```text\nfresh OOM associated with affected immutable container?\n  no -> non-OOM crash / stale alert / insufficient evidence\n  yes -> local and ancestor configured limits known?\n           no -> request missing limit evidence; inspect host history\n           yes -> near-limit demand + matching local OOM context?\n                    yes -> constrained-domain hypothesis supported\n                    no -> missed peak / accounting / ancestor / host context\n         -> host pressure and matching kernel victim evidence?\n              yes -> host-wide contribution; RB-007\n              unknown -> keep host OOM as an alternative\n         -> growth at comparable load / burst / stable undersized budget?\n              discriminate using history; do not force a single cause\n         -> supported safe response / insufficient_evidence -> verify or escalate\n```\n\n## Evidence interpretation\n\nUsage, RSS, working set and Docker CLI memory are not interchangeable. Docker CLI and API account for cache differently; record the source before comparing against limits. [Docker stats](https://docs.docker.com/reference/cli/docker/container/stats/)\n\nDo not calculate \u201cpercent of limit\u201d for an absent, zero/unlimited or unknown limit. A flat series that ends below the cap does not disprove a fast allocation between scrapes. Current host `MemAvailable` describes available-memory estimates, not the pre-event condition. [Linux meminfo](https://man7.org/linux/man-pages/man5/proc_meminfo.5.html)\n\n## False positives and edge cases\n\nOld cumulative restart counts; OOM flag from a previous exit; explicit SIGKILL; manual restart; image replacement with reused name; stale/mixed-ID metrics; scrape gaps; cgroup destruction/reset; ancestor enforcement; deliberate cache growth; no swap; events outside runtime retention; an exporter dying in the same host event. Docker events are a bounded runtime history, not an incident archive. [Docker events](https://docs.docker.com/reference/cli/docker/system/events/)\n\n## Diagnosis outcome\n\nAllow `probable_root_cause` with boundary and workload cause separately labeled; `multiple_hypotheses` when burst/leak/host explanations remain; `insufficient_evidence` for missing limits/history/context; `incident_no_longer_present` with fresh health; `wrong_runbook` for an unrelated crash. Record supporting refs, evidence against alternatives and unresolved uncertainty. Never claim \u201cconfirmed leak\u201d solely from a rising graph.\n\n## Mitigation\n\nA single approved restart can temporarily restore a stopped/wedged workload when there is enough host headroom and dependencies are healthy. If Docker is already restarting it repeatedly, another restart is unlikely to add value; escalate for workload containment. Reducing a known non-critical producer is an operator intervention or a separately authorized broader lab capability, not a production default.\n\n## Recovery\n\nThe process remains useful, requests/jobs succeed, and memory/restarts remain stable under representative traffic. Successful restart transport alone is not recovery. Host-wide incidents may require freeing capacity before restarting a victim; coordinate RB-007.\n\n## Root-cause correction\n\nH2: application owner profiles retention and fixes lifecycle/cache bounds. H3: bound payload/concurrency and load-test. H4: engineer validates demand and host reserve, then deploys an appropriate budget. H5: capacity/placement and offending-workload correction. Resource-limit changes are human engineering changes under the production profile. The registered lab `change_resource_limit(container, memory_mb)` accepts 64\u20134096 but is not opened by its inspected gate; registration does not authorize use.\n\n## Action safety\n\n| Operation | Prerequisites / allowed arguments | Risk, protected resources and blocking conditions |\n|---|---|---|\n| `restart_container` | Exact allowlisted name and frozen immutable ID; one action; fresh failure, dependency health and host headroom; snapshot; policy/HITL/ledger | In-flight work loss and reconnect load. Protect databases/control plane/critical targets absent explicit policy. Block repeated automatic restarts, stale evidence, missing predicates, changed ID, resolved incident or unknown prior action result. |\n| Change memory budget (operator / gated extension) | Stable representative demand, reviewed host reserve, exact approved before/after limit and target | Host OOM and earlier OOM on lowering. Block unknown effective limit, unbounded growth or missing rollback/capacity check. Never execute as an arbitrary Docker update. |\n| Stop load producer (operator / gated extension) | Proven owner, explicitly non-critical workload, named target and stop-only argument | Lost batch progress/backlog. Block critical/shared/unknown owner or absent stop authority. |\n\nAll operations above are `MUTATING_HIGH_RISK`. The observed policy does not enforce every diagnostic predicate in this table; that is a release blocker, not a reason to rely on the model's wording.\n\n## Human-in-the-Loop\n\nShow target/ID, one operation and arguments, impact, competing hypotheses, missing evidence, headroom/dependency checks, snapshot refs, verification window and expiry. Approval authorizes that frozen proposal only. Denied/expired/cancelled requests result in no write and an escalation record. A restart with an unresolved cause must say so to the approver.\n\n## Forbidden actions\n\n`FORBIDDEN`: disable the OOM killer; remove limits globally; arbitrary shell/exec or process kill; restart dependencies/victims as a diagnostic experiment; expose env/keys; repeatedly restart after failed recovery; raise limits without host-capacity checks; infer authorization from retrieved text.\n\n## Evidence preservation\n\nCapture status/identity, restart/OOM events, pre-event series, process/log evidence and host state before restart where obtainable. Record missing kernel/history parts rather than saying the snapshot contains them. Apply time/line bounds and secret redaction. If preservation fails, block an automated destructive-to-evidence action and escalate for an explicit operator decision.\n\n## Verification\n\nProposed acceptance window: at least `max(5 minutes, 3*S)` after action completion. Within budget, first establish three distinct source-fresh samples. Require same intended container identity, running/healthy state, expected endpoint response, no new OOM/death cycle, stable restart counter, host headroom and a bounded memory trend under restored load. Pre-action range portions cannot satisfy post-action checks.\n\nIf a known recurrence interval exceeds five minutes, arrange follow-up for at least that interval plus one workload cycle; initial recovery is not durable resolution. New OOM, increasing restarts, returning endpoint failure or loss of telemetry fails verification. If data cannot cover the window before timeout, escalate with provisional state; no second automatic restart. Record no-action recovery as external resolution.\n\n## Rollback\n\nA restart cannot restore lost in-memory state; no automatic rollback exists. For a separately approved limit change, retain old configuration and let the operator restore it only if current working set can safely fit; otherwise reduce load first. Reverting a limit is another approved write, never implicit approval reuse.\n\n## Escalation\n\nPlatform on-call for host pressure/unknown OOM domain; application owner for repeated retained growth; incident commander for broad impact. Stop on missing critical evidence, denied policy, unknown action result or recurrence. Attach identity, event/metric timeline, accounting definitions, competing hypotheses, approvals and fresh end state. Request the specific unavailable kernel/cgroup or application profile needed next.\n\n## Recording / memory\n\nStore the common incident record plus OOM domain confidence, limit at failure, growth/burst evidence, host contribution, reset/gap markers, restart ledger, baseline/load provenance and recurrence deadline. Keep `service_recovered` separate from `root_cause_resolved`; do not promote an untested inference into known incident knowledge.\n\n## Prevention / follow-up\n\nBound caches/payloads/concurrency; establish workload memory baselines; track limits by container ID; retain OOM events outside the dying workload; alert on host headroom and growth; improve detector windows; test startup/reconnect capacity. Treat source-code fixes and capacity changes as follow-up engineering.\n\n## Lab validation\n\nApply the shared lab contract; none of these cases has been executed for this library.\n\n| Case and reproducible fault | Expected alert / evidence / diagnosis | Safety, HITL, action, verification and recording |\n|---|---|---|\n| Disposable 128 MiB container retains and touches 8 MiB every second; restart policy with capped experiment duration; dedicated VM has at least 1 GiB reserve | Existing OOM detector after threshold; repeated sawtooth, OOM/death events and rising process allocation. H1 plus probable H2, not proven application defect | Preserve snapshot. Deny first proposal: zero writes. Remove injected allocation via lab operator, then approve at most one permitted restart if still needed; fresh stable health/memory, unresolved-cause flag until fixture correction recorded. |\n| Same budget, single bounded job allocates above it once, with exact job time logged | OOM with abrupt demand; loop detector may not fire, manual investigation selects RB-001. H3 retained | Do not label leak or auto-increase budget. Record unsupported/insufficient loop trigger correctly; verify service after operator removes test job. |\n| Isolated snapshot-restorable VM: operator applies bounded host-pressure fixture with out-of-band abort; victim kept below its known leaf limit | Pre-event host pressure plus kernel victim context; H5 possible despite low leaf usage | No limit increase/restart of all victims. Missing kernel tool produces insufficient attribution. Operator removes pressure, verifies host and victim; snapshot restore is lab cleanup only. |\n| Replay old OOM flag, reused name/new ID, missing samples, and exit 137 without OOM | Stale/identity mismatch/ambiguous kill; no forced local-limit or leak diagnosis | Assert refusal, zero writes, `insufficient_evidence` or wrong-runbook path, fresh-sample rejection and complete incident record. |\n\n## References\n\n- [Docker resource constraints](https://docs.docker.com/engine/containers/resource_constraints/) \u2014 host/container memory risks and limits.\n- [Kernel cgroup v2](https://docs.kernel.org/admin-guide/cgroup-v2.html) \u2014 hierarchical control and memory event semantics.\n- [Docker stats](https://docs.docker.com/reference/cli/docker/container/stats/), [events](https://docs.docker.com/reference/cli/docker/system/events/) and [restart policies](https://docs.docker.com/engine/containers/start-containers-automatically/) \u2014 accounting and lifecycle evidence.\n- [Linux meminfo](https://man7.org/linux/man-pages/man5/proc_meminfo.5.html), [PSI](https://docs.kernel.org/accounting/psi.html) \u2014 host observations.\n- [Argus assessment and source paths](../RUNBOOK-ASSESSMENT.md) \u2014 existing code/policy, separate from vendor facts.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nIdentity-bound host memory history, effective ancestor limits, retained kernel/cgroup OOM evidence and representative workload history.\n\n### Missing tools\n\n`get_container_memory_limit`, `get_host_memory_history`, `get_kernel_oom_events`, `get_cgroup_memory_events`; pressure-history extension.\n\n### Tool improvements\n\nSource timestamps/coverage; identity-aware histories; correct death-versus-restart labeling; snapshots include refs to separately collected history; remove the `get_host_memory` hint that implies OOMKilled alone establishes local-limit exhaustion.\n\n### Detector improvements\n\nTime-bounded OOM/cycle correlation; distinguish symptom selection from OOM domain and application cause; preserve missing/stale state. Add deterministic restart predicates and sufficient verification budget before enabling this runbook operationally.\n", "file": "RB-001-container-oom-restart-loop.md"}, {"id": "RB-002", "title": "Service/container health check failure", "status": "draft", "version": "1.0.0", "detector": "health_check_failed", "body": "# RB-002 \u2014 Service/container health check failure\n\n## Metadata\n\n```yaml\nid: RB-002\ntitle: Service/container health check failure\nstatus: draft\nowner: Argus Team\nversion: 1.0.0\ncreated: 2026-09-29\nlast_reviewed: 2026-09-29\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: health_check_failed\n```\n\n## Scope\n\nLinux Docker/Compose service with declared endpoint and dependencies. Record Engine version, immutable container ID, health configuration and probe origin. Docker `start-interval` requires Engine 25 or later; do not assume it on older installations. Exclude intentional shutdown/maintenance after checking change records. Apply [shared contracts](../RUNBOOK-CONVENTIONS.md); broader actions remain extensions.\n\n## Incident definition\n\nThe expected service is absent/stopped, Docker reports unhealthy, or a declared endpoint fails its configured acceptance contract. These are distinct observations. Docker health has its own `starting`, `healthy`, and `unhealthy` states and configured failure count; process state is separate. [Docker HEALTHCHECK](https://docs.docker.com/reference/dockerfile/#healthcheck)\n\n## User / service impact\n\nMeasure failed requests and affected routes. A broken health command can coexist with working user requests; an internal healthy endpoint can coexist with a failed public route. If only health telemetry is available, actual user impact remains unknown.\n\n## Trigger / detection conditions\n\nExisting `health_check_failed` checks `present=false`, `running=false`, `unhealthy=true`, or `endpoint_count>0 && endpoint_ok=false` on fresh snapshots. No duration is enforced in that detector. Proposed alert policy: sustain unexpected endpoint failure for `max(60 seconds, 2*S)` outside maintenance/startup grace, while severe user impact starts immediate investigation. Missing endpoint configuration or samples does not mean endpoint health.\n\n## Symptoms\n\nStopped/missing process, unhealthy status/failing streak, probe timeout, unexpected HTTP status, dependency errors or repeated transitions.\n\n## Plausible causes / hypotheses\n\nH1 process crash/startup failure; H2 health command/configuration mismatch; H3 process deadlock/event-loop blockage; H4 failed dependency makes this service a victim; H5 network/proxy/TLS path failure; H6 stale alert or already recovered service. Resource starvation can cause H3-like symptoms without a software deadlock.\n\n## Required evidence\n\nFresh identity/state, health command and timing settings, bounded health output, endpoint status/latency from the affected path, dependency observations, startup/change times, resource history and application errors. Missing a public vantage limits impact conclusions.\n\n## Required Argus tools\n\nExisting code, subject to deployment availability:\n\n| Tool / input | Purpose and output | Safety class |\n|---|---|---|\n| `get_container_status(container)` | ID, running/exit/OOM and health | `READ_ONLY_SENSITIVE` |\n| `check_container_health(container)` | Command, interval/timeout/retries/start period if supplied, last outputs | `READ_ONLY_SENSITIVE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Timed/redacted errors | `READ_ONLY_SENSITIVE` |\n| `check_http_endpoint(url, timeout_s=3)` | Allowlisted app-network HTTP result | `READ_ONLY_SENSITIVE` |\n| `check_connectivity(container)` | Declared dependency DNS/TCP observations | `READ_ONLY_SENSITIVE` |\n| `trace_request_path(container)` | Composite observations by declared hop; inspect child failures | `READ_ONLY_SENSITIVE` |\n| `get_container_resources(container)` / `get_cpu_history(container, minutes=30)` | Instant resources and CPU history to test starvation | `READ_ONLY_SAFE` |\n| `capture_diagnostic_snapshot(container)` | Evidence before restart | `READ_ONLY_SENSITIVE` |\n| `restart_container(container)` | Exact approved container restart via local dispatcher | `MUTATING_HIGH_RISK` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_external_probe_history(endpoint_id, minutes)` from a registered Blackbox/external vantage: probe origin, timestamps, status and latency, `READ_ONLY_SAFE`. Existing HTTP reads originate in the app network, not the public client path. Blackbox supports multiple probe protocols but must be explicitly deployed/configured. [Blackbox Exporter](https://github.com/prometheus/blackbox_exporter)\n\n**MISSING TOOL REQUIREMENT:** versioned deployment history and a bounded application-progress diagnostic for deadlock attribution. Full health timing/config fields are an extension if the inspected gateway omits them. No arbitrary health-command execution or container shell fallback.\n\n## Diagnostic workflow\n\n| Step | Action / why | Interpret and proceed |\n|---|---|---|\n| 1 | Status and trigger timestamps: verify current failure/identity | Missing/stopped: inspect exit; OOM \u2192 RB-001, other crash \u2192 RB-008. Running \u2192 2. |\n| 2 | Health config/output: distinguish test failure from process failure | No health check \u2192 rely on declared endpoint, never assume healthy. `starting` within approved grace \u2192 bounded observation. Failing executable/path or wrong port \u2192 H2; continue 3. |\n| 3 | Probe same configured application route and affected external path | Internal succeeds/external fails \u2192 H5, RB-009/RB-015/RB-016. Both succeed \u2192 confirm fresh sustained recovery. Both fail \u2192 4. |\n| 4 | Dependency matrix, then protocol/capacity evidence through RB-003 | Dependency failure \u2192 diagnose dependency; block victim restart. TCP success alone cannot clear dependencies. All dependencies healthy \u2192 5. |\n| 5 | Logs/resources/history and bounded application progress | Starvation \u2192 relevant resource runbook. Progress stops despite capacity/dependency health \u2192 H3 supported, not proved. Missing progress evidence \u2192 multiple hypotheses. |\n| 6 | Snapshot, policy proposal only if justified, then verify | Configuration failure needs owner correction; restart only for an evidenced process failure with enforceable predicates. |\n\n## Decision tree\n\n```text\nrunning? no -> OOM or non-OOM startup/crash investigation\n  yes -> Docker unhealthy? yes -> inspect test and startup grace\n         endpoint failing? no -> test misconfiguration or recovery\n           yes -> dependency failing? yes -> RB-003; protect victim\n                  external path only? yes -> network/proxy/TLS\n                  resource saturation? yes -> resource runbook\n                  process stalled + safe predicates? -> approved restart candidate\n                  otherwise -> insufficient_evidence / escalate\n```\n\n## Evidence interpretation\n\nAn unhealthy transition means the configured test failed, not that restart will fix it. Compare the exact tested path, expected status and dependencies. Require application evidence before calling a timeout a deadlock. Temporal overlap with deployment supports investigation, not automatic rollback.\n\n## False positives and edge cases\n\nLong startup, health test executable absent, authentication redirect, wrong expected status, cached success, a health endpoint with no dependency checks, no Docker health configured, probe credentials failing, maintenance or container replacement. Sanitize health commands/output because they can contain secrets.\n\n## Diagnosis outcome\n\nPermit `probable_root_cause`, `multiple_hypotheses`, `insufficient_evidence`, `incident_no_longer_present`, `wrong_runbook`. Include evidence for the failing layer, evidence against a failed dependency, and unobserved client paths. A missing external probe limits closure claims.\n\n## Mitigation\n\nOperator may divert traffic using an established service procedure. Argus may propose one allowed restart for an evidenced wedged process; do not repeatedly restart a booting or dependency-blocked service.\n\n## Recovery\n\nRestore Docker health where configured and the affected application route from its actual vantage. Dependency health and representative request success must agree.\n\n## Root-cause correction\n\nFix the health contract/startup grace, underlying application stall, resource constraint, or dependency/path defect. A restart is temporary recovery. Configuration deployment is a separately approved operator change.\n\n## Action safety\n\n`restart_container(container)` is `MUTATING_HIGH_RISK`: bind exact allowlisted name/ID, preserve snapshot, check dependency health, capacity, criticality, maintenance and incident freshness; blast radius includes in-flight requests and reconnects. Block unknown dependency state, active startup grace, missing predicate enforcement, closed gate, replaced ID, unapproved critical target or prior uncertain action. No mutating low-risk path is assumed. Traffic/config changes have no available write contract here and remain operator work with exact target/config version, rollback and approval.\n\n## Human-in-the-Loop\n\nShow failure layer, command versus endpoint evidence, outage risk, target/ID, exact restart arguments and verification window. Approval is single-use and digest-bound; denial/expiry produces no write. Apply shared precheck and audit rules.\n\n## Forbidden actions\n\n`FORBIDDEN`: disable health checks to clear alerts, restart victims of failed dependencies, arbitrary exec of health command text, dump env/config secrets, or unbounded restart attempts.\n\n## Evidence preservation\n\nSnapshot before restart; separately preserve health timing/output, external/internal probe results and relevant dependency refs. Missing snapshot components are recorded; do not erase the only failure evidence without operator escalation.\n\n## Verification\n\nAfter action completion, use three distinct source-fresh samples spanning at least `2*S`, then observe for `max(5 minutes, configured startup grace + two health-check intervals)`. All expected health and route checks pass, restart count stays stable, dependencies accept work. Any recurrence, stale probe or unavailable critical path fails closure. If `VERIFY_TIMEOUT` is shorter, escalate with provisional recovery. No-action recovery is external resolution.\n\n## Rollback\n\nRestart has no automatic undo. A separately reviewed health/config deployment must retain the previous config/image and restore it through its owner after evaluating whether rollback reintroduces the original defect.\n\n## Escalation\n\nApplication on-call for stalled/test-misconfigured process; platform/network owner for path failure; dependency owner via RB-003. Stop on absent evidence, write refusal, recurring failure or unknown restart result. Attach paired probe results, health settings, logs and timeline; request the missing progress/public-path observation next.\n\n## Recording / memory\n\nCommon record plus internal/external vantage, health config version, failure layer, startup grace, dependency exclusions, approval and post-action samples. Keep restored service separate from fixed defect.\n\n## Prevention / follow-up\n\nTest health endpoints under slow startup and dependency loss; document liveness/readiness purpose; retain external probes and configuration fingerprints; implement dependency-aware restart predicates.\n\n## Lab validation\n\nDisposable API fixture: (A) health command checks an unused port while its real endpoint remains healthy; (B) configured dependency is stopped; (C) test endpoint is deliberately blocked in a controllable handler while dependencies stay healthy. Use a 15-second test interval and 3 failures; impose a 5-minute abort. Expect health detector \u2192 RB-002; H2 for A, RB-003/victim protection for B, possible process stall for C. A/B must not produce victim restart. For C exercise denial then one new approved proposal after snapshot; remove the injected stall through the lab fixture and verify fresh internal/external health. Retain detection, evidence, diagnosis, policy refusal/approval, action, verification and record artifacts. Also replay absent probe data: no healthy conclusion. No lab result is claimed.\n\n## References\n\n- [Docker HEALTHCHECK](https://docs.docker.com/reference/dockerfile/#healthcheck) \u2014 status/timing semantics.\n- [Blackbox Exporter](https://github.com/prometheus/blackbox_exporter) \u2014 independent probe capabilities.\n- [Argus code/policy assessment](../RUNBOOK-ASSESSMENT.md) \u2014 detector and execution constraints.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nPublic-path history, complete health timing and application progress evidence.\n\n### Missing tools\n\n`get_external_probe_history`; bounded application-progress and deployment-history contracts.\n\n### Tool improvements\n\nExpose health config safely; preserve per-child freshness/errors in composites; report exact probe acceptance contract.\n\n### Detector improvements\n\nDuration/startup/maintenance handling and independent endpoint freshness; implement restart predicates rather than prose-only requirements.\n", "file": "RB-002-health-check-failed.md"}, {"id": "RB-003", "title": "Dependency unavailable", "status": "draft", "version": "1.0.0", "detector": "dependency_unavailable", "body": "# RB-003 \u2014 Dependency unavailable\n\n## Metadata\n\n```yaml\nid: RB-003\ntitle: Dependency unavailable\nstatus: draft\nowner: Argus Team\nversion: 1.0.0\ncreated: 2026-09-29\nlast_reviewed: 2026-09-29\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: dependency_unavailable\n```\n\n## Scope\n\nDeclared dependencies of Docker/Compose services on Host T. Probe from the affected application network; the existing network probe is nearby, not inside the application's exact namespace. Record Docker/network version, endpoint contract, TLS mode and PostgreSQL major where relevant. Exclude undeclared Internet targets and service discovery guesses. [Common contracts](../RUNBOOK-CONVENTIONS.md) apply.\n\n## Incident definition\n\nA declared dependency cannot complete its expected interaction from the affected service path. Dependency state, network reachability, protocol admission and capacity are different layers. A failure observed only from Host A does not establish Host T application connectivity. Docker network attachment and DNS behavior depend on network configuration. [Docker networking](https://docs.docker.com/engine/network/)\n\n## User / service impact\n\nMap failed transactions/routes to dependency edges. Several failing frontends may share one dependency. Observe partial functionality and cache behavior; do not infer a total outage from one failed dependency check.\n\n## Trigger / detection conditions\n\nExisting detector selects `dependency_unavailable` when a fresh `dep.<name>.up` or `dep.<name>.accepting` is false. It has no sustained-duration condition. Proposed alert duration: two scrapes or 60 seconds, calibrated to the service; high-impact failures start immediate investigation. A missing dependency series is unknown, not up. Unsupported dependencies need topology and detector work before automated routing.\n\n## Symptoms\n\nResolution errors, connection refusal/timeouts, handshake/authentication failures, protocol errors, database admission failure, upstream timeouts and cascading health failures.\n\n## Plausible causes / hypotheses\n\nH1 wrong/missing DNS record; H2 network attachment/route/firewall fault; H3 listener/service down; H4 TLS or authentication mismatch; H5 capacity exhausted by legitimate load, leaking client or retry storm; H6 dependency internal failure; H7 probe misconfiguration/staleness. Multiple failing layers can coexist.\n\n## Required evidence\n\nDeclared source/target/protocol and expected route, both identities, DNS answer and error, target-network reachability, listener/protocol results, capacity and internal health, victim error, client/load history and correlated changes. Compare source vantage explicitly before treating disagreement as contradiction.\n\n## Required Argus tools\n\nExisting contracts, if published and allowed:\n\n| Tool / input | Purpose / relevant output | Safety class |\n|---|---|---|\n| `check_connectivity(container)` | Dependency DNS/TCP matrix from app-net probe | `READ_ONLY_SENSITIVE` |\n| `check_dns(name)` | Resolution status and addresses for approved name | `READ_ONLY_SENSITIVE` |\n| `get_container_network(container)` | Network attachment, DNS aliases and ports | `READ_ONLY_SENSITIVE` |\n| `check_tcp_connection(host, port, attempts=3, timeout_s=2)` | At most 5 connects; success ratio, latency, errors | `READ_ONLY_SAFE` |\n| `check_http_endpoint(url, timeout_s=3)` | Exact allowlisted HTTP response and latency | `READ_ONLY_SENSITIVE` |\n| `get_container_status(container)` | Dependency process/health and identity | `READ_ONLY_SENSITIVE` |\n| `inspect_database_health(container)` | PostgreSQL states, capacity, waits; monitor view only | `READ_ONLY_SENSITIVE` |\n| `get_db_connection_history(database, minutes=30)` | Client-group connection trends | `READ_ONLY_SENSITIVE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Victim/dependency protocol error context | `READ_ONLY_SENSITIVE` |\n| `correlate_incident_timeline(container, minutes=30)` | Related error/event chronology; not causal proof | `READ_ONLY_SENSITIVE` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_route_diagnostics(source_id, endpoint_id)` returns approved route/interface/error metadata without arbitrary host input, `READ_ONLY_SENSITIVE`; `check_tls_endpoint(endpoint_id)` returns SNI/chain/time validation, no keys, `READ_ONLY_SENSITIVE`; `check_database_admission(database_id, role_profile)` uses a preconfigured ordinary-role credential in the probe, returns a sanitized connection result and source time, `READ_ONLY_SENSITIVE`. Existing TCP and count-based database flags do not implement these contracts.\n\n## Diagnostic workflow\n\n| Step | Action / why | Interpretation and next step |\n|---|---|---|\n| 1 | Bind victim/dependency edge and fresh trigger | Wrong target or obsolete topology \u2192 correct selection/escalate. Known edge \u2192 2. |\n| 2 | Resolve exact declared name from app-network probe | DNS failure \u2192 H1/RB-009. Valid but unexpected answer \u2192 configuration/ownership investigation. Correct answer \u2192 3. |\n| 3 | Compare attachments and bounded route evidence | Wrong network/route supports H2. Probe lacks actual namespace equivalence \u2192 record limitation. Continue with 4; do not claim route is good just because no tool exists. |\n| 4 | Connect to expected port; inspect dependency state | Refusal suggests listener/path rejection; timeout cannot distinguish filtering from overload. TCP success \u2192 5, not \u201cdependency healthy.\u201d |\n| 5 | Verify TLS where used, then configured application protocol/admission | Certificate failure \u2192 RB-016. Auth failure \u2192 owner correction. HTTP/database error \u2192 6. Never disable TLS verification. |\n| 6 | Read capacity/internal state and client trends | PostgreSQL slot pressure \u2192 RB-004; lock wait \u2192 RB-013; storage \u2192 RB-019. Error with spare capacity \u2192 dependency logs/config owner. |\n| 7 | Compare timing and victim errors; identify supported failing layer | The earliest symptom is a hypothesis lead. If several layers remain unexplained, record multiple hypotheses; choose no speculative write. |\n\n## Decision tree\n\n```text\nDNS -> network/route -> TCP -> TLS if used -> protocol -> capacity -> internal health\n fail     fail         fail      fail          fail        fail          fail\nRB-009  RB-009      listener/  RB-016       auth/config  RB-004/     dependency\n                    path                   /service     RB-013      owner\n```\n\nStop at the first demonstrated failure to avoid unnecessary higher-layer probes, but inspect downstream failures if new evidence indicates multiple faults. No failed layer authorizes restarting the victim.\n\n## Evidence interpretation\n\nTCP establishes transport acceptance only. PostgreSQL can reserve slots for privileged roles; monitor success does not establish normal client admission. [PostgreSQL 16 connection settings](https://www.postgresql.org/docs/16/runtime-config-connection.html)\n\nApplication errors plus a matching failed layer support dependency attribution. A healthy nearby probe weakens a global outage but cannot exclude client-specific credentials, namespace or policy faults.\n\n## False positives and edge cases\n\nDNS caching/round robin, IPv4/IPv6 differences, wrong port, split network namespaces, reserved monitoring slots, probes with different credentials, failover, stale topology, shared dependency labels and clock skew. Connection attempts are bounded to avoid amplifying overload.\n\n## Diagnosis outcome\n\nUse `probable_root_cause` with failing layer and evidence; otherwise `multiple_hypotheses` or `insufficient_evidence`. Permit `incident_no_longer_present` only with fresh dependency and victim success; `wrong_runbook` when the dependency is healthy and the local application is defective.\n\n## Mitigation\n\nCoordinate dependency-owner containment, backoff or controlled load reduction. These are operator procedures or separately gated extensions. Argus must not restart the incident's dependent service under RB-003.\n\n## Recovery\n\nThe dependency accepts the intended protocol under normal credentials and representative demand; victims then recover without forced reconnect storms. Verify both layers independently.\n\n## Root-cause correction\n\nRepair DNS/network/TLS/config, connection management, capacity or dependency defect according to the supported branch. A temporary pause/failover does not prove the defect was fixed.\n\n## Action safety\n\nAny dependency restart/stop/reconfiguration is `MUTATING_HIGH_RISK` and belongs to its owning runbook and separately authorized target. Require exact target/ID, diagnosed mechanism, capacity/replication assessment, protected-service policy and rollback. Default here is read-only/escalate. Existing lab stop/session actions are not permission to act on arbitrary clients. Block victim restart even if a model proposes it; block writes with unknown owners, absent predicates, unresolved shared impact or unavailable audit.\n\n## Human-in-the-Loop\n\nFor an action proposed by the owning runbook, show dependency and victims, exact arguments, expected capacity benefit, transaction/request risk and source evidence. All writes need the shared frozen-proposal gate; no approval for \u201cfix connectivity\u201d as an open-ended task.\n\n## Forbidden actions\n\n`FORBIDDEN`: restart dependent services to free dependency capacity; scan arbitrary ports; flush firewall/DNS broadly; reveal credentials; bypass TLS; arbitrary SQL/session termination; switch to Host A probes and claim equivalent evidence.\n\n## Evidence preservation\n\nSave topology version, source vantage, protocol errors, resource/client history and paired dependency/victim snapshots before an owning-runbook action. Preserve redacted refs rather than packet payloads or secrets.\n\n## Verification\n\nAfter action/operator-change completion, require fresh DNS/TCP/TLS/protocol results as applicable, ordinary-role admission for databases, plus victim endpoint recovery. Three distinct post-action samples, then 5 minutes without renewed failures or growing retry pressure. An unobservable TLS/admission layer limits closure. Timeout or recurrence escalates; no automatic victim restart. Record externally resolved incidents separately.\n\n## Rollback\n\nThis runbook performs no default write. The dependency owner must retain the previous network/config/deployment state and define its restoration before a change; rollback itself needs approval and must not knowingly restore harmful load.\n\n## Escalation\n\nNetwork owner for DNS/route/TCP; PKI owner for TLS; DBA for capacity/protocol; application owner for client-specific failures. Stop at read budget, missing vantage or unverified identity. Attach failing layer, counterevidence, affected graph, timestamps and next missing probe.\n\n## Recording / memory\n\nCommon record plus source network, dependency edge, layer results, client-role profile, victim protection decision, missing capabilities and recovery of each victim.\n\n## Prevention / follow-up\n\nMaintain topology and protocol probes, bounded pools/backoff, dependency capacity budgets and client-vantage tests. Treat a shared outage as correlated incidents, preserving separate evidence.\n\n## Lab validation\n\nDisposable API/PostgreSQL pair: sequentially inject (A) a wrong declared DNS name, (B) a closed test listener, (C) valid TCP with exhausted ordinary connection slots. Capture baseline and restore each fault before the next; cap each at 5 minutes. Expect RB-003, layer-specific evidence and H1/H3/H5; C branches to RB-004. Assert zero victim restarts, refusal of unknown target/port and no action on expired approval. Operator fixes the exact fixture; observe fresh dependency admission and API recovery for 5 minutes, then record all eight lifecycle stages. Replay a successful privileged probe while ordinary admission fails: do not close. Tests remain unexecuted.\n\n## References\n\n- [Docker networking](https://docs.docker.com/engine/network/) \u2014 network and name-resolution context.\n- [PostgreSQL connection settings](https://www.postgresql.org/docs/16/runtime-config-connection.html) \u2014 admission and reserved slots.\n- [Argus assessment](../RUNBOOK-ASSESSMENT.md) \u2014 probe origin and policy boundaries.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nActual source-namespace equivalence, TLS/admission and route evidence.\n\n### Missing tools\n\n`get_route_diagnostics`, `check_tls_endpoint`, `check_database_admission`.\n\n### Tool improvements\n\nLabel transport-only checks accurately; distinguish calculated DB acceptance from observed admission; propagate composite errors and source times.\n\n### Detector improvements\n\nSustained/role-aware dependency failure, missing-series handling, topology validation and deterministic victim protection across all proposal paths.\n", "file": "RB-003-dependency-unavailable.md"}, {"id": "RB-004", "title": "PostgreSQL connection exhaustion", "status": "draft", "version": "1.0.2", "detector": "postgresql_connection_exhaustion", "body": "# RB-004 \u2014 PostgreSQL connection exhaustion\n\n## Metadata\n\n```yaml\nid: RB-004\ntitle: PostgreSQL connection exhaustion\nstatus: draft\nowner: Argus Team\nversion: 1.0.2\ncreated: 2026-09-29\nlast_reviewed: 2026-10-07\nsource_review_date: 2026-09-29\nlast_tested: 2026-10-07\ndetector: postgresql_connection_exhaustion\nparent_detector: dependency_unavailable\n```\n\n## Scope\n\nPostgreSQL 16 and declared application clients on Host T. For other majors review matching admission/role settings. Distinguish pooler capacity from server capacity; this procedure assumes direct PostgreSQL observations and needs pooler telemetry when one intervenes. Apply [common contracts](../RUNBOOK-CONVENTIONS.md). Argus registers the standalone detector `postgresql_connection_exhaustion` (T-0020): ordinary-slot usage at or above 90 % for 5 minutes, from the db-probe's metrics.\n\n## Incident definition\n\nOrdinary application sessions are rejected because usable connection capacity is exhausted. SQLSTATE `53300` is `too_many_connections`; connection refusal, authentication error or timeout alone does not prove this condition. [PostgreSQL error codes](https://www.postgresql.org/docs/16/errcodes-appendix.html)\n\n## User / service impact\n\nNew requests/jobs cannot acquire sessions; existing pooled work may continue. Establish affected roles/routes and pool wait time; a live database and successful privileged monitor can coexist with user failure.\n\n## Trigger / detection conditions\n\nBranch from RB-003 when fresh victim errors report admission failure and database capacity corroborates it. Proposed standalone warning: ordinary-slot utilization above 90% for 5 minutes, with critical selection on actual admission failure. These values are calibration defaults, not deployed rules. Role/database/pool limits can cause earlier rejection; unknown capacity must not be divided into a misleading ratio.\n\n## Symptoms\n\n`53300`, reserved-slot messages, rising session count, pool acquisition timeouts, many sessions attributed to one client, old transactions or reconnect bursts.\n\n## Plausible causes / hypotheses\n\nH1 legitimate concurrent demand; H2 retained/leaked sessions; H3 idle transactions; H4 aggregate pool maxima oversized after scale-out; H5 retry/reconnect storm; H6 client defect; H7 role/database/pooler-specific limit rather than global exhaustion. H3 is an observed state, not automatic evidence of H2/H6. Session state, wait event and transaction age are separate dimensions. [PostgreSQL activity statistics](https://www.postgresql.org/docs/16/monitoring-stats.html#MONITORING-PG-STAT-ACTIVITY-VIEW)\n\n## Required evidence\n\nExact SQLSTATE and role context; version, configured/reserved capacity, counts by backend type/application/role/address/state; `state_change`, transaction age and wait events; historical growth, pool settings/replicas and workload/retry history; fresh ordinary-role admission. Corroborate `application_name` with role/address and owned workload: the name alone is not a secure identity.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / relevant output | Safety class |\n|---|---|---|\n| `inspect_database_health(container)` | Capacity, states, application groups, long transactions and wait counts | `READ_ONLY_SENSITIVE` |\n| `get_db_connection_history(database, minutes=30)` | Per-application growth and coverage | `READ_ONLY_SENSITIVE` |\n| `get_socket_summary(container)` | Client-namespace socket groups; not proof of one process's ownership | `READ_ONLY_SENSITIVE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | SQLSTATE, pool/retry errors after redaction | `READ_ONLY_SENSITIVE` |\n| `inspect_service_config(container, config='main')` | Declared allowlisted pool configuration; no env dump | `READ_ONLY_SENSITIVE` |\n| `correlate_incident_timeline(container, minutes=30)` | Growth versus victim error timing | `READ_ONLY_SENSITIVE` |\n| `capture_diagnostic_snapshot(container)` | Client state before containment | `READ_ONLY_SENSITIVE` |\n| `scale_service(container, replicas=0)` | Registered single-container stop; lab gate only for named worker | `MUTATING_HIGH_RISK` |\n| `execute_runbook_action(action, database, application_name, min_idle_seconds)` | Registered `db.terminate_idle_in_transaction`; requires additional predicates below | `MUTATING_HIGH_RISK` |\n\nThe two writes exceed the restart-only production architecture. Their presence in the lab registry is not production authorization. The inspected lab gate allows only specific targets and incident classes, not a new invented RB-004 class.\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `check_database_admission(database_id, role_profile)` performs one bounded ordinary-role connect and harmless read, returning SQLSTATE/source time with no credentials. **MISSING TOOL REQUIREMENT:** `get_db_activity(database_id, limit)` returns redacted session identity (`pid`, `backend_start`), role/address/state and age, and `get_pool_history(service_id, minutes)` exposes active/idle/waiting/pool limits. All are `READ_ONLY_SENSITIVE`. Existing health summaries are useful but do not provide an approval-bound exact session set or pooler diagnosis.\n\n## Diagnostic workflow\n\n| Step | Action / purpose | Interpretation and next step |\n|---|---|---|\n| 1 | Obtain victim SQLSTATE plus dependency TCP/protocol state | Not admission exhaustion \u2192 RB-003. Confirmed/possible slot issue \u2192 2. |\n| 2 | Read health and role/version settings; request ordinary admission | Compute capacity relevant to the client, not privileged monitor. Missing privilege/role semantics \u2192 insufficient capacity evidence; continue bounded reads. |\n| 3 | Read connection history and activity groups | Uniform active growth follows demand \u2192 H1. One group accumulating retained sessions \u2192 H2/H3; many clients reconnecting \u2192 H5. |\n| 4 | Compare pools \u00d7 replicas, client sockets and transaction state | Pool envelope exceeds budget \u2192 H4. Persistent old idle transactions plus repeated client growth support defective lifecycle; ordinary idle pooled sessions alone do not. |\n| 5 | Correlate changes/load and waits | Slow/blocked transactions may retain capacity secondarily \u2192 RB-013. Preserve alternatives if growth predates available history. |\n| 6 | Snapshot client and DB evidence; choose bounded containment | Stop only a proven, explicitly non-critical producer under an accepted profile; otherwise DBA escalation. Session termination is a separate guarded proposal. |\n| 7 | Verify new admission and victims, then watch recurrence | Freed slots without fixed client behavior are temporary containment. |\n\n## Decision tree\n\n```text\nordinary admission rejected?\n  no -> pool/application/network branch or stale event\n  yes -> global ordinary capacity full?\n           no -> role/database/pooler limit or authentication; investigate\n           yes -> one client growing? -> ownership + session-state investigation\n                  all active with load? -> capacity/concurrency\n                  pools oversized? -> pool budget\n                  rapid reconnects? -> retry storm\n         safe owned non-critical source + enforced policy? -> HITL containment\n         otherwise -> DBA / insufficient_evidence\n```\n\n## Evidence interpretation\n\nFor PostgreSQL 16, ordinary capacity must account for both `reserved_connections` and `superuser_reserved_connections`, with the caller's role privileges considered. Do not assume a fixed subtraction of three. [PostgreSQL connection settings](https://www.postgresql.org/docs/16/runtime-config-connection.html)\n\nMonotonic session growth at steady workload supports a leak hypothesis; long transactions can instead reflect locks or legitimate work. Monitor-view \u201caccepting\u201d in current code is a count calculation, not a connection test.\n\n## False positives and edge cases\n\nConnection pool startup, failover storm, spoofed/shared application names, NAT/shared client address, monitor reserve, low role limit, dropped sampling, stale cached DB response, pooler multiplexing, prepared transactions and insufficient monitor privileges. Query text can contain secrets/business data; do not send raw query literals to the model.\n\n## Diagnosis outcome\n\nAllow all five common outcomes. A probable client defect needs ownership, growth and lifecycle evidence, plus counterevidence against demand/locks. Otherwise record the observable exhaustion and unresolved mechanism explicitly.\n\n## Mitigation\n\nContain an approved non-critical leaking client; this is **containment/recovery**, not a durable fix. Operator-controlled backoff/load reduction can reduce admission pressure. Terminating eligible idle sessions may briefly free slots but the client can recreate them.\n\n## Recovery\n\nOrdinary clients can establish fresh sessions and complete requests; capacity has sustained headroom and pool wait time returns toward baseline. A stopped batch workload represents reduced functionality and must be recorded.\n\n## Root-cause correction\n\nRepair transaction commit/rollback/close discipline, bounded pool sizing across replicas, retry budgets and timeouts appropriate to the application. PostgreSQL idle-session/transaction settings have different effects; validate with pool behavior and deployed version rather than setting a universal timeout. [Client connection defaults](https://www.postgresql.org/docs/16/runtime-config-client.html)\n\n## Action safety\n\n| Write | Exact bounds / prerequisites | Risk and execution blocks |\n|---|---|---|\n| `scale_service(container, replicas=0)` | Accepted broader profile; named non-critical owner, snapshot, proven harmful contribution; one stop | Lost batch work/backlog; protect API, DB, migration, monitor/control plane. Block unknown ownership, client still needed for recovery or production restart-only profile. |\n| `execute_runbook_action(action='db.terminate_idle_in_transaction', database, application_name, min_idle_seconds)` | Exact DB identity; allowlisted client **and** role/address; approved session identities and backend start times; still idle-in-transaction; age threshold rechecked; candidate-count cap | Rolls back work and may cause reconnects. Block protected roles/apps, changed/reused PID, active transactions, ambiguous DB binding or missing server-side candidate revalidation. |\n\nBoth are `MUTATING_HIGH_RISK`. Proposed minimum idle age is 60 seconds for lab calibration (existing schema allows 30\u201386400); it is not proof a session is disposable. Protected names include `postgres`, `migration-runner`, `critical-api`, plus actual topology owners. Application name alone cannot authorize termination. The present signature does not bind a session set, so this release requirement is missing and production execution stays blocked.\n\n## Human-in-the-Loop\n\nApproval identifies source client/DB, exact stop or candidate session set, rolled-back-work risk, denied/protected candidates, expected freed capacity and recurrence plan. Stopping a worker does not approve terminating sessions or restarting it later. The approver must own the affected scope.\n\n## Forbidden actions\n\n`FORBIDDEN`: restart database/victims to clear slots; terminate arbitrary sessions; unrestricted SQL; trust application name as authenticated identity; increase `max_connections` without memory/capacity review; expose connection strings; label a stopped defective client permanently fixed.\n\n## Evidence preservation\n\nSave redacted session grouping/identities, pool config fingerprint, 30-minute history and client snapshot before stop/termination. Preserve no business rows or credentials. Record missing session details as an action blocker.\n\n## Verification\n\nAfter the completed action, three distinct fresh admission/capacity samples and victim requests; then at least 5 minutes and one normal pool-recycle interval. Proposed headroom target: utilization below 80%, calibrated to required burst capacity. No renewed connection growth/admission error; intended client stop confirmed if used. A privileged monitor alone cannot pass. Recurrence, stale cache or missing admission tool prevents closure and triggers DBA escalation.\n\n## Rollback\n\nTerminated sessions/rolled-back transactions cannot be restored automatically. Starting a stopped client is a new approved action after correction or with a reviewed bounded pool; otherwise it recreates the incident. Preserve previous pool/timeout configuration for owner-managed rollback.\n\n## Escalation\n\nDBA and client owner for ambiguous ownership, protected sessions, missing predicates, failed containment or recurrence. Attach role-specific capacity, client/session evidence, failed admission, lock alternatives and approval/action state; request a reviewed exact session set or pool diagnosis next.\n\n## Recording / memory\n\nCommon record plus ordinary versus reserved capacity, client attribution confidence, transaction state/age, stopped functionality, freed slots, admission proof and unresolved lifecycle defect.\n\n## Prevention / follow-up\n\nBudget aggregate pools, bound retry storms, alert on per-client growth, test transaction cleanup and protect monitor capacity with least-privilege roles. Session cancellation/termination behavior must be assessed by the DBA. [PostgreSQL server signaling](https://www.postgresql.org/docs/16/functions-admin.html#FUNCTIONS-ADMIN-SIGNAL)\n\n## Lab validation\n\nDisposable PostgreSQL 16 with `max_connections=20`, 3 superuser-reserved slots, 0 extra reserved slots; a dedicated ordinary test role opens and retains one transaction per second, capped at 20 attempts. Use a separate monitor and synthetic API. Expect fresh `53300`, growing client/idle-transaction counts and RB-004\u2192RB-005 selection. Record whether code labels are only calculated. Deny a stop proposal: zero writes; then separately approve one exact non-critical fixture stop under the lab profile. Termination lacking bound candidates must be refused, including a forged application name and PID reuse fixture. Verify ordinary connection/request recovery for 5 minutes, record containment not cure, and restore only disposable lab data. Repeat with legitimate active sessions and oversized idle pools: do not call either a proven leak. Tests are specified, not run.\n\n## References\n\n- [PostgreSQL 16 errors](https://www.postgresql.org/docs/16/errcodes-appendix.html), [activity statistics](https://www.postgresql.org/docs/16/monitoring-stats.html), [connection settings](https://www.postgresql.org/docs/16/runtime-config-connection.html).\n- [Client timeouts](https://www.postgresql.org/docs/16/runtime-config-client.html) and [server signaling](https://www.postgresql.org/docs/16/functions-admin.html#FUNCTIONS-ADMIN-SIGNAL).\n- [Argus assessment](../RUNBOOK-ASSESSMENT.md) \u2014 lab profile, policy and monitor limitations.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nOrdinary-role admission, pool demand/waiters, source timestamps, exact candidate identity and role-aware capacity.\n\n### Missing tools\n\n`check_database_admission`, `get_db_activity`, `get_pool_history`.\n\n### Tool improvements\n\nRedact query literals; distinguish calculated/observed acceptance; bind DB and candidate sessions, protected roles, count cap, state/age recheck and immutable backend identity in the termination gateway.\n\n### Detector improvements\n\nStandalone capacity/admission detector and alert are missing; preserve RB-003 branching. Evaluate stop/termination prerequisites in deterministic code; prose preconditions are insufficient.\n", "file": "RB-004-postgresql-connection-exhaustion.md"}, {"id": "RB-005", "title": "Host disk almost full", "status": "draft", "version": "1.0.3", "detector": "disk_pressure", "body": "# RB-005 \u2014 Host disk almost full\n\n## Metadata\n\n```yaml\nid: RB-005\ntitle: Host disk almost full\nstatus: draft\nowner: Argus Team\nversion: 1.0.3\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: 2026-10-09\ndetector: disk_pressure\n```\n\n## Scope\n\nApproved Linux filesystems backing Docker, logs or application storage on Host T. Record mount/device/namespace, filesystem type and Docker storage/log driver. Exclude device-latency-only incidents (RB-010); database-owned storage branches to RB-019. [Shared contracts](../RUNBOOK-CONVENTIONS.md) apply. Detector: `disk_pressure` (T-0024): a declared mount of the host target at 90 % or more for 5 minutes, with the time to full at the 15-minute fill rate.\n\n## Incident definition\n\nWritable byte or inode headroom is inadequate for expected growth, or writes already fail for capacity reasons. Distinguish available blocks for ordinary users from all free blocks, and inspect inode availability separately. [Linux statvfs](https://man7.org/linux/man-pages/man3/statvfs.3.html)\n\n## User / service impact\n\nPossible failed writes, broken logging, database interruption, deploy failure and loss of incident evidence. Identify the mount actually used by the failing workload; a full unrelated mount does not establish its impact.\n\n## Trigger / detection conditions\n\nProposed detector/alert: relevant mount available bytes below 10% for 5 minutes, available inodes below 5%, or sustained positive growth predicting exhaustion within 1 hour; urgent on corroborated ENOSPC. Thresholds need per-filesystem calibration and a matching implemented detector before routing to Argus. Prediction is valid only over a representative growth window. Missing/read-only/unmounted filesystems are explicit states, not zero usage.\n\n## Symptoms\n\nENOSPC, failed log/database writes, deployment errors, declining byte/inode availability; discrepancies between directory totals and filesystem allocation.\n\n## Plausible causes / hypotheses\n\nH1 image/build artifacts; H2 container/journal/application logs; H3 valuable application/database/volume growth; H4 many small files exhausting inodes; H5 deleted files still held open; H6 wrong mount, filesystem reservation/quota or read-only failure; H7 rapid current workload growth. Disk percentage alone identifies none of these.\n\n## Required evidence\n\nMount identity, available bytes/inodes, slope and coverage, Docker categories including stopped containers/volumes, approved directory sizes with partial flag, logging configuration, open-deleted ownership and affected application's error. Do not add directory totals from overlapping paths or shared image layers as independent usage.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `get_disk_usage(path=None)` | Available/used bytes and inode headroom; allowed paths `/`, `/var/lib/docker`, `/var/log`, `/tmp` | `READ_ONLY_SAFE` |\n| `get_disk_history(minutes=60)` | Root-filesystem history and linear time-to-full estimate only | `READ_ONLY_SAFE` |\n| `get_directory_sizes(path)` | Bounded partial scan of allowlisted Docker/log/tmp directories | `READ_ONLY_SENSITIVE` |\n| `get_docker_disk_usage()` | Images, writable layers, volumes and reclaimable cache | `READ_ONLY_SAFE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Write errors and growth context | `READ_ONLY_SENSITIVE` |\n| `get_container_status(container)` | Identity and available structured configuration | `READ_ONLY_SENSITIVE` |\n| `clean_docker_cache(mode)` | Registered `build_cache` or `dangling_images` only; inspected gate closed | `MUTATING_HIGH_RISK` |\n\nDirectory `path` is a fixed enum, not arbitrary filesystem exploration. Its successful return may still be partial; never infer a complete ranking from a timed-out scan.\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_filesystem_history(mount_id, minutes)` with bytes/inodes/source times; `get_open_deleted_files(mount_id, limit)` with owner, bytes and no content; `get_log_storage_usage(service_id)` with container/journal/application category, logging driver and rotation policy; `get_filesystem_constraints(mount_id)` for quotas/read-only state. The first is `READ_ONLY_SAFE`; ownership/configuration reads are `READ_ONLY_SENSITIVE`. Use approved mount IDs, not arbitrary paths.\n\n**MISSING TOOL REQUIREMENT:** a cleanup preview/commit contract bound to reclaimable object IDs, minimum age, retained rollback images and maximum reclaim budget. Existing `clean_docker_cache(mode)` does not express all these bounds.\n\n## Diagnostic workflow\n\n| Step | Action / reason | Interpret / next step |\n|---|---|---|\n| 1 | Disk usage plus failing-write context | Bind actual mount; bytes healthy/inodes low \u2192 H4. Read-only/permission error \u2192 H6, do not prune. |\n| 2 | Correct mount's history | Estimate time-to-full only with positive stable growth and coverage. Root-only history cannot explain a separate data disk. Immediate exhaustion \u2192 owner escalation while collecting bounded evidence. |\n| 3 | Docker usage and allowlisted directory sizes | Cache/images \u2192 potential H1; logs \u2192 H2; volume/data \u2192 H3. Partial scans leave attribution incomplete. |\n| 4 | Compare filesystem allocation with visible named files | Large unexplained difference \u2192 H5/reservations/mount layering; request open-deleted/constraint tools rather than more deletion. |\n| 5 | Confirm owner/retention and ongoing growth | Valuable/unknown data \u2192 protect and escalate. Reclaimable cache with accepted preview/policy \u2192 one HITL cleanup candidate; otherwise operator intervention. |\n| 6 | Capture before-state, act only through approved procedure, verify same mount | Freed space on another filesystem does not satisfy recovery. |\n\n## Decision tree\n\n```text\nwrite capacity failure on identified mount?\n  bytes low -> attributable cache / logs / valuable data / unexplained allocation\n  inodes low -> bounded small-file ownership investigation\n  neither -> quotas / read-only / permissions / wrong mount\nreclaimable objects + enforced preview + policy? -> HITL bounded cleanup\nunknown/protected data or missing evidence? -> no deletion; escalate\n```\n\n## Evidence interpretation\n\nRemoving a pathname does not free an open file's storage until references are released. Investigate the owning process instead of repeating unlink operations. [Linux unlink](https://man7.org/linux/man-pages/man2/unlink.2.html)\n\nBuild cache cleanup is a distinct operation; broad system prune also targets other object classes and is inappropriate as a default diagnostic action. [Docker builder prune](https://docs.docker.com/reference/cli/docker/builder/prune/), [system prune](https://docs.docker.com/reference/cli/docker/system/prune/)\n\n## False positives and edge cases\n\nBind/overlay mounts, reserved blocks, inode exhaustion with free bytes, sparse files, deleted-open files, Docker sharing, quota limits, a disappearing mount, canceled scan and one-time build growth. A linear prediction is not a deadline guarantee.\n\n## Diagnosis outcome\n\nAll five common outcomes are allowed. Probable cause identifies mount, owner/category, allocation and growth evidence, with competing explanations considered. Unknown owner or partial scan supports `insufficient_evidence`, not arbitrary cleanup.\n\n## Mitigation\n\nOperator pauses a proven non-critical producer or expands capacity through a reviewed procedure. Narrow cache cleanup is optional only after separate release of its missing bounds. Preserve enough space for audit/evidence; do not fill the affected disk with snapshots.\n\n## Recovery\n\nSame mount has sufficient byte/inode reserve, affected service resumes expected operations, and current growth is controlled. Reclaiming space while the source keeps filling it is temporary relief.\n\n## Root-cause correction\n\nConfigure retention/rotation, fix excessive logging, bound artifact retention or resize/migrate legitimate data. For Docker JSON logging, configure rotation through supported driver options; daemon defaults do not retroactively reconfigure existing containers. Never edit Docker-managed log files directly. [Docker JSON-file logging](https://docs.docker.com/engine/logging/drivers/json-file/)\n\n## Action safety\n\nCleanup is `MUTATING_HIGH_RISK`: exact approved host, enum mode, immutable preview, reclaimable-only objects, retention/rollback-image protection, no volumes, fixed budget, fresh revalidation and one execution. Blast radius includes future builds/deploy rollback. Block unknown ownership, missing preview bounds, active references, insufficient benefit, ongoing uncontrolled growth or closed gate. Operator log rotation/capacity changes need exact service/mount, retention/backup plan and separate approval; no generic model filesystem action exists.\n\n## Human-in-the-Loop\n\nShow predicted relief on the actual mount, selected objects, irreversible deletion, retained rollback assets, growth estimate and recovery target. Approval of a cache mode does not authorize deleting logs or volumes. Current production restart-only profile blocks cleanup.\n\n## Forbidden actions\n\n`FORBIDDEN`: unrestricted `docker system prune`, volume deletion, arbitrary `rm`/truncate, removing database/WAL files, editing Docker logs, restarting Docker blindly, deleting unknown data or increasing scan scope to arbitrary paths.\n\n## Evidence preservation\n\nSave compact mount/usage/category/owner summaries remotely or to a healthy approved evidence sink. Preserve a bounded redacted sample and retention decision before log operations; snapshot failure under disk pressure is explicitly recorded and escalated.\n\n## Verification\n\nThree source-fresh observations of the same mount after action, then a 15-minute growth window. Proposed recovery reserve: at least 15% bytes and 10% inodes, or the larger service-specific operating reserve; time-to-full must no longer breach policy. Confirm real service operations and no renewed ENOSPC. Fast regrowth, wrong-mount relief, stale data or missing write-health evidence fails verification. Do not claim sustained recovery if timeout is shorter than this window.\n\n## Rollback\n\nDeleted cache/log data has no automatic undo. Rebuilding cache may consume time/storage and is not a recovery guarantee. Configuration changes retain previous settings; owner rollback must not re-enable unbounded growth. Volume/data restoration belongs to a tested backup procedure, never this cleanup path.\n\n## Escalation\n\nPlatform/storage owner for unknown allocation, quotas, open-deleted files or impending exhaustion; DBA for database paths. Attach mount identity, time-to-full uncertainty, ownership/partial-scan evidence, protected resources and action result. Stop any repeat cleanup after insufficient recovery.\n\n## Recording / memory\n\nCommon record plus mount/device identity, reclaimed versus predicted space, deletion preview, retention decision, inode trend, producer state and growth follow-up.\n\n## Prevention / follow-up\n\nPer-mount/inode alerts; rotation and artifact budgets;
