 retained deployment rollback set; mount-aware history; safe cleanup dry-runs; capacity forecasts tied to workload.\n\n## Lab validation\n\nUse a disposable 256 MiB test filesystem inside a snapshot-restorable VM, never the workstation/root filesystem. Operator pre-fills it to 85% with one named synthetic fixture, then writes synthetic logs at 1 MiB/s with a hard stop at 95% and 120-second writer watchdog. Retain the bounded allocation through the configured lab detection window. Separately create small files until its configured inode reserve crosses threshold; separately hold a deleted synthetic file open. Expect proposed disk trigger (currently unsupported), RB-005 diagnosis distinguishing H2/H4/H5, and zero broad prune calls. Deny deletion of a protected volume fixture; absent preview capability blocks agent cleanup. Operator removes only known fixtures/releases the test handle; verify same-mount bytes/inodes and service writes for 15 minutes and record all lifecycle stages. Restore snapshot on abort. No fault injection was run.\n\n## References\n\n- [Linux statvfs](https://man7.org/linux/man-pages/man3/statvfs.3.html), [unlink](https://man7.org/linux/man-pages/man2/unlink.2.html).\n- [Docker builder prune](https://docs.docker.com/reference/cli/docker/builder/prune/), [system prune](https://docs.docker.com/reference/cli/docker/system/prune/), [JSON-file logging](https://docs.docker.com/engine/logging/drivers/json-file/).\n- [Argus assessment](../RUNBOOK-ASSESSMENT.md) \u2014 root-only history and closed cleanup gate.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nPer-mount history, constraints, log-category/retention inventory and open-deleted ownership.\n\n### Missing tools\n\n`get_filesystem_history`, `get_open_deleted_files`, `get_log_storage_usage`, `get_filesystem_constraints`, bounded cleanup preview/commit.\n\n### Tool improvements\n\nMount/namespace identity, preserve partial scan flags, distinguish user-available bytes, deterministic reclaimability/retention/budget enforcement.\n\n### Detector improvements\n\nImplement filesystem/inode/growth detector and matching alerts; current architecture has no disk incident class.\n", "file": "RB-005-host-disk-almost-full.md"}, {"id": "RB-006", "title": "CPU saturation", "status": "draft", "version": "1.0.1", "detector": "cpu_saturation", "body": "# RB-006 \u2014 CPU saturation\n\n## Metadata\n\n```yaml\nid: RB-006\ntitle: CPU saturation\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: cpu_saturation\n```\n\n## Scope\n\nHost T Linux CPUs and Docker workload CPU budgets. Record logical CPU count, affinity/quota, kernel/cgroup and metric versions. Distinguish host contention from a throttled workload with idle host capacity. [Common contracts](../RUNBOOK-CONVENTIONS.md) apply; this incident class is not implemented.\n\n## Incident definition\n\nRunnable work cannot receive sufficient CPU within the service's required latency/throughput budget. High utilization alone can be legitimate useful work. Load average includes runnable tasks and tasks waiting for disk I/O, so load alone is not CPU saturation. [Linux load average](https://man7.org/linux/man-pages/man5/proc_loadavg.5.html)\n\n## User / service impact\n\nMeasure latency, completed work, errors and queue growth. A busy batch CPU with normal deadlines is not necessarily a service incident. Record unknown impact when request/job telemetry is absent.\n\n## Trigger / detection conditions\n\nProposed candidate: host busy above 90% for 5 minutes with CPU pressure or worsening service performance; separately detect sustained container throttling with impact even when host utilization is low. Normalize to available capacity and keep these two triggers separate. Three distinct samples and valid coverage are minimum evidence; missing CPU or quota data is unknown. Thresholds require calibration and a new detector/alert.\n\n## Symptoms\n\nHigh busy time, runnable backlog, CPU pressure, throttling, slow requests and delayed jobs; high I/O wait may instead indicate RB-010.\n\n## Plausible causes / hypotheses\n\nH1 legitimate traffic/work increase; H2 runaway/busy loop; H3 excessive concurrency/retries; H4 expensive request/query; H5 restrictive CPU quota/affinity; H6 noisy neighbor/host contention; H7 I/O-related load mistaken for CPU demand.\n\n## Required evidence\n\nHost and container CPU histories with units, CPU/affinity/quota definitions, pressure and throttling deltas, process attribution, load/I/O context, traffic/completions/latency and deployment history. A process ranking alone cannot distinguish useful computation from a loop.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `get_cpu_history(container=None, minutes=30)` | Host or named-container series | `READ_ONLY_SAFE` |\n| `get_host_cpu()` / `get_host_load()` | Busy %, CPU count, load and current pressure | `READ_ONLY_SAFE` |\n| `get_container_resources(container)` | Current CPU and resource counters | `READ_ONLY_SAFE` |\n| `get_top_cpu_processes(limit=10)` / `get_container_processes(container)` | Bounded ownership and process observations | `READ_ONLY_SENSITIVE` |\n| `get_io_metrics()` | Device activity/current I/O pressure | `READ_ONLY_SAFE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Request/retry/computation context | `READ_ONLY_SENSITIVE` |\n| `capture_diagnostic_snapshot(container)` | Pre-action evidence | `READ_ONLY_SENSITIVE` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_cpu_constraints(container)` returns effective quota/period, cpuset and version; `get_cpu_throttling_history(container, minutes)` exposes matching cgroup counter deltas/coverage; `get_service_traffic_history(service_id, minutes)` returns request/completion/queue trends. All `READ_ONLY_SAFE`. cAdvisor offers CPU usage/throttling metrics, but enabled collectors and exact labels must be verified. [cAdvisor metric catalogue](https://github.com/google/cadvisor/blob/master/docs/storage/prometheus.md)\n\n## Diagnostic workflow\n\n| Step | Action / reason | Interpretation / next step |\n|---|---|---|\n| 1 | CPU histories and impact: confirm sustained temporal overlap | Short peak/no impact \u2192 observe, not restart. Sustained impact \u2192 2. |\n| 2 | Host CPU/load/pressure and I/O | High load with I/O pressure and low CPU busy \u2192 RB-010. CPU contention \u2192 3. |\n| 3 | Compare container demand to effective quota/affinity and throttling | Throttled with host spare \u2192 H5; missing constraint tool leaves this open. Host busy across tenants \u2192 H6/H1. |\n| 4 | Rank processes; align traffic/completions and logs | More work with proportional completion supports H1; high CPU with stalled progress supports H2/H4; high retries/concurrency supports H3. |\n| 5 | Correlate deploy/query/job changes; preserve counterevidence | Single expensive query \u2192 DBA/RB-013; new code without causal evidence \u2192 RB-018 investigation, no automatic rollback. |\n| 6 | Snapshot, owner-selected containment, then fresh checks | No evidence of useful versus harmful work \u2192 insufficient_evidence; avoid speculative kill/restart. |\n\n## Decision tree\n\n```text\nhigh load -> CPU busy/pressure? no -> I/O or other wait\n  yes -> quota throttling with host spare? yes -> budget/config investigation\n         traffic and useful work rising? yes -> demand/capacity\n         one process busy with no progress? -> loop/expensive-work hypotheses\n         several competing workloads? -> host contention/concurrency\n         evidence incomplete? -> abstain and request missing telemetry\n```\n\n## Evidence interpretation\n\nRecord whether a CPU value is host percent, percent of one core, or cores consumed; the current history helper's one-CPU label does not establish host normalization. CPU quota and affinity restrict available execution independently of visible host capacity. [Docker CPU constraints](https://docs.docker.com/engine/containers/resource_constraints/#cpu)\n\n## False positives and edge cases\n\nCounter resets, multicore values above 100% of one core, startup/compilation, short samples, process CPU averaged over lifetime, virtual-machine steal, shared host activity, changing quotas and a diagnostic probe itself adding load.\n\n## Diagnosis outcome\n\nUse all common outcomes. Probable cause needs demand/progress or throttling evidence plus counterevidence against I/O and host contention; otherwise record multiple hypotheses or insufficient evidence without labeling normal utilization a defect.\n\n## Mitigation\n\nOwner may reduce an identified non-critical workload/concurrency. Restart is not a general CPU remedy; a separately authorized single restart may recover an evidenced wedged process under an existing supported incident, never by falsifying this detector class.\n\n## Recovery\n\nLatency/completions recover and runnable/pressure/throttle evidence meets the service budget under representative load. Low CPU because requests disappeared is not recovery.\n\n## Root-cause correction\n\nFix loops/algorithms, tune queries/concurrency, bound retries, allocate appropriate CPU quota or improve placement/capacity after profiling.\n\n## Action safety\n\nStopping a producer, restarting a process or changing CPU allocation is `MUTATING_HIGH_RISK`. Require named owned workload/immutable ID, demand attribution, protected critical-service list, before/after settings, host reserve and one approved operation. Block absent CPU-change tool, unknown work loss, missing predicates or unsupported class/gate. The existing `change_resource_limit` changes memory only; it is not a CPU tool. No model kill/nice/scheduler interface is allowed.\n\n## Human-in-the-Loop\n\nApproval must show useful work lost/delayed, affected tenants, exact stop/restart/config change and rollback plan. Prose cannot turn an unsupported write into a capability; operator procedures remain outside Argus execution.\n\n## Forbidden actions\n\n`FORBIDDEN`: arbitrary process kill, disabling quotas globally, realtime-priority escalation, restarting all busy services, changing memory via a mislabeled CPU fix or scaling load into an exhausted host.\n\n## Evidence preservation\n\nCapture process ownership, CPU/quota/traffic windows and snapshot before any restart. Avoid expensive unbounded profiling during saturation; a missing safe profiler is a gap.\n\n## Verification\n\nThree source-fresh samples after the change, then 5 minutes of restored representative work: configured latency/completion targets, declining backlog, acceptable CPU pressure/throttling and stable error rate. Recurrence, missing workload telemetry or reduced traffic alone fails closure. Timeout escalates; no repeat restart.\n\n## Rollback\n\nRestarts cannot restore in-flight work. A configuration owner records previous quota/concurrency and capacity implications; rollback needs separate approval and must not reintroduce overload. No CPU rollback tool currently exists.\n\n## Escalation\n\nApplication/performance owner for H2/H4, platform for H5/H6, DBA for expensive queries. Attach normalized time series, quota, progress evidence and missing observations. Stop at read budget or inability to attribute work safely.\n\n## Recording / memory\n\nCommon record plus CPU units/denominator, effective budget, workload progress, victim/consumer distinction and remaining profiling task.\n\n## Prevention / follow-up\n\nLoad-test CPU budgets, instrument queue/progress, optimize hot paths and retain throttle history and deployment fingerprints.\n\n## Lab validation\n\nDedicated 2-vCPU VM: a disposable fixture runs two bounded busy-loop workers, one per CPU, for 120 seconds while an independently capped synthetic API measures latency. Use the shared 30-second lab pending duration; confirm actual CPU pressure/impact before expecting a trigger. Repeat with only the API capped to 0.25 CPU while the host has spare capacity, and with an I/O-bound fixture. Expect proposed/unsupported CPU trigger, RB-006, and H2/H5/RB-010 respectively when evidence supports them; otherwise record an inconclusive fixture. Assert no arbitrary kill, no misuse of memory-limit tool, denied approval \u2192 zero action. Operator stops only the injected fixture; verify representative API work and pressure for 5 minutes and retain detection\u2192record artifacts. Stale throttle data must preserve uncertainty. Not executed.\n\n## References\n\n- [Linux load average](https://man7.org/linux/man-pages/man5/proc_loadavg.5.html), [Docker CPU constraints](https://docs.docker.com/engine/containers/resource_constraints/#cpu).\n- [cAdvisor metrics](https://github.com/google/cadvisor/blob/master/docs/storage/prometheus.md), [kernel PSI](https://docs.kernel.org/accounting/psi.html).\n\n## Argus capability gaps\n\n### Missing telemetry\n\nEffective CPU budget, throttle history, demand/progress and known healthy latency baseline.\n\n### Missing tools\n\n`get_cpu_constraints`, `get_cpu_throttling_history`, `get_service_traffic_history`.\n\n### Tool improvements\n\nUnambiguous CPU normalization, real sample timestamps, interval-based process CPU and identity-scoped histories.\n\n### Detector improvements\n\nSeparate host contention from quota throttling; implement a detector and matching alert; avoid load-only diagnosis.\n", "file": "RB-006-cpu-saturation.md"}, {"id": "RB-007", "title": "Host memory pressure", "status": "draft", "version": "1.0.1", "detector": "host_memory_pressure", "body": "# RB-007 \u2014 Host memory pressure\n\n## Metadata\n\n```yaml\nid: RB-007\ntitle: Host memory pressure\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: host_memory_pressure\n```\n\n## Scope\n\nLinux Host T RAM, swap, host processes and containers. Record kernel/cgroup/PSI availability, boot ID, physical memory and enabled swap. Exclude isolated container-limit exhaustion with adequate host reserve (RB-001). Follow [common contracts](../RUNBOOK-CONVENTIONS.md); no host-memory detector is implemented.\n\n## Incident definition\n\nHost allocation/reclaim pressure compromises workload progress or threatens OOM. Low `MemFree` alone is insufficient: `MemAvailable` estimates memory usable for new applications without swapping. [Linux meminfo](https://man7.org/linux/man-pages/man5/proc_meminfo.5.html) PSI measures time tasks are stalled by resource contention, not bytes used. [Kernel PSI](https://docs.kernel.org/accounting/psi.html)\n\n## User / service impact\n\nPossible latency, swap-related I/O, stalled processes and killed workloads across services, including monitoring. Measure affected endpoints/jobs; a healthy surviving service does not establish host-wide health.\n\n## Trigger / detection conditions\n\nProposed alert: available RAM below 10% for 5 minutes with sustained memory pressure or workload degradation; immediate investigation on kernel OOM with impact. Pressure threshold must be calibrated to host baseline and PSI support. No-swap is configuration, not automatic failure. Required sample loss selects undiagnosable/observability escalation, not zero pressure.\n\n## Symptoms\n\nDeclining available RAM, reclaim stalls, swap activity, increased I/O latency, multiple OOM victims, failed allocations and missing exporters.\n\n## Plausible causes / hypotheses\n\nH1 one runaway container; H2 aggregate legitimate containers exceed capacity; H3 host process growth; H4 kernel/cache/shared-memory pressure; H5 burst workload; H6 sustained leak; H7 swap/storage impairment amplifies memory stalls. A killed container can be a victim of another consumer.\n\n## Required evidence\n\nPre-incident and current available RAM/swap/pressure, per-consumer memory trend, host/process ownership, kernel victim/domain records, representative load, I/O context and recent placement/budget changes. Process RSS totals can double-count shared mappings and omit other allocations; do not force them to equal host use.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `get_host_memory()` | Current available/total RAM, swap and memory pressure | `READ_ONLY_SAFE` |\n| `get_top_memory_processes(limit=10)` | Bounded RSS ranking and ownership | `READ_ONLY_SENSITIVE` |\n| `get_container_list()` | Known workloads and states | `READ_ONLY_SENSITIVE` |\n| `get_container_resources(container)` / `get_memory_history(container, minutes=30)` | Consumer usage and trend | `READ_ONLY_SAFE` |\n| `get_io_metrics()` | I/O rates/pressure for swap-related alternative | `READ_ONLY_SAFE` |\n| `get_container_events(container, since_minutes=30)` | Victim lifecycle chronology | `READ_ONLY_SAFE` |\n| `capture_diagnostic_snapshot(container)` | Preserve suspected consumer/victim state | `READ_ONLY_SENSITIVE` |\n\nLimit investigation to declared related workloads and configured read budgets; do not inventory every process/filesystem unrestrictedly.\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_host_memory_history(host_id, minutes)` and pressure/swap-activity history, `READ_ONLY_SAFE`; `get_kernel_oom_events(host_id, since, until, max_events)`, `READ_ONLY_SENSITIVE`. These reuse RB-001 contracts. **MISSING TOOL REQUIREMENT:** bounded host-memory category/placement history and effective cgroup budgets, not arbitrary `/proc` reads. Current PSI is available; historical attribution is missing.\n\n## Diagnostic workflow\n\n| Step | Action / why | Interpret / next step |\n|---|---|---|\n| 1 | Fresh host memory plus impact | Cache-heavy but available RAM/pressure normal \u2192 investigate other failure. Sustained shortage \u2192 2. |\n| 2 | Request pre-event host/swap/PSI history | Pressure preceding victims supports host contribution. Only post-kill memory available \u2192 preserve attribution uncertainty. |\n| 3 | Rank consumers and inspect related container trends | Single growing owner \u2192 H1/H6; broad stable growth with demand \u2192 H2; host process \u2192 H3; unexplained gap \u2192 H4. |\n| 4 | Compare growth to workload and changed placement | Burst supports H5; repeated retained growth at comparable load supports leak hypothesis. No baseline \u2192 do not call it a leak. |\n| 5 | Inspect kernel context and I/O | Match OOM domain/victim; severe swap I/O supports H7/RB-010. Container limit-only event routes to RB-001. |\n| 6 | Snapshot, owner containment plan, then verify whole host and victims | Unknown owner/critical consumer \u2192 escalate, not kill the largest PID. |\n\n## Decision tree\n\n```text\nhost pressure supported? no -> local cgroup / cache / different incident\n  yes -> one consumer? -> container or host owner + growth investigation\n         aggregate demand? -> capacity/placement\n         unexplained memory? -> bounded kernel/shared-memory evidence\n         OOM victim identified? -> do not equate victim with offender\n         safe non-critical containment available? -> owner/HITL; else escalate\n```\n\n## Evidence interpretation\n\nCompare pre-failure time windows. RAM freed by a kill can mask the original host shortage. CPU/memory/I/O pressure are different signals; swap occupancy alone does not show current swap activity. Under cgroup v2 the killed processes and constrained domain require contextual interpretation; use RB-001 for that analysis.\n\n## False positives and edge cases\n\nReclaimable cache, no swap by design, shared mappings, lost exporter, host reboot/reset, changed VM size, short-lived allocations, incomplete container inventory, protected kernel allocations and a victim gone before sampling.\n\n## Diagnosis outcome\n\nAllow all common outcomes with host contribution and offender identity separately qualified. `insufficient_evidence` is appropriate when only a victim's OOM or current memory is available; do not name an offender without ownership evidence.\n\n## Mitigation\n\nPlatform owner can pause a proven non-critical workload or reduce accepted load under an approved procedure. Restarting several victims simultaneously may worsen demand and is not a default action.\n\n## Recovery\n\nSustained host reserve and progress return, pressure falls, no new OOM occurs, and affected services recover under representative demand. A stopped workload remains a functionality reduction.\n\n## Root-cause correction\n\nFix application retention, bound caches/concurrency, rebalance budgets/placement or add reviewed capacity. Distinguish workload correction from simply enlarging available memory.\n\n## Action safety\n\nWorkload stop, restart, limit/capacity/swap change are `MUTATING_HIGH_RISK`. Exact owned target/ID, protected database/control-plane list, workload-loss assessment, before/after budget and host reserve are required. Block unknown owner, missing deterministic headroom checks, critical target without explicit policy, unsupported class or absent capability. Broad lab stops are not enabled for this class by implication. No low-risk host memory mutation is offered.\n\n## Human-in-the-Loop\n\nShow offending versus victim evidence, host and service impact, exact containment and reduced functionality, capacity risks and recovery plan. Each action requires a separate frozen proposal or owner change procedure; no approval for arbitrary memory reclamation.\n\n## Forbidden actions\n\n`FORBIDDEN`: disable OOM killer, kill largest PID blindly, mass restart, globally drop caches, disable swap under pressure, remove all limits, change kernel memory settings through shell or expose process secrets.\n\n## Evidence preservation\n\nSmall bounded snapshots of implicated workloads plus remote host history/kernel refs; avoid memory-heavy dumps on an exhausted host. Missing evidence capture blocks automatic state-destroying remediation and prompts operator escalation.\n\n## Verification\n\nThree source-fresh host/service observations after intervention, then 10 minutes including representative demand. Proposed available-RAM reserve above 15%, calibrated to host needs; pressure near baseline, swap activity no longer increasing abnormally, no new OOM, victim endpoints healthy. Monitor disappearance fails verification. Recurrence or inability to cover the window within budget escalates.\n\n## Rollback\n\nKilled processes cannot regain lost work. Resuming a paused producer is separately approved after sufficient reserve/correction. Capacity/limit changes preserve prior values, but reverting into known shortage is blocked; operator handles rollback safely.\n\n## Escalation\n\nPlatform on-call immediately for broad pressure/monitor loss, application owner for attributed growth. Attach pre-event history, consumer/victim mapping, cgroup uncertainty, protected workloads and requested next measurement. Unknown action state never triggers repeat action.\n\n## Recording / memory\n\nCommon record plus boot ID, total/available memory, swap configuration/activity, category/ownership uncertainty, impacted services and recurrence horizon.\n\n## Prevention / follow-up\n\nHost reserve budgets, pressure/history collection independent of victims, per-workload limits, leak tests and placement accounting.\n\n## Lab validation\n\nSnapshot-restorable dedicated 2 GiB VM with out-of-band observer: operator uses a time-limited allocator, 64 MiB increments, hard 1.5 GiB fixture cap and abort when available RAM is below 15% or observer fails. First run normally targets pressure without OOM; an OOM variant requires a separately approved disposable-VM plan. Compare one growing container versus several bounded consumers. Expect proposed/unsupported host trigger, H1 versus H2 when evidence supports it; a victim-only replay must abstain. Denied containment \u2192 zero writes; operator removes only fixtures, verifies host and service recovery for 10 minutes and records all lifecycle stages. No host fault was executed.\n\n## References\n\n- [Linux meminfo](https://man7.org/linux/man-pages/man5/proc_meminfo.5.html), [kernel PSI](https://docs.kernel.org/accounting/psi.html).\n- [RB-001](RB-001-container-oom-restart-loop.md) \u2014 OOM boundary interpretation and missing tool contracts.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nHost memory/swap/pressure history, kernel OOM context, placement and effective budgets.\n\n### Missing tools\n\nShared host-memory/kernel/pressure-history contracts and bounded memory-category inspection.\n\n### Tool improvements\n\nAvoid inferring local OOM from victim flags; expose ownership/coverage uncertainty and source times.\n\n### Detector improvements\n\nHost pressure detector with impact and freshness, separate from container OOM; target-scope and containment policy extensions.\n", "file": "RB-007-host-memory-pressure.md"}, {"id": "RB-008", "title": "Container crash loop, non-OOM", "status": "draft", "version": "1.0.1", "detector": "container_restart_loop", "body": "# RB-008 \u2014 Container crash loop, non-OOM\n\n## Metadata\n\n```yaml\nid: RB-008\ntitle: Container crash loop, non-OOM\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: container_restart_loop\n```\n\n## Scope\n\nLong-running Docker/Compose services expected to remain alive. Record Engine version, image digest, container ID, restart policy and expected process lifecycle. Exclude successful scheduled/one-shot jobs and supported OOM cases (RB-001). [Common contracts](../RUNBOOK-CONVENTIONS.md) apply; a dedicated non-OOM loop detector is missing.\n\n## Incident definition\n\nRepeated unexpected process exits prevent useful service operation, with OOM not established as the cause. Absence of retained OOM evidence does not prove a non-OOM cause; preserve uncertainty for unexplained kills.\n\n## User / service impact\n\nMeasure request/job failures and available replicas. A container restarting behind healthy capacity may be partial degradation; successful job completion may be normal.\n\n## Trigger / detection conditions\n\nProposed rule: at least three unexpected death/start cycles for one immutable service instance in 10 minutes, with service impact or failure to become ready. Existing RB-002 may detect stopped/unhealthy state but does not implement this loop rule. Cumulative counts and reused names are insufficient. Stale events/snapshots require abstention.\n\n## Symptoms\n\nShort uptime, repeated exits, exceptions, missing executable/configuration, permission/storage errors and failed startup readiness. Docker CLI launch errors and application exit codes are different evidence classes. [Docker exit status](https://docs.docker.com/engine/containers/run/#exit-status)\n\n## Plausible causes / hypotheses\n\nH1 application exception; H2 missing/invalid configuration; H3 dependency unavailable; H4 bad image/deployment/entrypoint; H5 permission or filesystem failure; H6 startup deadline; H7 external stop/kill or host/runtime event; H8 legitimate job completion misclassified as failure.\n\n## Required evidence\n\nContainer/image identity, actual lifecycle events, exit/engine error, bounded prior-exit logs, restart policy, declared health/startup contract, dependency state, deployment/config fingerprints and host uptime. Never inspect raw environment values to prove configuration presence.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `get_container_status(container)` | Running/exit/OOM/state and identity | `READ_ONLY_SENSITIVE` |\n| `get_restart_history(container, since_minutes=30)` / `get_container_events(container, since_minutes=30)` | Reconstruct actual exits/starts and gaps | `READ_ONLY_SAFE` |\n| `get_detailed_logs(container, since_minutes=30, max_lines=150)` | Last visible failure, sanitized | `READ_ONLY_SENSITIVE` |\n| `check_container_health(container)` / `check_connectivity(container)` | Startup and dependency alternatives | `READ_ONLY_SENSITIVE` |\n| `get_disk_usage(path=None)` / `get_system_uptime()` | Filesystem capacity and host reboot context | `READ_ONLY_SAFE` |\n| `inspect_service_config(container, config='main')` | Only declared redacted config | `READ_ONLY_SENSITIVE` |\n| `capture_diagnostic_snapshot(container)` | Preserve state before intervention | `READ_ONLY_SENSITIVE` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_deployment_history(service_id, minutes)` with image/config fingerprints and source times, `READ_ONLY_SENSITIVE`; `get_startup_contract(container)` with redacted entrypoint, expected job/service behavior and readiness budget, `READ_ONLY_SENSITIVE`. Historical logs for a replaced/deleted ID need retained log storage; current-name logs are not a substitute.\n\n## Diagnostic workflow\n\n| Step | Action / why | Interpretation and next step |\n|---|---|---|\n| 1 | Bind ID and expected lifecycle; inspect state/events | Successful one-shot completion \u2192 wrong runbook. Correlated OOM \u2192 RB-001. Unknown kill \u2192 retain OOM/external alternatives. |\n| 2 | Reconstruct three cycles and first failing log window | Repeat same exception supports H1; launch/config error supports H2/H4. Missing previous logs \u2192 gap, not absence of errors. |\n| 3 | Check dependencies before local remediation | Failing dependency \u2192 RB-003; protect victim. Healthy dependency \u2192 4. |\n| 4 | Compare startup contract, health grace and resource/filesystem evidence | Permission/storage failure \u2192 owner/RB-005; deadline too short \u2192 H6; generic timeout remains ambiguous. |\n| 5 | Compare image/config changes and host/runtime chronology | Regression hypothesis \u2192 RB-018; many simultaneous exits/reboot \u2192 RB-017/host owner. Correlation alone does not prove a bad image. |\n| 6 | Preserve snapshot and select owner correction | Deterministic crash on every startup will recur after another restart; no blind retry. Verify after actual correction. |\n\n## Decision tree\n\n```text\nunexpected repeated exit? no -> job/maintenance/stale trigger\n  yes -> OOM supported? -> RB-001\n         dependency fails? -> RB-003\n         repeated exception/config/entrypoint error? -> application/deployment owner\n         storage/permissions/deadline? -> focused correction\n         host/runtime event? -> platform investigation\n         unexplained -> multiple_hypotheses / insufficient_evidence\n```\n\n## Evidence interpretation\n\nDocker restart policy governs when exits lead to restart; a health-state change alone is not evidence that Docker's restart policy restarted the process. Interpret counts with events and expected lifecycle. [Docker restart policies](https://docs.docker.com/engine/containers/start-containers-automatically/)\n\n## False positives and edge cases\n\nRolling replacement, manual stop, host reboot, missing retained events, log truncation, exit 0 on a service that should persist, successful batch job, signal kills without OOM evidence and startup grace mismatch.\n\n## Diagnosis outcome\n\nAll common outcomes allowed. Probable cause requires the repeated failure mechanism and evidence excluding dependency/OOM alternatives. Unknown exit cause remains unresolved even when service later recovers.\n\n## Mitigation\n\nOperator can pause a proven harmful non-critical loop or restore a reviewed deployment. One approved restart is useful only after a transient cause has cleared and the current supported policy permits it; this runbook does not create that authority.\n\n## Recovery\n\nCorrected workload starts, stays useful across the former recurrence interval and serves representative requests/jobs. Restarting with unchanged deterministic failure is not recovery.\n\n## Root-cause correction\n\nFix exception/configuration/entrypoint, permissions, startup budget or dependency lifecycle; test the exact artifact before release. Avoid masking a defect by increasing retry frequency.\n\n## Action safety\n\nRestart/stop/rollback/configuration writes are `MUTATING_HIGH_RISK`. Require exact target/ID and artifact, cause-cleared evidence, snapshot, workload-loss assessment, protected data and supported capability/class/gate. Block unresolved dependency, deterministic repeated crash, missing rollback compatibility or unknown last action. Production has no general deployment/stop capability; those remain owner procedures.\n\n## Human-in-the-Loop\n\nShow previous exits, corrected versus unchanged inputs, precise operation and expected lost work. Approval expires on identity/config change; denial/expiry means no write, and retry requires a new proposal.\n\n## Forbidden actions\n\n`FORBIDDEN`: unlimited restart loops, replace images with unpinned guesses, dump env/secrets, chmod/chown arbitrary paths, bypass failing startup checks or delete volumes to make startup succeed.\n\n## Evidence preservation\n\nSnapshot and retain first-failure logs/events plus image/config fingerprints before recreation or rollback; capture gaps for deleted instances. No raw secret-bearing config dumps.\n\n## Verification\n\nAfter completed correction, three fresh source observations, then `max(5 minutes, twice the previously observed cycle interval, configured startup budget)`. Intended artifact/identity, stable running/health, no repeated exception, successful representative work and healthy dependencies. Loss of telemetry or recurrence fails verification; timeout escalates with provisional state.\n\n## Rollback\n\nNo undo for restart or lost in-memory work. Deployment owner uses previous immutable artifact only after schema/data compatibility review; rollback is separately approved and follows RB-018.\n\n## Escalation\n\nApplication/release owner for repeated exceptions; platform for host/runtime failures. Stop after failed correction or unknown execution. Attach first-failure evidence, identities, corrected inputs, excluded hypotheses and next missing startup/deployment observation.\n\n## Recording / memory\n\nCommon record plus expected lifecycle, exact exit sequence, image/config fingerprints, lost previous-ID evidence and recurrence interval.\n\n## Prevention / follow-up\n\nStartup contract tests, image/config validation, retention across recreation, bounded restart behavior and explicit job-versus-service metadata.\n\n## Lab validation\n\nDisposable fixture exits with code 1 every 15 seconds using a capped lab restart policy; label it as a persistent service. Capture at least three cycles within a 2-minute watchdog. Expect proposed/unsupported loop trigger, RB-008, repeated exception evidence, no OOM inference and refusal of another unchanged restart. Repeat as an intentional successful job and as a dependency failure; expect wrong-runbook/RB-003. Operator deploys the fixed fixture; exercise denial and then a new permitted proposal only where policy supports it. Verify stable work through the observation window and record detection, evidence, diagnosis, safety, action/no-action and outcome. Not executed.\n\n## References\n\n- [Docker run/exit status](https://docs.docker.com/engine/containers/run/#exit-status), [restart policies](https://docs.docker.com/engine/containers/start-containers-automatically/).\n- [Container inspection](https://docs.docker.com/reference/cli/docker/container/inspect/) and [Argus assessment](../RUNBOOK-ASSESSMENT.md).\n\n## Argus capability gaps\n\n### Missing telemetry\n\nRetained per-instance logs, immutable deployment history and startup/job semantics.\n\n### Missing tools\n\n`get_deployment_history`, `get_startup_contract`.\n\n### Tool improvements\n\nExpose image/config fingerprints without secrets; distinguish death counts from actual restart cycles.\n\n### Detector improvements\n\nIdentity-bound time-window detector with expected lifecycle and OOM uncertainty; no silent relabeling to bypass policy.\n", "file": "RB-008-container-crash-loop-non-oom.md"}, {"id": "RB-009", "title": "DNS/network connectivity failure", "status": "draft", "version": "1.1.1", "detector": "dns_network_failure", "body": "# RB-009 \u2014 DNS/network connectivity failure\n\n## Metadata\n\n```yaml\nid: RB-009\ntitle: DNS/network connectivity failure\nstatus: draft\nowner: Argus Team\nversion: 1.1.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: 2026-10-07   # SC-07 on vm-166 (T-0018): v1.0.0 in inc_21f900ee6139, v1.1.0 in inc_6a1511e19269; still draft\ndetector: dns_network_failure\n```\n\n## Scope\n\nDeclared service endpoints/networks on Host T; record Docker network mode, source namespace, address family and endpoint contract. Exclude arbitrary discovery/scanning and host firewall administration. External-client failures require an actual external vantage. Apply [shared contracts](../RUNBOOK-CONVENTIONS.md); dedicated detection is missing.\n\n## Incident definition\n\nThe configured source cannot resolve or complete the expected network interaction with a declared destination. DNS, routing, TCP, TLS and application responses must be assessed separately. Docker custom networks provide service-name resolution and network-specific reachability; inspect actual attachment. [Docker networking](https://docs.docker.com/engine/network/)\n\n## User / service impact\n\nRecord affected source\u2192destination edges and user routes. A nearby probe succeeding does not establish that the application can connect with its own network, resolver or credentials.\n\n## Trigger / detection conditions\n\nProposed trigger: three failed bounded probes spanning at least `max(60 seconds, 2*S)` to one approved endpoint, or corroborated application resolution/connect errors with impact. Existing dependency/health detectors can supply a parent investigation, not a standalone network class. Timeout/missing probe data is not zero packet loss or successful resolution.\n\n## Symptoms\n\nNXDOMAIN/resolver errors, wrong address, connect timeout/refusal, intermittent connection failures, handshake errors and protocol-level failures.\n\n## Plausible causes / hypotheses\n\nH1 DNS record/resolver fault; H2 wrong network/route; H3 firewall/security policy; H4 absent listener/wrong port; H5 address-family or endpoint mismatch; H6 overload/socket exhaustion; H7 TLS/application issue despite working TCP; H8 faulty probe/vantage.\n\n## Required evidence\n\nTopology/version, source vantage, resolver answers/errors/time, expected address/port, network membership/routes, bounded TCP outcomes, listener state and application error. Preserve attempted IP/family; a hostname-only summary may hide one broken address among several.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `check_dns(name)` | Approved service-name resolution and addresses | `READ_ONLY_SENSITIVE` |\n| `check_tcp_connection(host, port, attempts=3, timeout_s=2)` | Success ratio/errors, at most 5 attempts and 10 seconds each | `READ_ONLY_SAFE` |\n| `check_http_endpoint(url, timeout_s=3)` | Allowlisted protocol check, no arbitrary redirect expansion | `READ_ONLY_SENSITIVE` |\n| `get_container_status(container)` \u2192 `networks` | Names of the attached Docker networks of source and destination (replaces the planned `get_container_network`; aliases and published ports still missing) | `READ_ONLY_SAFE` |\n| `get_socket_summary(container)` | Namespace socket states/listeners | `READ_ONLY_SENSITIVE` |\n| `get_network_history(container, minutes=30)` | Traffic/error/drop trends, subject to missing-value defect | `READ_ONLY_SAFE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Application-side network errors | `READ_ONLY_SENSITIVE` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_route_diagnostics(source_id, endpoint_id)` from approved target namespaces, with route/interface and constrained policy metadata; `check_tls_endpoint(endpoint_id)` with hostname/SNI/chain/error; `get_external_probe_history(endpoint_id, minutes)` for the real client path. All require registry-owned destinations; routing/TLS metadata is `READ_ONLY_SENSITIVE`, sanitized probe history `READ_ONLY_SAFE`. DNS result, TTL/rcode, selected IP/family and resolver identity need tool extensions.\n\n## Diagnostic workflow\n\n| Step | Action / purpose | Interpretation / next step |\n|---|---|---|\n| 1 | Match error to declared edge and actual probe origin | Unknown edge/origin \u2192 insufficient_evidence. Known \u2192 2. |\n| 2 | DNS result against expected registry addresses | Missing answer and the source is a Docker container \u2192 3 first: Docker's embedded DNS answers only for containers that share a network with the source. Otherwise missing/wrong answer \u2192 H1. Valid answer \u2192 3; success from another resolver is counterevidence only for that resolver. |\n| 3 | Compare the network membership of source and destination (`networks` of both), then route metadata | No shared network while the destination runs \u2192 wrong attachment (H2): name the networks of each side; do not restart either. Shared network but no answer \u2192 back to H1. Missing route evidence leaves H2/H3 unresolved; proceed with bounded TCP check. |\n| 4 | Connect to configured port; inspect listener/socket evidence | Refusal supports no listener or active rejection; timeout leaves filtering/routing/overload open. TCP success \u2192 5. |\n| 5 | TLS then expected protocol | TLS issue \u2192 RB-016; protocol/capacity failure \u2192 RB-003. Successful transport cannot clear these layers. |\n| 6 | Correlate intermittent failures with family, traffic and socket states | Saturated sockets \u2192 RB-012; retries/overload \u2192 RB-021. Preserve missing/drop-query defect rather than trusting zero. |\n\n## Decision tree\n\n```text\nDNS correct? no -> Docker source? yes -> source and destination share a network?\n                                          no  -> wrong attachment (H2): name both networks\n                                          yes -> resolver/record (H1)\n                     no  -> resolver/record (H1)\n  yes -> source network/route correct? unknown -> missing route evidence\n         TCP succeeds? no -> listener / policy / path / saturation\n           yes -> TLS valid? no -> RB-016\n                  protocol healthy? no -> RB-003\n                    yes -> compare real client vantage or recovered incident\n```\n\n## Evidence interpretation\n\nBlackbox supports HTTP/TCP/DNS probes but the module and vantage define what each result proves. [Blackbox Exporter](https://github.com/prometheus/blackbox_exporter) The existing Argus network history reports missing error-query results as zero: that output cannot establish absence of errors until fixed. Address-family differences and intermittent samples require multiple bounded observations. On Docker networks a container name that does not resolve from the source's network, while the destination runs and is healthy, points to a network attachment mistake, not to a broken resolver or a failed destination: compare the `networks` of both sides before blaming DNS.\n\n## False positives and edge cases\n\nDNS caches, TTL changes, load-balanced answers, split DNS, IPv6-only failures, proxy settings, asymmetric path, stale topology, probe connection load, firewall rejection versus missing listener and transport success with failed authentication.\n\n## Diagnosis outcome\n\nAllow all common outcomes. A probable layer failure includes source/destination/family and counterevidence; if refusal versus policy cannot be separated, retain both hypotheses. Fresh local success does not close an external-path failure.\n\n## Mitigation\n\nNetwork/service owner may restore the previous declared route/record or direct traffic to a tested alternate through an established procedure. No DNS/firewall mutation tool is available to Argus.\n\n## Recovery\n\nThe affected source resolves and completes the intended protocol reliably, with service requests recovering. Restored DNS alone is only partial recovery.\n\n## Root-cause correction\n\nCorrect service discovery/network attachment/listener or policy configuration, TLS settings or capacity, supported by the observed layer and reviewed by its owner.\n\n## Action safety\n\nDNS/route/firewall/restart changes are `MUTATING_HIGH_RISK` owner actions: require exact record/network/service and old/new values, ownership, protected management path, scoped blast radius and rollback. Block unknown namespace, broad rule flush, lost control-plane access, untested alternate or missing capability/profile. Read probes remain target-allowlisted and rate-bounded; HTTP redirects must not escape allowed destinations.\n\n## Human-in-the-Loop\n\nApproval names the exact change, source/destination, affected clients, propagation/TTL implications and rollback. It does not authorize a generic \u201crepair network\u201d command. Current Argus should escalate this change.\n\n## Forbidden actions\n\n`FORBIDDEN`: arbitrary scanning/traceroute/shell, global firewall/DNS flush, disabling TLS verification, injecting host entries blindly, fetching metadata/secret endpoints, or changing Docker networks without ownership checks.\n\n## Evidence preservation\n\nRetain bounded resolution/connect/protocol results, network config fingerprints and timestamps before a change; no broad packet captures or payload collection. Record probe source and family on every observation.\n\n## Verification\n\nThree distinct source-fresh results after completed change, then 5 minutes and at least one relevant configured DNS TTL where feasible. Expected resolution, TCP, TLS/protocol and application requests pass from affected vantage. Missing vantage/TTL coverage means provisional recovery plus follow-up; recurrence/timeouts escalate, not repeated network changes.\n\n## Rollback\n\nOwner retains previous record/network policy and a management path. Rollback propagation is not instantaneous; re-verify actual clients and treat rollback as an approved change. No automatic network rollback exists.\n\n## Escalation\n\nNetwork/DNS owner for early layers, service owner for listener/protocol, PKI for TLS. Attach exact edge, errors, families, timestamps and unresolved layer; request bounded route/actual-source evidence next.\n\n## Recording / memory\n\nCommon record plus resolver, source namespace, attempted address/family, topology revision, propagation window and observed recovery path.\n\n## Prevention / follow-up\n\nContract-test discovery/network changes, monitor client vantages/address families and implement scoped probes with unknown/error states.\n\n## Lab validation\n\nDisposable app-network pair: operator changes a fixture alias to a nonexistent name, then restores it and separately stops its listener; third case keeps TCP open but serves a protocol failure. Each fault lasts at most 2 minutes; topology and baseline are saved. Expect RB-003 parent\u2192RB-009, DNS/listener/protocol distinction and zero victim restarts. A public/unknown endpoint and forged redirect must be refused. Denied config change produces no Argus action; operator restores exact fixture settings. Verify all layers, preserve the eight lifecycle artifacts, and replay absent error metrics to require unknown rather than healthy. These three cases are not executed. Executed: SC-07 on vm-166 (2026-10-07, T-0018), a healthy destination attached only to another Docker network (`inc_fb92d115abb2`; `inc_21f900ee6139` with v1.0.0 and `inc_6a1511e19269` with v1.1.0 read through `query_runbook`).\n\n## References\n\n- [Docker networking](https://docs.docker.com/engine/network/), [Blackbox Exporter](https://github.com/prometheus/blackbox_exporter).\n- [Argus assessment](../RUNBOOK-ASSESSMENT.md) \u2014 probe origin and network-history limitations.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nSource-equivalent route/policy, address-family/resolver details and external vantage.\n\n### Missing tools\n\nShared route/TLS/external-probe contracts.\n\n### Tool improvements\n\nFix missing-errors-as-zero; return chosen IP/family and source timestamps; enforce redirect destination policy. Done 2026-10-07: the container status returns the names of its attached networks.\n\n### Detector improvements\n\nImplement bounded layered probe trigger without treating protocol failures as transport failures; preserve RB-003 parent class.\n", "file": "RB-009-dns-network-connectivity-failure.md"}, {"id": "RB-010", "title": "Disk I/O saturation", "status": "draft", "version": "1.0.1", "detector": "disk_io_saturation", "body": "# RB-010 \u2014 Disk I/O saturation\n\n## Metadata\n\n```yaml\nid: RB-010\ntitle: Disk I/O saturation\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: disk_io_saturation\n```\n\n## Scope\n\nLinux block storage serving declared Docker/host workloads. Record device\u2192mount\u2192workload mapping, kernel, storage type, virtualization and device limits. Remote/network storage needs its own provider telemetry. Capacity shortage is RB-005, database-specific storage RB-019. Apply [shared contracts](../RUNBOOK-CONVENTIONS.md); no I/O detector is implemented.\n\n## Incident definition\n\nStorage service time/backlog limits useful workload progress. Used disk bytes and disk performance are different dimensions. Kernel disk statistics include cumulative counters and instantaneous in-flight counts; resets must be handled when deriving rates. [Kernel I/O statistics](https://docs.kernel.org/admin-guide/iostats.html)\n\n## User / service impact\n\nObserve slow requests, commits, file operations and stalled queues. A busy device doing useful background work without degradation need not be an incident.\n\n## Trigger / detection conditions\n\nProposed selection: storage latency or I/O pressure exceeds a calibrated device baseline for 5 minutes with service degradation. Do not use universal \u201c100% utilization\u201d as a standalone capacity diagnosis. Require device identity, three distinct samples and nonzero operations before latency-per-operation ratios. Stale/reset counters and missing PSI are unknown.\n\n## Symptoms\n\nElevated I/O stall, long operation times, queue buildup, high device activity, slow DB/application writes or high load with limited CPU work.\n\n## Plausible causes / hypotheses\n\nH1 legitimate write/read-heavy demand; H2 log storm; H3 database query/checkpoint workload; H4 image pull/build; H5 swap pressure; H6 storage degradation/throttling; H7 constrained container I/O budget; H8 filesystem full rather than slow.\n\n## Required evidence\n\nTime-aligned per-device operation/latency/queue data, workload attribution, I/O pressure, memory/swap, filesystem availability, block limits, application latency and errors. Container block-byte counters alone do not establish latency or ownership of all buffered writeback.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `get_io_metrics()` | One-second device rates/utilization and current I/O pressure | `READ_ONLY_SAFE` |\n| `get_disk_usage(path=None)` | Rule in/out capacity/inode shortage | `READ_ONLY_SAFE` |\n| `get_host_memory()` / `get_host_load()` | Memory pressure and host contention context | `READ_ONLY_SAFE` |\n| `get_container_resources(container)` | Related block-I/O counters and resource snapshot | `READ_ONLY_SAFE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Timed workload/write errors | `READ_ONLY_SENSITIVE` |\n| `inspect_database_health(container)` | DB wait/transaction hints if involved | `READ_ONLY_SENSITIVE` |\n| `correlate_incident_timeline(container, minutes=30)` | Workload and failure chronology | `READ_ONLY_SENSITIVE` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_io_history(device_id, minutes)` for operation rates, latency, queue and pressure with reset/coverage metadata, `READ_ONLY_SAFE`; `get_storage_topology(host_id)` maps approved mounts/devices/containers, `READ_ONLY_SENSITIVE`; `get_storage_health(device_id)` provides sanitized device/provider errors and limits, `READ_ONLY_SENSITIVE`. `get_disk_history` measures root space consumption, not I/O performance.\n\n## Diagnostic workflow\n\n| Step | Action / why | Interpretation / next step |\n|---|---|---|\n| 1 | Identify affected mount/device and verify service latency | Unknown mapping \u2192 request topology; do not attribute busiest unrelated device. |\n| 2 | Disk capacity/inodes and I/O snapshot/history | Capacity shortage \u2192 RB-005. Sustained performance pressure \u2192 3; single busy second insufficient. |\n| 3 | Memory/pressure versus device history | Swap/host memory pressure precedes I/O \u2192 RB-007/H5. Otherwise 4. |\n| 4 | Relate declared workload counters/logs/change times | Build/log/DB demand leads slowdown \u2192 H2/H3/H4 candidates. Buffered/shared-device ambiguity remains explicit. |\n| 5 | Storage health/budget evidence | Errors or imposed throughput limits \u2192 H6/H7; absent evidence cannot prove hardware failure. |\n| 6 | Preserve evidence, choose narrow producer containment and verify | Stop non-critical producer only through its accepted procedure; unknown/critical owner escalates. |\n\n## Decision tree\n\n```text\nspace/inodes exhausted? -> RB-005\n  no -> same-device latency/pressure sustained?\n          no -> transient or wrong bottleneck\n          yes -> swap? -> RB-007\n                 known workload growth? -> log/build/DB owner\n                 device errors/limits? -> storage owner\n                 attribution missing? -> insufficient_evidence\n```\n\n## Evidence interpretation\n\nI/O timing/utilization depends on device concurrency and counter semantics; use workload latency, pressure and baseline together. Dividing time counters by operations needs matching windows and reset handling. PSI is contention evidence, not a hardware-failure diagnosis. [Kernel I/O statistics](https://docs.kernel.org/admin-guide/iostats.html), [PSI](https://docs.kernel.org/accounting/psi.html)\n\n## False positives and edge cases\n\nParallel NVMe/RAID devices, double-counted partition/device counters, buffered writes, burst credits, remote storage, zero-operation denominators, boot resets, cold caches and diagnostic scans adding load.\n\n## Diagnosis outcome\n\nAll common outcomes permitted. Probable cause needs same-device timing, workload or fault evidence and counterevidence against memory/capacity; a busy disk alone yields an unresolved bottleneck hypothesis.\n\n## Mitigation\n\nOperator defers a proven non-critical build/batch/log producer or reduces concurrency. No cleanup merely to improve latency, and no automatic DB restart. Preserve transaction durability.\n\n## Recovery\n\nStorage operation latency/pressure and service completion return to target under representative work, with backlog draining and no device errors.\n\n## Root-cause correction\n\nOptimize queries/write amplification, bound logs/build concurrency, fix swap pressure, provision appropriate storage, or repair degraded devices through the storage owner's procedure.\n\n## Action safety\n\nProducer stop, scheduling/storage/config changes are `MUTATING_HIGH_RISK`. Require exact owner/target, mapped device, safe work-loss budget, protected DB/control-plane resources, current reserve and rollback. Block unknown shared-device users, absent capability/policy, unverified degradation or unavailable audit. No automatic storage-admin capability exists.\n\n## Human-in-the-Loop\n\nShow which producer will be paused, impact on queued work and other device users, exact arguments, expected relief and verification target. An approval does not authorize arbitrary I/O scheduler or database tuning.\n\n## Forbidden actions\n\n`FORBIDDEN`: disable fsync/durability, drop caches globally, run unbounded benchmarks on production storage, delete data for a latency symptom, arbitrary kill or device reset.\n\n## Evidence preservation\n\nPreserve compact device/window metrics and redacted workload fingerprints remotely; avoid recursive scans/core dumps during I/O distress. State incomplete device mappings explicitly.\n\n## Verification\n\nThree fresh source observations after the intervention and 10 minutes of comparable load: latency/pressure within calibrated baseline, queues drain, critical writes succeed and errors do not recur. Idle workload alone is not recovery. Stale device metrics, renewed stalls or insufficient verification time escalates.\n\n## Rollback\n\nResume paused work only after reserve and pacing review. Storage/config owner retains previous settings, but does not restore known overload. No automatic disk configuration rollback or transaction undo is available.\n\n## Escalation\n\nStorage/platform owner for faults/unknown mapping, DBA for database demand, application owner for logging. Attach device/consumer mapping, before/after performance, error evidence and unresolved alternatives. Stop after ineffective containment.\n\n## Recording / memory\n\nCommon record plus device topology, kernel/metric semantics, operation denominators, consumer attribution, pressure/latency baseline and postponed work.\n\n## Prevention / follow-up\n\nDevice-specific latency/queue alerts, historical I/O/PSI, workload budgets, build isolation and capacity tests on disposable storage.\n\n## Lab validation\n\nDedicated disposable data disk: operator runs a 120-second capped write fixture with a 128 MiB file and a 20 MiB/s ceiling while a synthetic reader measures latency; root disk and production volumes are excluded. Choose limits that demonstrably affect the test disk, else record no incident. Expect proposed/unsupported RB-010 trigger and demand attribution, not disk-full diagnosis. Deny a request to disable durability; no Argus write. Operator stops only the fixture and verifies workload latency/pressure for 10 minutes. Repeat a full-filesystem fixture to require RB-005 routing; capture detection through recording. Not executed.\n\n## References\n\n- [Kernel I/O statistics](https://docs.kernel.org/admin-guide/iostats.html), [kernel PSI](https://docs.kernel.org/accounting/psi.html).\n- [Node Exporter collectors](https://github.com/prometheus/node_exporter) \u2014 available collector families must be checked in deployment.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nHistorical performance/queues, workload-device mapping, storage error/budget evidence.\n\n### Missing tools\n\n`get_io_history`, `get_storage_topology`, `get_storage_health`.\n\n### Tool improvements\n\nReset-aware rates, latency/queue fields, device identity and explicit short-sample limitations.\n\n### Detector improvements\n\nImplement performance-plus-impact selection separately from disk-capacity detection.\n", "file": "RB-010-disk-io-saturation.md"}, {"id": "RB-011", "title": "HTTP high latency / elevated error rate", "status": "draft", "version": "1.1.1", "detector": "http_errors_latency", "body": "# RB-011 \u2014 HTTP high latency / elevated error rate\n\n## Metadata\n\n```yaml\nid: RB-011\ntitle: HTTP high latency / elevated error rate\nstatus: draft\nowner: Argus Team\nversion: 1.1.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: http_errors_latency\n```\n\n## Scope\n\nDeclared HTTP routes through NGINX/API/dependencies on Host T. Record route, expected statuses, timeout, authentication profile, histogram format and software versions. Exclude arbitrary user URLs and writes used as probes. Follow [shared contracts](../RUNBOOK-CONVENTIONS.md); dedicated latency/error detection is missing.\n\n## Incident definition\n\nUser request latency or unsuccessful-response rate exceeds the service's agreed objective under meaningful traffic. Investigate latency, traffic, errors and saturation together; internal and external observations answer different questions. [Google SRE monitoring](https://sre.google/sre-book/monitoring-distributed-systems/)\n\n## User / service impact\n\nIdentify affected routes, tenants/cohorts and slow versus failed requests without collecting customer payloads. Measure successful throughput too; a quiet endpoint with no errors may simply have lost all traffic.\n\n## Trigger / detection conditions\n\nProposed trigger: use the service's agreed, versioned user-facing SLI/SLO and alert policy. Where the SLI counts bad requests (including requests slower than its latency threshold), evaluate error-budget burn over a long window and a short window that confirms the budget is still being consumed; choose windows and paging thresholds from the service's response-time needs and test them against historical incidents. Also require a meaningful request denominator. An independently confirmed broad outage can merit immediate incident coordination even before a sustained alert matures. For low-traffic routes, evaluate a separately defined safe synthetic probe or an appropriately scoped aggregate without mixing synthetic requests into the real-user SLI. No universal burn, latency or traffic threshold is supplied. Undefined objective, missing denominator or absent metric means uncalibrated/insufficient evidence. Current binary endpoint failure may route via RB-002 but is not an implemented latency detector.\n\n## Symptoms\n\nSlow successful responses, timeouts, 5xx or route-specific unexpected status, falling good throughput, retries and queue growth.\n\n## Plausible causes / hypotheses\n\nH1 traffic/concurrency overload; H2 slow/unavailable dependency; H3 CPU/memory/I/O saturation; H4 proxy/TLS/network issue; H5 code/config regression; H6 expensive route/query or cache miss; H7 authentication/client/config issue; H8 telemetry artifact or low-volume noise.\n\n## Required evidence\n\nSame-window latency distribution, total/success/error counts, route/status classes, queue/saturation, dependency timings, safe request-path trace metadata and deployment history. Preserve SLI/SLO and alert-policy versions, bad-event definition, budget window, short/long burn windows and request denominators. Keep synthetic-probe outcomes separate from real-user observations; preserve source vantage and distinguish edge latency from application processing.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `check_http_endpoint(url, timeout_s=3)` | Bounded allowlisted GET; individual status/latency | `READ_ONLY_SENSITIVE` |\n| `trace_request_path(container)` | Declared hop checks, not distributed tracing | `READ_ONLY_SENSITIVE` |\n| `get_cpu_history(container, minutes=30)` / `get_memory_history(container, minutes=30)` | Resource correlation | `READ_ONLY_SAFE` |\n| `get_io_metrics()` | Current storage pressure | `READ_ONLY_SAFE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Sanitized error/timeout context | `READ_ONLY_SENSITIVE` |\n| `inspect_database_health(container)` | Relevant DB capacity/waits | `READ_ONLY_SENSITIVE` |\n| `correlate_incident_timeline(container, minutes=30)` | Change/error chronology | `READ_ONLY_SENSITIVE` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_latency_history(service_id, route_id, minutes)` and `get_service_traffic_history(service_id, minutes)` expose distribution/count/error denominators with coverage, `READ_ONLY_SAFE`; `get_request_trace_summary(service_id, trace_id)` returns allowlisted span timings/errors with no payload/secret headers, `READ_ONLY_SENSITIVE`; deployment/external-probe history shared with other runbooks. Versioned SLI/SLO definitions, error-budget policy, alert windows and synthetic-probe identity must be available to the detector before any burn-rate selection is implemented. `trace_request_path` is not an OpenTelemetry trace implementation.\n\n## Diagnostic workflow\n\n| Step | Action / reason | Interpretation / next step |\n|---|---|---|\n| 1 | Confirm objective breach, volume and sample quality; check both burn windows when configured | Too few real requests/unknown SLO \u2192 use the approved low-traffic path or qualify uncertainty. Long-window breach without current short-window burn may be historical, not an active page. Credible active impact \u2192 2. |\n| 2 | Compare edge and app probes, status classes and successful throughput | Edge-only failure \u2192 RB-015/016/009. Matching app degradation \u2192 3. |\n| 3 | Trace declared dependencies and DB state | Failed/slow dependency \u2192 RB-003/013; protect victim. No discriminating timing \u2192 request trace summary. |\n| 4 | Align CPU/memory/I/O and queue history with traffic | Saturation rises before latency \u2192 resource/load hypothesis; normal resource headroom weakens it but does not prove code fault. |\n| 5 | Compare route/query/deployment cohorts | One route or new artifact degrades \u2192 H5/H6; all clients/auth profile changes \u2192 H7. Correlation alone is insufficient for rollback. |\n| 6 | Preserve distribution and failure evidence, choose owner mitigation | Missing denominator or dependency timing keeps multiple hypotheses; avoid a blind restart. |\n\n## Decision tree\n\n```text\ncredible active SLI breach + sufficient real-user traffic?\n  no -> approved low-traffic probe / telemetry / contract investigation\n  yes -> edge-only? -> proxy/network/TLS\n         dependency slow? -> dependency owner\n         saturation + queue? -> capacity/resource branch\n         route/artifact-specific? -> application/regression investigation\n         none discriminates? -> insufficient_evidence\n```\n\n## Evidence interpretation\n\nFor counters use reset-aware rates before aggregation; classic histogram quantiles require bucket-compatible aggregation including `le`. Do not average precomputed percentiles or combine incompatible histograms. Native histogram handling depends on the deployed Prometheus version. Empty traffic denominators are unknown/not-applicable, not zero errors. [Prometheus functions](https://prometheus.io/docs/prometheus/latest/querying/functions/)\n\n## False positives and edge cases\n\nLow request count, changed route labels/buckets, failed requests excluded from latency, counter reset, health endpoint cheaper than real work, cached responses, retry amplification, timeout censoring and a changed probe origin. A green synthetic probe may miss a failing user route; mixing its successes with real-user counts can hide impact. A long-window breach after recovery is not proof of current burn.\n\n## Diagnosis outcome\n\nAll common outcomes allowed. Probable diagnosis needs route/vantage and time-aligned causal-mechanism evidence plus alternatives; do not equate a 5xx with a specific backend cause.\n\n## Mitigation\n\nOwner can reduce non-critical load, shed approved traffic or restore a compatible known-good release. These are separately controlled procedures; Argus has no generic traffic-management or rollback write capability. Restart requires an independently evidenced process-stall case under RB-002.\n\n## Recovery\n\nObjectives and successful throughput recover for the affected route/cohort, dependencies are healthy and backlog is draining under restored demand.\n\n## Root-cause correction\n\nFix expensive code/query, retry behavior, dependency issue, capacity or regression. Temporary load reduction is not a performance fix; record dropped functionality.\n\n## Action safety\n\nTraffic shedding, rollback/config changes and restarts are `MUTATING_HIGH_RISK`. Require precise route/service/artifact and identity, protected clients/transactions, capacity and compatibility checks, bounded duration and rollback. Block unknown user impact, untested health probe semantics, absent tool/profile or missing deterministic predicates. GET probes must be configured as harmless endpoints; do not replay business transactions.\n\n## Human-in-the-Loop\n\nShow affected cohort, accepted/dropped traffic, exact operation and expected objective change. Frozen approval is required for each write; a general latency alert is not permission to change retries/timeouts.\n\n## Forbidden actions\n\n`FORBIDDEN`: disable alerts, hide errors by changing success definitions, unbounded retries/load tests, replay payments/writes as probes, expose traces with secrets, or restart every service on the path.\n\n## Evidence preservation\n\nPreserve compact same-window distributions/counts and redacted trace/error refs plus artifact identity before change. Retain no request bodies, tokens or raw customer identifiers.\n\n## Verification\n\nThree post-action source-fresh samples, followed by two complete 5-minute SLI windows with sufficient traffic. Success: configured latency/error objective met, good throughput restored, queue drains and dependency/resource metrics agree. Old rolling-window samples cannot prove immediate post-action recovery. Low traffic, gaps, recurrence or short verification timeout yields provisional state and escalation.\n\n## Rollback\n\nOwner restores previous traffic/config/artifact through a reviewed compatible change. Preserve old limits and queue implications; undoing mitigation must not instantly restore overload. No automatic rollback exists in current Argus.\n\n## Escalation\n\nApplication/incident commander for broad user impact; platform or dependency owner by evidence. Attach SLI definitions/denominators, route/vantage, correlated resource windows and missing discriminating trace; stop speculative actions.\n\n## Recording / memory\n\nCommon record plus SLO/SLI version, histogram/count semantics, affected cohort, successful throughput and service versus root-cause recovery.\n\n## Prevention / follow-up\n\nGolden-signal dashboards, appropriate SLO alerts, bounded retries, route budgets, safe trace redaction and representative load tests.\n\n## Lab validation\n\nDisposable API receives 10 harmless requests/second for a fixed 2-minute baseline; inject 500 ms delay on half the requests for 2 minutes, then separately return synthetic 500 responses on 20%. Set the lab objective, bad-event definition and short/long alert windows before testing; this short fixture does not validate a longer production window. Expect proposed/unsupported RB-011 trigger, latency versus error evidence, no invented dependency/CPU cause, and no blind restart. Reject a mutating probe URL. Operator clears the fixture; verify two full 5-minute windows under the same load and record all stages. Replay zero traffic, one failed request on a quiet route, an independently green probe that misses a broken user route, a recovered short window with an older long-window breach, and a counter reset. None may yield false healthy service or an invented active page. Not executed.\n\n## References\n\n- [Google SRE monitoring](https://sre.google/sre-book/monitoring-distributed-systems/), [Prometheus functions](https://prometheus.io/docs/prometheus/latest/querying/functions/).\n- *The Site Reliability Workbook* (2018), \u201cAlerting on SLOs,\u201d PDF pp. 107\u2013121, for active short/long budget burn and low-traffic caveats.\n- [Argus assessment](../RUNBOOK-ASSESSMENT.md) \u2014 actual composite capabilities.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nRequest distribution/counts, route objectives and alert-policy version, short/long budget burn, queue/progress, redacted span timings and separate external/synthetic vantage.\n\n### Missing tools\n\n`get_latency_history`, `get_service_traffic_history`, `get_request_trace_summary`, deployment/probe history.\n\n### Tool improvements\n\nDistinguish path probes from traces; explicit units, denominators, reset handling, source timestamps and probe success contract.\n\n### Detector improvements\n\nSLI/SLO-aware detector with configured short/long active-burn logic where the objective counts bad events, a separate low-traffic path, request denominators and missing-series state; binary health is insufficient.\n", "file": "RB-011-http-latency-errors.md"}, {"id": "RB-012", "title": "File descriptor / socket exhaustion", "status": "draft", "version": "1.0.1", "detector": "fd_socket_exhaustion", "body": "# RB-012 \u2014 File descriptor / socket exhaustion\n\n## Metadata\n\n```yaml\nid: RB-012\ntitle: File descriptor / socket exhaustion\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: fd_socket_exhaustion\n```\n\n## Scope\n\nLinux processes in declared Docker workloads. Record host/container identity, host PID plus process start time, network namespace, kernel and effective limits. Separate per-process descriptors, host file handles, socket state, listen backlog and ephemeral ports. [Common contracts](../RUNBOOK-CONVENTIONS.md) apply; this detector is missing.\n\n## Incident definition\n\nNew files or connections cannot be acquired because the applicable resource boundary is exhausted. `RLIMIT_NOFILE` constrains descriptors; exceeding it can produce `EMFILE`. A process descriptor limit is not a general socket-capacity measurement. [Linux resource limits](https://man7.org/linux/man-pages/man2/getrlimit.2.html)\n\n## User / service impact\n\nFailed accepts/connects/file opens, unavailable requests and degraded logging. Establish which process and request path is affected; many open connections can be normal.\n\n## Trigger / detection conditions\n\nProposed warning: descriptor usage above 80% of effective soft limit for 5 minutes with rising trend; critical on corroborated acquisition failure. Socket/port backlog errors need their own measured boundary. Unknown limit, missing FD observation or replaced PID must not yield a ratio. No dedicated current detector exists.\n\n## Symptoms\n\nToo-many-open-files errors, stalled accepts, connection acquisition failures, growing file/socket counts and loss of useful throughput.\n\n## Plausible causes / hypotheses\n\nH1 descriptor leak; H2 legitimate concurrency exceeds limit; H3 oversized/unbounded pools; H4 slow peer keeps connections occupied; H5 host-wide handle pressure; H6 ephemeral-port/listen-backlog issue; H7 low configured process limit. Namespace socket counts alone cannot distinguish these.\n\n## Required evidence\n\nExact sanitized error, per-process open count and soft/hard limit, process start identity, trend at comparable demand, descriptor categories, socket states/destinations, host handles, port/backlog pressure and pool/peer health. Do not retrieve file contents through descriptor links.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `get_container_processes(container)` | Obtain current host PID and process ownership | `READ_ONLY_SENSITIVE` |\n| `inspect_process_details(container, pid)` | Ownership-checked current FD/socket counts, age/status | `READ_ONLY_SENSITIVE` |\n| `get_socket_summary(container)` | Namespace-level TCP states and destinations, not per-PID attribution | `READ_ONLY_SENSITIVE` |\n| `get_network_history(container, minutes=30)` | Traffic context; missing-error fields are unreliable | `READ_ONLY_SAFE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Exact resource-acquisition error | `READ_ONLY_SENSITIVE` |\n| `capture_diagnostic_snapshot(container)` | Preserve current process state | `READ_ONLY_SENSITIVE` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_fd_limits(container, pid, process_start_id)` returns effective process limits and host handle capacity; `get_process_fd_usage(container, pid, process_start_id, minutes)` adds bounded count/category history; `get_socket_capacity(container)` exposes configured port/backlog bounds and errors. All `READ_ONLY_SENSITIVE`, identity-checked, without descriptor targets containing secrets or file contents. Current `inspect_process_details` lacks limits/history and robust explicit start-identity binding.\n\n## Diagnostic workflow\n\n| Step | Action / reason | Interpretation / next step |\n|---|---|---|\n| 1 | Error plus process identity | File-acquisition error and correct live process \u2192 2. Process replaced \u2192 rebind and preserve old evidence. |\n| 2 | Current FD count versus effective limit/history | Near process limit supports H1/H2/H7. Missing limit \u2192 insufficient attribution, not assumed default. |\n| 3 | Categorize descriptors and correlate demand | Persistent growth at stable traffic supports leak; bounded peak tracks useful work \u2192 capacity/pool sizing. |\n| 4 | Namespace socket states, pool/peer health | Slow peer or pool accumulation supports H3/H4; numerous socket states alone do not prove open-FD leak. |\n| 5 | Host/port/backlog constraints if process has headroom | H5/H6 requires its own measured limit/error; request missing capability rather than tuning kernel blindly. |\n| 6 | Preserve evidence; choose owner mitigation | Unknown boundary/owner \u2192 no restart/limit increase. Proven process leak may justify one separately permitted restart. |\n\n## Decision tree\n\n```text\nprocess count near known FD limit + matching error? -> leak / demand / low limit\n  no -> host handle or socket/port/backlog boundary measured?\n          yes -> boundary-specific investigation\n          no -> insufficient_evidence\ncount grows with stable demand? -> retention hypothesis\nslow dependency/pool backlog? -> fix owner/peer, protect victim\n```\n\n## Evidence interpretation\n\n`/proc/<pid>/fd` describes descriptors held by that process; network-namespace tables are a different scope. Do not equate all namespace sockets with one application's open descriptors. [Linux process descriptors](https://man7.org/linux/man-pages/man5/proc_pid_fd.5.html) TCP state/queue behavior and kernel tuning are version-dependent; do not derive a safe tuning change from a count alone. [Linux TCP](https://man7.org/linux/man-pages/man7/tcp.7.html)\n\n## False positives and edge cases\n\nShared namespaces, short-lived PID reuse, expected large pool, brief load burst, inaccessible `/proc`, FD count changing during collection, many TIME_WAIT entries without corresponding process-held descriptors and unknown IPv6 addresses in current summary.\n\n## Diagnosis outcome\n\nAll common outcomes allowed. A probable leak requires persistent attributed growth and lifecycle evidence; one near-limit count supports exhaustion only. Keep host/process/port boundaries explicitly separate.\n\n## Mitigation\n\nOwner can reduce non-critical concurrency or refresh an evidenced leaking process through a permitted restart. Raising a limit without demand/host assessment may merely defer failure. No generic kernel tuning is available.\n\n## Recovery\n\nNew connections/files and representative requests succeed, descriptor/socket demand stabilizes with adequate headroom, and dependencies remain healthy.\n\n## Root-cause correction\n\nClose resources reliably, bound pools/timeouts, repair peer stalls or set a reviewed process capacity limit matching tested demand and host resources.\n\n## Action safety\n\nRestart, concurrency/limit/pool change are `MUTATING_HIGH_RISK`. Bind exact container/process identity, preserve counts/categories, assess in-flight loss and peer reconnect load, protect critical services and require a supported capability/gate. Block guessed limit values, absent ownership, unresolved dependency, missing predicate enforcement or unsupported class. Limit changes remain operator procedures.\n\n## Human-in-the-Loop\n\nShow measured boundary, count/limit/trend, exact operation and expected reconnect/work-loss risk. Approval of restart does not approve raising system limits. Expiry/identity change cancels the write.\n\n## Forbidden actions\n\n`FORBIDDEN`: arbitrary kill, global file/socket sysctl changes, unlimited ulimit, forcibly close unknown descriptors, expose descriptor file contents, or blindly reset connections.\n\n## Evidence preserv
