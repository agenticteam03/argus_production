e/locking behavior; `VACUUM FULL` can require additional disk and exclusive locking and is not a generic disk-full remedy. [Routine vacuuming](https://www.postgresql.org/docs/16/routine-vacuuming.html)\n\n## Action safety\n\nStorage expansion, query/client stop, slot/retention change, maintenance or DB restart are `MUTATING_HIGH_RISK`. Require exact database/mount/consumer identity, backup/replication owner sign-off, capacity/locking impact and tested recovery plan. Block manual data/WAL deletion, unknown consumer, absent recoverability evidence, missing capability, protected migration/replica or insufficient maintenance headroom. Current Argus escalates, not broadens Docker cleanup scope.\n\n## Human-in-the-Loop\n\nShow reserve/time-to-full, growth category, exact proposed change, affected replicas/backup guarantees and irreversible consequences. Approval to stop a batch client never authorizes dropping a replication slot.\n\n## Forbidden actions\n\n`FORBIDDEN`: delete data/WAL/volume files, unreviewed slot removal, disable fsync/archiving, arbitrary SQL maintenance, VACUUM FULL under unassessed shortage, database restart as cleanup or treat a backup as expendable cache.\n\n## Evidence preservation\n\nCompact redacted category/retention/transaction metadata in a healthy remote sink; no database dumps on the filling disk. Save pre-change replica/archive state and owner constraints.\n\n## Verification\n\nThree distinct fresh post-change storage and transaction-health observations, then 15 minutes of controlled growth plus appropriate archive/replication cycles. Meet configured reserve/time-to-full policy, no new write errors, required consumers progress and backlog declines. Successful DB connect alone is insufficient. Missing transaction/retention telemetry or recurrence prevents closure and escalates.\n\n## Rollback\n\nCapacity expansion may not be reversible; deleted WAL or dropped consumer state may require reinitialization and has no automatic undo. Owner changes retain prior config and tested backup/recovery procedure. Never shrink storage blindly to reverse an expansion.\n\n## Escalation\n\nDBA immediately for WAL/data pressure; storage and backup/replication owners as needed. Attach category/mount growth, consumer identities, recoverability constraints and next missing evidence. Stop any action with unknown data-loss effect.\n\n## Recording / memory\n\nCommon record plus data/WAL/tablespace identities, reserve, retaining consumer, backup objectives, transaction recovery and unresolved capacity/maintenance work.\n\n## Prevention / follow-up\n\nCategory/mount alerts, slot/archive lag budgets, transaction age control, tested capacity/backup procedures and maintenance sizing.\n\n## Lab validation\n\nDisposable PostgreSQL 16 with a separate capped test data volume: configure a lab-only warning at 80% usage, then generate synthetic data in 8 MiB bounded batches to that threshold; watchdog stops at 85% usage, before uncontrolled database failure. Use a 30-second lab pending duration and retain the bounded data through detection. Separately pause a disposable replication consumer with strict WAL-volume/60-second abort bounds. Expect proposed/unsupported RB-019 selection, H1 versus H2 only with category telemetry, refusal of WAL/volume deletion and no fabricated cleanup. Owner stops fixture/restores consumer or expands only the disposable volume. Verify transaction success/reserve/retention over 15 minutes, record every lifecycle stage and restore snapshot on abort. No database fault was executed.\n\n## References\n\n- [Disk-full failure](https://www.postgresql.org/docs/16/disk-full.html), [replication slots](https://www.postgresql.org/docs/16/view-pg-replication-slots.html), [standbys](https://www.postgresql.org/docs/16/warm-standby.html).\n- [Archiving](https://www.postgresql.org/docs/16/continuous-archiving.html), [vacuuming](https://www.postgresql.org/docs/16/routine-vacuuming.html).\n\n## Argus capability gaps\n\n### Missing telemetry\n\nDatabase mount/category history, retention/consumer health, maintenance/spill and application transaction success.\n\n### Missing tools\n\n`get_db_storage_usage`, `get_db_wal_retention`, `get_db_archive_status`, `get_db_maintenance_state`, `get_database_transaction_health`, shared filesystem tools.\n\n### Tool improvements\n\nDo not equate DB size or root disk history with all database storage; source-aware read-only templates and redacted identities.\n\n### Detector improvements\n\nCategory/reserve/time-to-full detector with backup/replication policy and DB-owner permissions.\n", "file": "RB-019-postgresql-disk-capacity-pressure.md"}, {"id": "RB-020", "title": "Time synchronization / clock drift", "status": "draft", "version": "1.0.1", "detector": "clock_drift", "body": "# RB-020 \u2014 Time synchronization / clock drift\n\n## Metadata\n\n```yaml\nid: RB-020\ntitle: Time synchronization / clock drift\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: clock_drift\n```\n\n## Scope\n\nLinux Host A/Host T and declared trusted time sources. Determine actual time service (chrony, systemd-timesyncd or another supported daemon), version and VM context. Chrony 4.6 is the reference version here, not an assumed deployment. Host A is not in the inspected lab target scope and needs explicit read authorization. [Common contracts](../RUNBOOK-CONVENTIONS.md) apply; clock detection/tools are missing.\n\n## Incident definition\n\nClock offset/uncertainty exceeds the service's approved tolerance or synchronization is lost sufficiently to make event ordering/validity unreliable. A time zone display difference is not clock drift. Clock status must include source quality and measurement age, not just a \u201crunning\u201d daemon flag. [chrony tracking](https://chrony-project.org/doc/4.6/chronyc.html)\n\n## User / service impact\n\nPossible TLS/authentication validity failures, misleading metric freshness, incorrect schedules and unreliable incident chronology. Corroborate the actual application failure; a time warning alone does not prove these impacts occurred.\n\n## Trigger / detection conditions\n\nProposed alert: absolute offset plus reported uncertainty breaches the strictest relevant application tolerance over three fresh sync observations, or sync is lost beyond its allowed interval. Lab tolerance may be 1 second; production tolerance must be explicitly supplied. Unknown tolerance/source age is insufficient evidence. Required detector freshness remains fail-closed; never widen it to conceal drift.\n\n## Symptoms\n\nClock-offset alert, unsynchronized status, old source update, inconsistent event order, certificate not-yet-valid/expired complaints, token time errors and apparent negative durations.\n\n## Plausible causes / hypotheses\n\nH1 time daemon stopped/misconfigured; H2 trusted source unreachable; H3 unreliable/wrong source; H4 VM pause/resume or manual step; H5 multiple competing time services; H6 log timezone/format issue; H7 source/application timestamp bug instead of host drift.\n\n## Required evidence\n\nHost/boot identity, active daemon/version, configured source IDs, selected source/reference time, measured offset/dispersion/delay and sync state/history, trusted comparison, monotonic observation sequence and relevant application errors. Preserve raw source times with uncertainty, not a falsely precise merged timeline.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `get_system_uptime()` | Target-host boot context; not synchronization proof | `READ_ONLY_SAFE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Bounded application time-related errors | `READ_ONLY_SENSITIVE` |\n| `correlate_incident_timeline(container, minutes=30)` | Existing timeline, trustworthy only after clock confidence is established | `READ_ONLY_SENSITIVE` |\n\nExisting `get_journal_logs` permits only Docker/containerd and cannot inspect chrony/timesyncd. A denied unit is not grounds for arbitrary journal access.\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_time_sync_status(host_id)` returns daemon/source/offset/error bounds/reference time/boot identity via fixed read-only operations; `get_clock_offset_history(host_id, minutes)` returns drift/sync coverage; `get_time_service_logs(host_id, since, max_lines)` returns redacted allowlisted time-unit errors. Status/history are `READ_ONLY_SAFE`, logs `READ_ONLY_SENSITIVE`. Transport diagnosis must support the actual time protocol; a successful TCP check does not establish NTP reachability. No arbitrary date/chronyc/systemctl interface.\n\n## Diagnostic workflow\n\n| Step | Action / why | Interpretation / next step |\n|---|---|---|\n| 1 | Verify format/timezone versus a registered trusted reference | Equal instants displayed differently \u2192 H6. Real offset/unknown reference \u2192 2. |\n| 2 | Sync status with reference age/error bounds | Stopped service \u2192 H1; old/unselected sources \u2192 H2/H3; daemon active alone proves nothing. |\n| 3 | Offset history and boot/VM change timeline | Sudden discontinuity supports H4; accumulating drift with source loss supports H2. Missing history leaves alternatives. |\n| 4 | Approved time-unit config/logs | Conflicting service/config or source selection evidence \u2192 H1/H3/H5. Never retrieve secret auth material. |\n| 5 | Compare actual application/metric timestamps | Host clock sound but one producer wrong \u2192 H7; avoid reordering unrelated incidents based on suspect times. |\n| 6 | Owner plans safe synchronization repair | Step versus gradual correction requires application/cluster impact review. Current Argus cannot change time. |\n\n## Decision tree\n\n```text\ntimezone/format only? -> correct interpretation, not host clock\nactual offset known with trusted reference? no -> insufficient_evidence\n  yes -> daemon/source health -> config/network/source/VM investigation\n         only one producer wrong? -> application timestamp defect\n         unsafe to order events? -> mark temporal uncertainty, block dependent writes\n```\n\n## Evidence interpretation\n\nWall-clock time can jump; monotonic clocks provide a distinct elapsed-time basis and are not equivalent to globally comparable timestamps. [Linux clocks](https://man7.org/linux/man-pages/man2/clock_gettime.2.html) Chrony normally corrects gradually; a forced step can affect applications. Read-only tracking evidence is not authority to issue `makestep`. [chrony manual](https://chrony-project.org/doc/4.6/chronyc.html)\n\n## False positives and edge cases\n\nTimezones/daylight-saving display, stale reference, VM suspend, wrong clock domain, source uncertainty larger than observed offset, leap handling, container timestamps reflecting host clock and delayed log ingestion.\n\n## Diagnosis outcome\n\nAll common outcomes allowed. Probable clock fault needs trustworthy comparison and daemon/source evidence; apparent event order or one TLS error alone yields multiple hypotheses. Explicitly reduce confidence in time-dependent diagnoses.\n\n## Mitigation\n\nPlatform owner restores approved synchronization/source reachability and isolates time-sensitive automation through an existing operating procedure. Retain independent reference timestamps; do not falsify event times or alter auth tolerances.\n\n## Recovery\n\nClock offset/uncertainty and source update age satisfy application tolerance, synchronization persists, and affected applications/metric freshness recover.\n\n## Root-cause correction\n\nRepair source/config/network/VM behavior, ensure one intended synchronization owner, and use correct elapsed-time clocks in software. systemd-timesyncd is one possible service, with its own documented behavior; do not assume chrony commands apply. [systemd-timesyncd source manual](https://raw.githubusercontent.com/systemd/systemd/main/man/systemd-timesyncd.service.xml)\n\n## Action safety\n\nTime step, service/config/source changes are `MUTATING_HIGH_RISK` with host-wide blast radius. Require exact host/source/config, trusted offset evidence, database/lease/auth/scheduler owner review and plan for discontinuities. Block arbitrary Internet source, unauthenticated assumptions, unknown cluster impact, unsupported capability or a backwards-step proposal without explicit owner procedure. Current Argus remains read-only/escalating.\n\n## Human-in-the-Loop\n\nShow offset and error bounds, exact synchronization change, affected applications and time-dependent approval/audit risk. Approval to restart a container is never approval to set host time; stale clock confidence can also invalidate action expiry checks.\n\n## Forbidden actions\n\n`FORBIDDEN`: arbitrary set-date/makestep, turn off TLS/token validity checks, forge timestamps, alter time to extend approvals, unreviewed source trust or silently merge events with uncertain ordering.\n\n## Evidence preservation\n\nRetain original source/collection timestamps, clock domain, boot ID, offset bounds and event sequence before correction. Store append-only evidence; never rewrite prior audit times to make them appear ordered.\n\n## Verification\n\nAfter owner repair, at least three fresh sync updates spanning 5 minutes or two configured source-update intervals, whichever is longer. Offset plus uncertainty is within the declared tolerance, source is trusted/current, no renewed discontinuity and affected applications succeed. If wall-clock comparison to action time is unreliable, require independent observer/monotonic sequence proof and escalate until established; do not pretend ordinary timestamp comparison is sufficient.\n\n## Rollback\n\nDo not automatically reverse a clock step. Owner may restore previous valid configuration/source only after impact review; a second time discontinuity is another high-risk change. No automatic time rollback exists.\n\n## Escalation\n\nPlatform/time-service owner; DB/security/application owners for time-dependent failures. Attach offset/uncertainty, source age, boot context and suspect event ordering. Stop time-dependent automation where freshness/approval validity cannot be established.\n\n## Recording / memory\n\nCommon record plus clock domain/reference, uncertainty interval, corrected source/config and which earlier causal conclusions remain untrustworthy.\n\n## Prevention / follow-up\n\nTrusted source monitoring, offset/error-bound alerts, VM recovery tests, monotonic duration measurements and source timestamp provenance.\n\n## Lab validation\n\nUse replayed clock/status fixtures first: offset +5 seconds, lost source, then timezone-only difference, with lab tolerance 1 second. Expect proposed/unsupported RB-020 detection, real drift versus formatting distinction and refusal of forged timestamp/approval extension. No workstation/production clock is changed. Any live experiment requires a separate disposable VM and out-of-band observer; operator controls restoration. Replay fresh sync updates and application recovery, assert the full verification window, source-order uncertainty and all lifecycle records. Denied host-time approval results in no action. Not executed.\n\n## References\n\n- [chrony 4.6 manual](https://chrony-project.org/doc/4.6/chronyc.html), [Linux clocks](https://man7.org/linux/man-pages/man2/clock_gettime.2.html).\n- [Official systemd-timesyncd manual source](https://raw.githubusercontent.com/systemd/systemd/main/man/systemd-timesyncd.service.xml).\n\n## Argus capability gaps\n\n### Missing telemetry\n\nOffset/error-bound/source-age history, boot/clock domains and trusted cross-host comparison.\n\n### Missing tools\n\n`get_time_sync_status`, `get_clock_offset_history`, `get_time_service_logs`.\n\n### Tool improvements\n\nClock confidence in correlation/freshness/approval validation; exact host/unit read scope and protocol-specific time-source observations.\n\n### Detector improvements\n\nTolerance/error-bound-aware clock detector; no timestamp or stale-guard bypass, with safe temporal uncertainty propagation.\n", "file": "RB-020-time-synchronization-clock-drift.md"}, {"id": "RB-021", "title": "Host/service overload and cascading failure", "status": "draft", "version": "1.1.1", "detector": "cascading_overload", "body": "# RB-021 \u2014 Host/service overload and cascading failure\n\n## Metadata\n\n```yaml\nid: RB-021\ntitle: Host/service overload and cascading failure\nstatus: draft\nowner: Argus Team\nversion: 1.1.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: cascading_overload\nactivation_prerequisite: validated_core_runbooks_and_service_load_policies\n```\n\n## Scope\n\nDeclared multi-service request graphs on Host T with known criticality, dependency capacity and retry/queue behavior. This is an advanced design draft; do not activate until core resource/dependency runbooks and bounded load controls are validated. Record service versions, topology/config revision and clock confidence. [Shared contracts](../RUNBOOK-CONVENTIONS.md) apply.\n\n## Incident definition\n\nA local capacity/failure event propagates as retries, queueing or redirected load increase demand on other services, producing further failures. Simultaneous alerts alone do not prove a cascade. Overload can be amplified by retry behavior and loss of capacity. [Google SRE cascading failures](https://sre.google/sre-book/addressing-cascading-failures/)\n\n## User / service impact\n\nMap affected critical paths, accepted/successful work, dropped/delayed jobs and healthy capacity. State the current degraded mode and which request priorities or customer cohorts lose functionality; lower errors after shedding can conceal lost work. Establish incident coordination early when several owners are involved; maintain a single shared timeline and decisions. [SRE incident response](https://sre.google/workbook/incident-response/)\n\n## Trigger / detection conditions\n\nProposed selection: two or more connected services breach their objectives during a 5-minute correlated window with evidence of shared resource/dependency pressure and increased retry/queue load. Existing Argus can produce individual health/dependency/OOM incidents only; do not collapse them into an invented executable class. Missing graph/clock/load evidence means a suspected cascade, not a confirmed root cause.\n\n## Symptoms\n\nRising latency/errors, queue depth/age, retries greater than incoming work, dropped traffic, saturated resources, pool/connection exhaustion and many victim health failures.\n\n## Plausible causes / hypotheses\n\nH1 demand exceeds a shared dependency; H2 retry feedback loop; H3 capacity loss/failover overloads survivors; H4 unbounded queues/concurrency; H5 noisy neighbor/shared-host resource failure; H6 deployment/config mismatch; H7 unrelated simultaneous incidents or monitoring failure.\n\n## Required evidence\n\nVersioned dependency graph, per-service golden signals, offered/admitted/completed/retried/dropped rates by approved priority/cohort, queue depth/age, dependency capacity, resource pressure and aligned event times. Record the active degradation policy, rejection behavior and remaining useful capacity. Identify feedback edges and victim/consumer roles. Recovering the \u201cfirst alert\u201d is not necessarily the highest-value containment.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `trace_request_path(container)` | Declared path checks, limited to actual topology | `READ_ONLY_SENSITIVE` |\n| `correlate_incident_timeline(container, minutes=30)` | Related event chronology with missing-data limits | `READ_ONLY_SENSITIVE` |\n| `get_cpu_history(container, minutes=30)` / `get_memory_history(container, minutes=30)` | Resource contribution | `READ_ONLY_SAFE` |\n| `get_host_memory()` / `get_io_metrics()` | Shared-host contention | `READ_ONLY_SAFE` |\n| `inspect_database_health(container)` / `get_db_connection_history(database, minutes=30)` | Shared database capacity | `READ_ONLY_SENSITIVE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Bounded retry/timeout evidence | `READ_ONLY_SENSITIVE` |\n| `capture_diagnostic_snapshot(container)` | Selected implicated workload before intervention | `READ_ONLY_SENSITIVE` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_service_traffic_history(service_id, minutes)` distinguishes incoming/retried/completed/dropped work; `get_queue_health(service_id, queue_id, minutes)` returns depth, age, in-flight and drain rate; `get_retry_policy(service_id)` returns safe retry/timeout/concurrency metadata; `get_dependency_capacity(dependency_id)` reports tested budget/current admission. Traffic/queue/capacity are `READ_ONLY_SAFE`, config `READ_ONLY_SENSITIVE`. Bounded traffic shedding/concurrency controls would require separately reviewed write capabilities; none is presumed.\n\n## Diagnostic workflow\n\n| Step | Action / purpose | Interpret / next step |\n|---|---|---|\n| 1 | Establish topology, clock quality and critical-path impact | Incomplete graph/time ordering \u2192 preserve uncertainty. Monitoring gap \u2192 RB-014. |\n| 2 | Align per-service demand/completion and resource/dependency data | Shared saturation preceding victims supports H1/H5; unrelated failures leave H7 open. |\n| 3 | Compare offered versus retried work and queue age | Retry multiplication supports H2; rising old backlog without completion supports H4. Missing rate denominators prevents amplification claim. |\n| 4 | Review capacity loss/failover/deploy changes | H3/H6 candidates; compare surviving capacity and demand, not just restart order. |\n| 5 | Use validated core runbook to identify one narrow intervention | Choose a proven non-critical source/load control with expected measurable relief; protect victim services and required capacity. |\n| 6 | Coordinator approves one bounded owner action and observes graph response | If response contradicts hypothesis, stop further changes and reassess; do not launch parallel speculative mitigations. |\n| 7 | Gradually restore accepted work under owner supervision | Verify queue drain and all critical paths; keep unresolved defect follow-up. |\n\n## Decision tree\n\n```text\nconnected multi-service degradation + credible telemetry?\n  no -> separate incidents / observability / insufficient_evidence\n  yes -> shared capacity deficit? -> resource/dependency runbook\n         retries amplify demand? -> bounded retry/load-control owner\n         queues grow without useful completion? -> concurrency/backpressure owner\n         capacity loss or bad release? -> recovery/compatibility owner\n         narrow measured intervention unavailable? -> coordinated escalation\n```\n\n## Evidence interpretation\n\nAdmission control and bounded load shedding can protect useful work under overload, but the service must define priorities and rejection behavior in advance. Increasing timeouts or blindly adding retries can retain work and amplify pressure. These are design recommendations, not automatically safe runtime edits. [Google SRE handling overload](https://sre.google/sre-book/handling-overload/)\n\n## False positives and edge cases\n\nCommon monitoring outage, clock skew, shared deploy, failover warmup, duplicate alerts, legitimate queued batch work, low traffic masking broken service, retries missing from metrics and graph edges absent from topology.\n\n## Diagnosis outcome\n\nAll common outcomes allowed. Probable cascade needs supported propagation mechanism and affected edges, not just temporal correlation. State uncertainty about the initial defect separately from a well-supported harmful feedback loop.\n\n## Mitigation\n\nIncident coordinator directs one bounded reduction of non-critical demand/retries or pauses an attributed producer, using a pretested owner procedure with defined priority and rejection semantics. Measure accepted and shed work by priority/cohort and announce the degraded mode through the authorized incident process. Protect healthy capacity; mass restart and uncontrolled scale-out can worsen the incident. Core runbook gates still apply.\n\n## Recovery\n\nCritical good throughput returns, latency/errors meet objectives, queues drain without retry amplification and dependencies retain reserve while traffic is restored gradually. Lower error rate caused by dropping all traffic is not full recovery.\n\n## Root-cause correction\n\nFix original defect/capacity problem and feedback mechanisms: retry budgets/backoff, bounded queues/concurrency, admission control, load isolation and tested degraded operation. Containment is not proof the initiating cause is fixed.\n\n## Action safety\n\nLoad shedding, concurrency/retry changes, producer stop, scale, restart or rollback are `MUTATING_HIGH_RISK`. Require exact owned service/control, immutable config/version, maximum duration/amount, critical-work protection, dependency reserve, compensation/drain plan and observable rollback trigger. Block absent tested policy, unknown data semantics, unsupported class/tool, unvalidated core runbooks or missing graph-wide verification. No general `execute_runbook_action` extension is inferred.\n\n## Human-in-the-Loop\n\nShow who loses/delays work, precise control value/duration, expected measurable relief and full dependency blast radius. Coordinate owners through the incident process; each changed proposal needs approval. Argus does not send external notifications except through its existing authorized application flow.\n\n## Forbidden actions\n\n`FORBIDDEN`: restart all victims, purge queues, silently drop valuable work, blanket scale-to-zero, unlimited retries/timeouts, add capacity without dependency budget, bypass admission/auth or execute several speculative writes under one approval.\n\n## Evidence preservation\n\nPreserve compact topology/SLI/retry/queue/resource windows and action ordering; select snapshots within read budgets so diagnosis does not add meaningful overload. Protect payloads and customer identifiers.\n\n## Verification\n\nAfter each owner action, three source-fresh graph observations, then two complete 5-minute SLI windows and at least one relevant queue-drain/retry cycle. Good throughput rises, queue age/depth fall, retry multiplier and dependency pressure stabilize, and critical route objectives pass under restored traffic. Confirm accepted, rejected and dropped work by priority/cohort and remaining capacity; the service remains degraded until intentionally shed functionality is restored or explicitly accepted by the incident owner. New victim failures or reaccumulation stops restoration and escalates; do not claim whole-system recovery from one endpoint.\n\n## Rollback\n\nOwner restores previous admission/concurrency only in measured increments with dependency reserve. Dropped/expired work may be irreversible; replay requires idempotency/compensation review. No automatic queue, traffic or scaling rollback exists.\n\n## Escalation\n\nIncident commander plus dependency/platform/application owners for multi-service impact. Stop on missing load graph, protected workload risk, contradictory response or uncertain action. Attach supported propagation edges, queued/lost work, prior actions and one next discriminating observation.\n\n## Recording / memory\n\nCommon record plus graph version, feedback hypothesis/counterevidence, action sequence, dropped/deferred work, coordinated owners and separate mitigation/recovery/root-cause outcomes.\n\n## Prevention / follow-up\n\nValidate simpler runbooks first, then retry/queue budgets, overload tests, priority shedding, isolated failure domains and capacity-loss exercises.\n\n## Lab validation\n\nOnly after core validation: disposable frontend/backend and synthetic nonvaluable queue. Fix incoming rate at 10 requests/second; backend fixture accepts 5, client fixture retries at most twice with a 120-second watchdog and queue cap 100. Expect supported parent resource/dependency incidents, proposed RB-021 interpretation only when retry/queue telemetry exists, no victim mass restart. Denied/unsupported load-control proposal performs no write. Owner reduces only test producer rate below capacity, observes completion/queue drain through two windows and records all stages plus lost work. Replay simultaneous unrelated failures and missing retry metrics to require abstention. No cascade experiment has been executed.\n\n## References\n\n- [Google SRE cascading failures](https://sre.google/sre-book/addressing-cascading-failures/), [handling overload](https://sre.google/sre-book/handling-overload/), [incident response](https://sre.google/workbook/incident-response/).\n- *Building Secure and Reliable Systems* (2020), \u201cDesign for Resilience,\u201d PDF pp. 179, 193\u2013194, for controlled degradation and recording remaining capacity.\n- [Argus assessment](../RUNBOOK-ASSESSMENT.md) \u2014 current single-class execution constraints.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nVersioned dependency/load graph, retry amplification, queue age/drain, priority/cohort-specific shedding and tested remaining dependency capacity.\n\n### Missing tools\n\n`get_service_traffic_history`, `get_queue_health`, `get_retry_policy`, `get_dependency_capacity`; separately released load-control writes if justified.\n\n### Tool improvements\n\nComposite child freshness/failure provenance, temporal uncertainty and bounded graph-wide collection/verification.\n\n### Detector improvements\n\nCorrelated overload detector without causal shortcuts; coordinated ownership, graph-wide safety predicates and validated-core activation gate.\n", "file": "RB-021-cascading-overload.md"}];

    let code = false, lines = text.split('\n'), out = [];
    for (const raw of lines) {
      if (raw.startsWith('```')) { code = !code; out.push(code ? '<pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#0c1420;padding:13px;border-radius:6px;font-size:10px">' : '</pre>'); continue; }
      if (code) { out.push(e(raw) + '\n'); continue; }
      if (/^#{1,4} /.test(raw)) { const title = raw.replace(/^#+ /, ''); out.push('<h3>' + e(title) + '</h3>'); }
      else if (/^---\s*$/.test(raw)) out.push('<hr style="border:0;border-top:1px solid var(--line);margin:20px 0">');
      else if (raw.trim()) out.push('<div style="margin:5px 0;' + (raw.startsWith('|') ? 'font-family:Consolas,monospace;font-size:10px;overflow-wrap:anywhere' : '') + '">' + e(raw).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>') + '</div>');
    }
    if (code) out.push('</pre>');
    return out.join('');
  }
  function bookModal(id) { const b = BOOKS.find(x => x.id === id); if (!b) return; ui.modal = 'book'; modal(b.id + ' · ' + b.title, 'Actual repository source · version ' + b.version + ' · status ' + b.status, '<div class="note amber mb">Source runbooks are draft; simulated diagnoses are illustrative and do not promote a runbook to production status.</div><div class="readbook">' + markdown(b.body) + '</div>', '<span class="mono muted" style="font-size:9px">argus/runbooks/' + e(b.file) + '</span>' + btn('Close', 'close-modal', '', 'ghost'), true); }
  function searchModal() { ui.modal = 'search'; modal('Search workspace', 'Find incidents, infrastructure and runbooks.', '<input class="field" id="global-search" placeholder="Search a container, symptom, incident ID, or runbook..." autocomplete="off" aria-label="Search workspace"><div id="search-results" class="mt"></div>'); updateSearch(''); }
  function updateSearch(q) {
    q = q.toLowerCase();
    const rows = [...visibleIncidents().filter(i => (i.id + i.title + i.target).toLowerCase().includes(q)).map(i => ({ title: i.id + ' · ' + i.title, sub: i.target, action: 'incident', data: 'data-id="' + i.id + '"', icon: 'activity' })), ...BOOKS.filter(b => (b.id + b.title + b.detector).toLowerCase().includes(q)).map(b => ({ title: b.id + ' · ' + b.title, sub: b.detector, action: 'book', data: 'data-book="' + b.id + '"', icon: 'book' })), ...sim.targets.filter(t => canReadHost(t.host) && (t.name + t.host).toLowerCase().includes(q)).map(t => ({ title: t.name, sub: t.host + ' · ' + t.identity, action: 'inspect-target', data: 'data-ref="' + t.ref + '"', icon: 'box' }))].slice(0, 9);
    document.getElementById('search-results').innerHTML = rows.map(r => '<button type="button" class="search-result" style="background:none;color:var(--text);border-left:0;border-right:0;border-top:0;text-align:left;width:100%" data-action="' + r.action + '" ' + r.data + '>' + ico(r.icon, 16) + '<div><span style="font-size:12px">' + e(r.title) + '</span><small>' + e(r.sub) + '</small></div><div class="flex1"></div>' + ico('right', 12) + '</button>').join('') || '<p class="muted">No matching results.</p>';
  }
  function inspectModal(ref) { const t = sim.target(ref); if (!t || !canReadHost(t.host)) return; const s = sim.statusOf(t); ui.modal = 'inspect'; modal(t.name, t.host + ' · exact immutable container identity ' + t.identity, '<div class="detail-grid"><div>' + [['State', s.state], ['Health', s.health], ['CPU', s.cpu + '%'], ['Memory', s.memory + ' / ' + t.limit + ' MiB'], ['Restart count', s.restarts]].map(([k, v]) => '<div class="kv"><span>' + k + '</span><span>' + e(v) + '</span></div>').join('') + '</div><div><div class="note">Target reference: <span class="mono">' + e(ref) + '</span><br><br>Inventory routes this host to its own read gateway. A same-named container on another host is a different target.</div></div></div>', btn('Inspect in console', 'inspect-console', 'data-ref="' + e(ref) + '"', 'primary', 'terminal') + btn('Close', 'close-modal', '', 'ghost')); }
  function runCommand(command) { const result = sim.console(command, ui.consoleHost); ui.consoleLines.push({ command, text: result.text, ok: result.ok, host: ui.consoleHost }); if (ui.consoleLines.length > 40) ui.consoleLines.shift(); render(); document.getElementById('console-command')?.focus({ preventScroll: true }); }
  function updateCountdowns() { document.querySelectorAll('[data-countdown]').forEach(el => el.textContent = countdown(Number(el.dataset.countdown))); }

  document.addEventListener('click', event => {
    const target = event.target.closest('[data-action]');
    if (!target) { if (event.target.dataset.backdrop && ui.modal) closeModal(); return; }
    if (target.disabled) return;
    const a = target.dataset.action, d = target.dataset;
    switch (a) {
      case 'navigate': navigate(d.view); break;
      case 'incident': navigate('incidents', d.id); break;
      case 'simulate': simulateModal(); break;
      case 'select-scenario': ui.scenario = d.kind; if (!['oom', 'crash', 'unsupported', 'stale', 'budget', 'injection', 'health'].includes(d.kind)) ui.scenarioHost = 'vm-166'; simulateModal(); break;
      case 'inject': { ui.scenarioHost = document.getElementById('scenario-host').value; ui.actionResult = document.getElementById('scenario-result').value; const i = sim.inject(ui.scenario, { host: ui.scenarioHost, actionResult: ui.actionResult }); navigate('incidents', i.id); toast('Fault injected. A monitoring alert has triggered Argus.'); break; }
      case 'quick-cache': { const i = sim.inject('cache'); navigate('incidents', i.id); break; }
      case 'review': review(d.id); break;
      case 'approve': case 'deny': { const note = document.getElementById('approval-note')?.value || ''; const result = sim.answer(d.id, a === 'approve' ? 'approved' : 'denied', note, d.digest); if (result.ok) { closeModal(); render(); toast(result.message); } else { const err = document.getElementById('approval-error'); if (err) err.textContent = result.message; render(); } break; }
      case 'identity': identityModal(); break;
      case 'login-role': ui.loginRole = d.role; identityModal(); break;
      case 'login': if (document.getElementById('login-password').value !== 'argus-demo') document.getElementById('login-error').textContent = 'Use the public demo password: argus-demo.'; else { sim.setPrincipal(ui.loginRole); closeModal(); render(); toast('Demo session started as ' + ui.loginRole + '.'); } break;
      case 'special-login': sim.setPrincipal(d.role); closeModal(); render(); toast('Demo identity changed. Approval authority will be re-evaluated.'); break;
      case 'logout': sim.principal.revoked = true; sim.log('auth.signed_out', null, sim.principal.name + ' · session forgotten'); closeModal(); render(); toast('Demo session signed out.'); break;
      case 'expire': sim.principal.expires = sim.now - 1; sim.log('auth.session_expired', null, 'Short-lived session expired (demo).'); render(); toast('Session expired. Sign in to regain authorized actions.'); break;
      case 'profile': if (canManage()) { sim.setProfile(sim.profile === 'supervised' ? 'read_only' : 'supervised'); render(); toast('Demo policy changed. Existing proposals will fail their version check.'); } break;
      case 'hold': if (canManage()) { sim.toggleHold(d.ref); render(); toast(sim.holds.includes(d.ref) ? 'Target held. Writes are blocked.' : 'Target hold released.'); } break;
      case 'restore': { const i = sim.incidents.find(x => x.id === d.id); ui.modal = 'restore'; modal('Remove the simulated fault?', 'This represents an external lab operator, not an Argus remediation.', '<div class="note">The lab operator will remove the injected failure in ' + e(i.target) + '. Argus will record fresh recovery evidence and cancel any pending proposal.</div>', btn('Keep fault', 'close-modal', '', 'ghost') + btn('Restore lab workload', 'confirm-restore', 'data-id="' + d.id + '"', 'primary', 'reset')); break; }
      case 'confirm-restore': if (sim.restore(d.id)) { closeModal(); render(); toast('Lab restored. External recovery recorded; pending action cancelled.'); } else toast('The action is already executing. Allow its verification to finish.'); break;
      case 'duplicate': { const i = sim.incidents.find(x => x.id === d.id); sim.inject(i.kind, { host: i.host }); render(); toast('Alert correlated to the existing episode. No duplicate run started.'); break; }
      case 'replace': sim.replaceTarget(d.ref); render(); toast('Simulated container identity replaced. The old proposal cannot authorize it.'); break;
      case 'invalidate': sim.invalidateEvidence(d.id); render(); toast('Material evidence changed. Pending proposal needs fresh review.'); break;
      case 'tab': ui.tab = d.tab; render(); break;
      case 'filter': ui.filter = d.filter; render(); break;
      case 'host-filter': ui.host = d.host; render(); break;
      case 'host-console': ui.consoleHost = d.host; navigate('console'); break;
      case 'inspect-target': inspectModal(d.ref); break;
      case 'inspect-console': ui.consoleHost = d.ref.split('/')[0]; navigate('console'); runCommand('docker inspect ' + d.ref.split(':').at(-1)); break;
      case 'command': runCommand(d.command); break;
      case 'clear-console': ui.consoleLines = []; render(); break;
      case 'health-check': if (canManage()) { sim.log('check.no_incident', null, 'Manual host health check: vm-095 healthy; vm-166 ' + sim.metrics('vm-166').health + '. Existing failures correlated; healthy target requires no model call.'); toast('Health check: vm-095 healthy; vm-166 ' + sim.metrics('vm-166').health + '.'); render(); } break;
      case 'manual': ui.modal = 'manual'; modal('Request a manual investigation', 'A trigger always passes through fresh deterministic detection.', '<label class="field-label" for="manual-target">Target container</label><select class="field" id="manual-target">' + sim.targets.filter(t => sim.principal.scopes.includes(t.host)).map(t => '<option value="' + e(t.ref) + '">' + e(t.host + ' / ' + t.name) + '</option>').join('') + '</select><div class="note mt">Healthy targets produce <code>no_incident</code> without a model call. An existing failure receives a correlated manual occurrence.</div>', btn('Cancel', 'close-modal', '', 'ghost') + btn('Start investigation', 'manual-submit', '', 'primary', 'search')); break;
      case 'manual-submit': { if (!canManage()) break; const ref = document.getElementById('manual-target').value, i = sim.unresolved.find(x => x.target === ref || x.rootTarget === ref); if (i) { sim.inject(i.kind, { host: i.host, trigger: 'Manual request' }); navigate('incidents', i.id); toast('Manual request attached to the existing incident.'); } else { sim.log('check.no_incident', null, ref + ' · fresh detectors healthy · no_incident · zero model calls'); closeModal(); render(); toast('Target is healthy. Recorded no_incident; no model call needed.'); } break; }
      case 'book': bookModal(d.book); break;
      case 'search': searchModal(); break;
      case 'notifications': ui.modal = 'notifications'; modal('Workspace notifications', 'Recorded notifications and audit activity · simulation only.', '<div class="note mb12">' + visiblePending().length + ' pending human decision(s). Notifications are recorded locally; nothing is sent externally.</div>' + feed(sim.audit.slice(-10).reverse()), btn('View approvals', 'navigate', 'data-view="approvals"', 'primary', 'shield')); break;
      case 'guide': guideModal(); break;
      case 'guided-incident': { const i = sim.incidents.find(x => x.kind === 'cache' && x.faultActive) || sim.incidents[0]; if (i) navigate('incidents', i.id); else { closeModal(); simulateModal(); } break; }
      case 'dismiss-guide': ui.showGuide = false; render(); break;
      case 'pause': ui.paused = !ui.paused; render(); toast(ui.paused ? 'Simulation clock paused.' : 'Simulation clock resumed.'); break;
      case 'speed': ui.speed = ui.speed === 1 ? 2 : ui.speed === 2 ? 4 : 1; render(); break;
      case 'menu': ui.menu = !ui.menu; render(); break;
      case 'close-modal': closeModal(); break;
      case 'reset': ui.modal = 'reset'; modal('Reset the simulated lab?', 'Clear this browser session’s incidents, actions and decisions.', '<div class="note">The two seed history records and the guided cache failure will be restored. Export any incident evidence you want to retain first.</div>', btn('Keep session', 'close-modal', '', 'ghost') + btn('Reset lab', 'confirm-reset', '', 'primary', 'reset')); break;
      case 'confirm-reset': sim = new Simulation(); ui.consoleLines = []; ui.filter = 'all'; ui.paused = false; ui.speed = 1; ui.showGuide = true; navigate('overview'); toast('Lab reset. Guided cache incident is ready.'); break;
      case 'token': ui.modal = 'token'; modal('Create a demo machine token', 'Scoped mock metadata only. No real credential is issued.', '<label class="field-label" for="token-name">Token label</label><input class="field" id="token-name" placeholder="Monitoring integration" maxlength="60"><label class="field-label mt" for="token-kind">Principal type / scope</label><select class="field" id="token-kind"><option value="service">Service · alerts:submit on vm-166</option><option value="agent">Peer agent · investigate:submit, evidence:append</option></select><div class="note amber mt">Machine identities cannot approve an action. Expiry is 24 simulated hours; token values are neither shown nor stored.</div>', btn('Cancel', 'close-modal', '', 'ghost') + btn('Create demo token', 'token-create', '', 'primary', 'key')); break;
      case 'token-create': if (canManage()) { sim.createToken(document.getElementById('token-name').value.trim(), document.getElementById('token-kind').value); closeModal(); render(); toast('Mock token metadata created. No real secret issued.'); } break;
      case 'revoke': if (canManage()) { sim.revokeToken(d.token); render(); toast('Demo credential revoked.'); } break;
      case 'export': { if (!visibleIncidents().some(i => i.id === d.id)) break; const text = sim.exportIncident(d.id), blob = new Blob([text], { type: 'application/json' }), url = URL.createObjectURL(blob), link = document.createElement('a'); link.href = url; link.download = 'argus-' + d.id + '-evidence.json'; link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); toast('Incident, evidence, decisions and action ledger exported.'); break; }
    }
  });
  document.addEventListener('input', event => {
    if (event.target.id === 'infra-search' || event.target.id === 'incident-search') { ui.search = event.target.value; render(); }
    if (event.target.id === 'book-search') { ui.bookSearch = event.target.value; render(); }
    if (event.target.id === 'global-search') updateSearch(event.target.value);
  });
  document.addEventListener('change', event => {
    if (event.target.id === 'console-host') { ui.consoleHost = event.target.value; render(); }
    if (event.target.id === 'scenario-host') ui.scenarioHost = event.target.value;
    if (event.target.id === 'scenario-result') ui.actionResult = event.target.value;
  });
  document.addEventListener('submit', event => { if (event.target.id === 'console-form') { event.preventDefault(); const el = document.getElementById('console-command'); const cmd = el.value.trim(); if (cmd) { el.value = ''; runCommand(cmd); } } });
  document.addEventListener('keydown', event => {
    if ((event.ctrlKey || event.metaKey) && event.key === 'k') { event.preventDefault(); searchModal(); }
    if (event.key === 'Escape') { if (ui.modal) closeModal(); else if (ui.menu) { ui.menu = false; render(); } }
    if (event.key === 'Enter' && event.target.matches('tr[data-action]')) event.target.click();
    if (event.key === 'Enter' && event.target.id === 'login-password') { event.preventDefault(); document.querySelector('[data-action="login"]').click(); }
    if (event.key === 'Tab' && ui.modal) {
      const els = Array.from(document.querySelectorAll('#modal-root button:not(:disabled), #modal-root input, #modal-root select, #modal-root textarea, #modal-root a')).filter(el => el.offsetParent !== null);
      if (!els.length) return;
      if (event.shiftKey && document.activeElement === els[0]) { event.preventDefault(); els.at(-1).focus(); }
      else if (!event.shiftKey && document.activeElement === els.at(-1)) { event.preventDefault(); els[0].focus(); }
    }
  });
  window.addEventListener('hashchange', route);
  shell(); route();
  setInterval(() => {
    if (ui.paused) return;
    sim.tick(ui.speed); updateCountdowns();
    // Do not replace an open decision form or a console where the user is typing.
    if (!ui.modal && !(ui.view === 'console' && document.activeElement?.id === 'console-command')) render();
  }, 1000);
  // Explicit simulation hook for local browser QA; never a production API adapter.
  window.ArgusPrototype = { get simulation() { return sim; }, get ui() { return ui; }, render, navigate };
})();
</script>
