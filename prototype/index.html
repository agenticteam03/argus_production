ation\n\nSave bounded descriptor categories/counts, process start identity, errors and peer/traffic windows before restart. Snapshot alone lacks the missing limits/history, which must be separately attached or marked absent.\n\n## Verification\n\nThree fresh post-action observations, then at least 5 minutes and one pool reuse/timeout cycle under representative demand. Acquisition errors disappear, FD use stays below the calibrated budget (lab recovery starting point 70%), good throughput returns and no rapid regrowth occurs. Missing limits/history prevents a durable-resolution claim. Recurrence/timeout escalates.\n\n## Rollback\n\nRestart cannot restore lost sessions. Owner retains previous limit/pool configuration; lowering limits requires confirming live demand is safe. Each resume/config reversal is separately approved.\n\n## Escalation\n\nApplication owner for leaks/pools, platform/network owner for host handles/ports/backlogs. Attach identity, exact error, scope/limit uncertainty, workload trend and next missing capacity measurement. Stop speculative changes.\n\n## Recording / memory\n\nCommon record plus affected resource boundary, count/limit, process start identity, socket scope and whether leak correction remains outstanding.\n\n## Prevention / follow-up\n\nResource-lifecycle tests, FD/connection budgets, peer timeouts, descriptor/limit telemetry and safe process identity checks.\n\n## Lab validation\n\nDisposable process soft limit 128; fixture opens one harmless descriptor every 100 ms, capped at 140 attempts and 60 seconds. Expect EMFILE/count approach if evidence tools exist; no fabricated FD limit if they do not. Compare a fixture with a stable bounded pool. Require proposed/unsupported RB-012 selection, no global limit change, denied restart \u2192 zero write. Operator closes fixture handles/fixes lifecycle; an independently permitted restart may be tested with new approval. Verify fresh acquisition and stable demand for 5 minutes; replay PID reuse to require refusal. Record every lifecycle stage; not executed.\n\n## References\n\n- [Linux resource limits](https://man7.org/linux/man-pages/man2/getrlimit.2.html), [process descriptors](https://man7.org/linux/man-pages/man5/proc_pid_fd.5.html), [TCP](https://man7.org/linux/man-pages/man7/tcp.7.html).\n- [Argus assessment](../RUNBOOK-ASSESSMENT.md) \u2014 current process/socket tool scope.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nEffective limits, historical/categories of FDs, host handle/port/backlog capacity and process start identity.\n\n### Missing tools\n\n`get_fd_limits`, `get_process_fd_usage`, `get_socket_capacity`.\n\n### Tool improvements\n\nBind PID plus start identity; distinguish process and namespace scope; preserve IPv6/permission failures as unknown.\n\n### Detector improvements\n\nResource-boundary-specific detector with known denominator, duration, identity and fresh error evidence.\n", "file": "RB-012-file-descriptor-socket-exhaustion.md"}, {"id": "RB-013", "title": "PostgreSQL locks / blocked or long-running queries", "status": "draft", "version": "1.0.1", "detector": "postgresql_blocking", "body": "# RB-013 \u2014 PostgreSQL locks / blocked or long-running queries\n\n## Metadata\n\n```yaml\nid: RB-013\ntitle: PostgreSQL locks / blocked or long-running queries\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: postgresql_blocking\n```\n\n## Scope\n\nDeclared PostgreSQL 16 instance and owned clients; verify major/role permissions before using another version. Include lock waits, long transactions and slow queries; distinguish expected maintenance and approved migrations. [Shared contracts](../RUNBOOK-CONVENTIONS.md) apply. A dedicated detector is missing.\n\n## Incident definition\n\nQueries/transactions exceed their service budget due to blocking or expensive execution. Long duration alone does not establish lock contention; inspect `state`, wait type/event and separate transaction/query/state-change timestamps. [PostgreSQL activity](https://www.postgresql.org/docs/16/monitoring-stats.html#MONITORING-PG-STAT-ACTIVITY-VIEW)\n\n## User / service impact\n\nObserve latency, blocked requests and connection retention. A long-running report may be expected; one idle transaction can harm unrelated writers. Identify blocked victims and actual blocking owner separately.\n\n## Trigger / detection conditions\n\nProposed candidate: lock wait above a route-specific budget (lab starting point 30 seconds) or transaction/query duration above its owned workload budget, sustained over two fresh observations with impact. A generic global \u201clong query\u201d threshold is insufficient. Missing activity privilege or stale cache is unknown, not no blockers.\n\n## Symptoms\n\nGrowing lock waits, blocked transactions, slow completion, timeout/deadlock errors, retained slots and idle transactions.\n\n## Plausible causes / hypotheses\n\nH1 abandoned idle transaction holds locks; H2 long active transaction; H3 migration/DDL locks; H4 incompatible access order/deadlock; H5 expensive unblocked query; H6 I/O/CPU bottleneck; H7 normal long job or misleading telemetry.\n\n## Required evidence\n\nDB identity, session PID/backend start, role/application/address, transaction/query/state ages, sanitized query fingerprint, wait type/event, blocker graph with protected owners, relation category, workload budget and CPU/I/O timeline. Do not infer blocker identity from a total wait count.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `inspect_database_health(container)` | Summary wait count and long transactions; incomplete graph | `READ_ONLY_SENSITIVE` |\n| `get_db_connection_history(database, minutes=30)` | Slots retained during blocking | `READ_ONLY_SENSITIVE` |\n| `get_cpu_history(container, minutes=30)` / `get_io_metrics()` | CPU/I/O alternative | `READ_ONLY_SAFE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Redacted timeout/deadlock context | `READ_ONLY_SENSITIVE` |\n| `correlate_incident_timeline(container, minutes=30)` | Timing relative to other failures | `READ_ONLY_SENSITIVE` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_db_activity(database_id, limit)` with session/start identity and redacted fingerprint; `get_db_lock_graph(database_id, limit)` using bounded `pg_blocking_pids`/lock metadata and explicit truncation; `get_db_long_transactions(database_id, min_age, limit)` with state/transaction ages. All `READ_ONLY_SENSITIVE`, fixed SQL templates through a monitor role, no arbitrary SQL. PostgreSQL's blocking function is preferable to guessed self-joins over lock modes. [System information functions](https://www.postgresql.org/docs/16/functions-info.html), [pg_locks](https://www.postgresql.org/docs/16/view-pg-locks.html)\n\n## Diagnostic workflow\n\n| Step | Action / why | Interpretation / next step |\n|---|---|---|\n| 1 | Activity and workload budget | Expected authorized long job without impact \u2192 observe. Real breach \u2192 2; missing detailed view \u2192 record gap. |\n| 2 | Wait type/event and CPU/I/O evidence | Lock wait \u2192 3. Running computation/storage wait \u2192 H5/H6, RB-006/010. No wait data \u2192 multiple hypotheses. |\n| 3 | Bounded blocker graph and session identity | Follow blocked\u2192blocking edges to an attributable owner; protect migrations/critical/system work. Truncated graph cannot establish root blocker. |\n| 4 | Compare transaction state and owner intent | Old idle transaction supports H1, active long work H2, declared migration H3. Deadlock requires matching DB evidence, not a guessed cycle from stale snapshots. |\n| 5 | Correlate victim/slot pressure and preserve graph | Exhaustion secondary to blocking \u2192 RB-004 linked incident; do not stop arbitrary victims. |\n| 6 | DBA reviews exact corrective action, then fresh graph/request checks | No bounded cancellation/termination authority \u2192 escalate; no generic SQL fallback. |\n\n## Decision tree\n\n```text\nbudget exceeded with impact?\n  no -> expected workload / wrong runbook\n  yes -> lock wait? no -> compute/I/O/query diagnosis\n           yes -> blocker identified and owned?\n                    no -> insufficient_evidence; obtain graph\n                    yes -> idle / active / migration / protected transaction\n                           -> owner completion/cancel plan; verify victims\n```\n\n## Evidence interpretation\n\nLocks normally persist until transaction end; canceling one statement is not equivalent to ending the session/transaction or necessarily releasing all locks. Cancellation and termination have different effects and privileges. [PostgreSQL locking](https://www.postgresql.org/docs/16/explicit-locking.html), [server signaling](https://www.postgresql.org/docs/16/functions-admin.html#FUNCTIONS-ADMIN-SIGNAL)\n\n## False positives and edge cases\n\nPrepared transactions, parallel workers, PID reuse, stale graph, query already completed, canceled statement with transaction still open, low monitor visibility, maintenance/replication roles and query text containing customer data.\n\n## Diagnosis outcome\n\nAll common outcomes allowed. Probable blocking cause needs graph identity, ownership/state and victim linkage; long duration alone is insufficient. Record unresolved expensive-query versus storage hypotheses separately.\n\n## Mitigation\n\nDBA/application owner may complete/rollback an owned transaction or cancel a reviewed query. Generic session termination is not available. Existing `db.terminate_idle_in_transaction` is restricted to its RB-004 client case and is not an arbitrary blocker-removal API.\n\n## Recovery\n\nIntended blocked work resumes, queue/lock waits subside, ordinary clients succeed and retry traffic stays bounded. Killing a victim without removing the blocker is not recovery.\n\n## Root-cause correction\n\nFix transaction lifecycle/order, reduce transaction scope, schedule safe migrations, tune proven expensive queries/indexes and apply role-specific timeouts with workload testing.\n\n## Action safety\n\nCancel/terminate/transaction rollback/config changes are `MUTATING_HIGH_RISK`. Require exact DB, PID/backend start, role/address, query/transaction identity, lock graph, business-owner approval, protected migration/system/critical roles and immediate state recheck. Cap candidates and one action. Block reused/disappeared identity, unknown side effects, incomplete graph, protected owner or missing deterministic guards. Query cancellation/termination contracts are missing; current default is owner escalation.\n\n## Human-in-the-Loop\n\nShow the exact blocker and affected victims, rollback/data-loss/retry implications, why waiting is unacceptable and how lock release will be verified. No approval for \u201ckill long queries\u201d or a reusable PID-only action.\n\n## Forbidden actions\n\n`FORBIDDEN`: arbitrary SQL/session kills, database restart to clear locks, blanket timeout changes, kill all old sessions, terminate migrations/replication or expose raw query literals.\n\n## Evidence preservation\n\nSave bounded graph/activity fingerprints, timestamps and owner classification before intervention. Redact query text before model/storage; retain privilege/truncation gaps.\n\n## Verification\n\nThree source-fresh graph/activity and service observations after action, then 5 minutes: targeted blocking edge gone, intended workload completes, no equivalent replacement blocker, ordinary admission healthy and retries/errors near baseline. Successful signal delivery alone fails recovery criteria. Changed blocker identity, stale graph or recurrence escalates.\n\n## Rollback\n\nCanceled/terminated work cannot be reconstructed automatically. Application owner retries only idempotent/compensated work; no blind transaction replay. Restore timeout/config only through a reviewed change that does not reintroduce contention.\n\n## Escalation\n\nDBA plus transaction/migration owner. Stop when blocker ownership is unknown, graph truncated, action result ambiguous or wait returns. Attach redacted graph, identities/ages, victim impact and requested owner decision.\n\n## Recording / memory\n\nCommon record plus blocked/blocker identities, wait semantics, protected candidates, intervention effects and unresolved transaction/query defect.\n\n## Prevention / follow-up\n\nShort bounded transactions, consistent lock order, migration budgets, application timeout discipline and monitor-role graph visibility.\n\n## Lab validation\n\nDisposable database/table: session A begins a transaction and updates one synthetic row without ending it; session B updates the same row with a fixed 60-second statement timeout. Record timestamps and ground truth; watchdog rolls back A after 90 seconds. Expect lock-wait candidate, RB-013 and A as blocker only if graph tool exists; summary-only evidence must not invent A. Mark A protected in a second case to require refusal. DBA-approved fixture rollback releases B or allows a safe test retry; denied approval causes no Argus write. Verify fresh graph and service success for 5 minutes and record all stages. Repeat an unblocked slow query to avoid automatic lock diagnosis. Not executed.\n\n## References\n\n- [PostgreSQL explicit locking](https://www.postgresql.org/docs/16/explicit-locking.html), [pg_locks](https://www.postgresql.org/docs/16/view-pg-locks.html), [blocking functions](https://www.postgresql.org/docs/16/functions-info.html).\n- [Activity](https://www.postgresql.org/docs/16/monitoring-stats.html), [server signaling](https://www.postgresql.org/docs/16/functions-admin.html#FUNCTIONS-ADMIN-SIGNAL).\n\n## Argus capability gaps\n\n### Missing telemetry\n\nBounded blocker graph, immutable session identity, precise wait/age semantics and protected owners.\n\n### Missing tools\n\n`get_db_activity`, `get_db_lock_graph`, `get_db_long_transactions`; separately designed cancellation capability if approved later.\n\n### Tool improvements\n\nSanitized query fingerprints, source freshness/privilege coverage and deterministic candidate revalidation.\n\n### Detector improvements\n\nImpact/budget-aware wait detector; distinguish lock, computation, I/O and legitimate maintenance.\n", "file": "RB-013-postgresql-locks-long-running-queries.md"}, {"id": "RB-014", "title": "Monitoring blind spot / exporter unavailable", "status": "draft", "version": "1.0.1", "detector": "monitoring_blind_spot", "body": "# RB-014 \u2014 Monitoring blind spot / exporter unavailable\n\n## Metadata\n\n```yaml\nid: RB-014\ntitle: Monitoring blind spot / exporter unavailable\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: monitoring_blind_spot\n```\n\n## Scope\n\nPrometheus, Alertmanager, Argus/Node/cAdvisor/database exporters and registered probes for Host T. Record versions, scrape/rule intervals, discovery labels and source clock assumptions. Apply [shared contracts](../RUNBOOK-CONVENTIONS.md). Existing architecture stops at `undiagnosable` before the LLM when required detector metrics are stale/unavailable. This runbook describes operator diagnosis and a future dedicated observation path, not permission to bypass that rule.\n\n## Incident definition\n\nRequired telemetry cannot establish the current state of a monitored service. Monitoring failure and monitored-service failure may coexist. Missing series are not zero values; query evaluation can select older samples within lookback. [Prometheus staleness](https://prometheus.io/docs/prometheus/latest/querying/basics/#staleness)\n\n## User / service impact\n\nDiagnostic confidence and detection coverage are reduced. Actual user impact remains unknown until independent service evidence is available; a telemetry outage does not prove the application is down or healthy.\n\n## Trigger / detection conditions\n\nExisting path: required metrics older than `METRICS_MAX_STALENESS` or adapter unavailable \u2192 `undiagnosable`, no model call, escalate. Proposed observability alert: target `up=0` for two scrape intervals; expected target/required-series absence for two intervals; stale source timestamp despite scrape success; rule/API failure. Pin expected inventory so an intentionally removed target is not blindly declared down. No dedicated RB-014 detector exists yet.\n\n## Symptoms\n\nGaps, stale constant data, failed scrape, exporter endpoint error, absent target, Prometheus query errors, failed rules or missing notifications.\n\n## Plausible causes / hypotheses\n\nH1 monitored service failed; H2 exporter failed; H3 discovery/scrape config lost target; H4 network/DNS/auth/TLS fault; H5 Prometheus/rule failure; H6 stale cached/partial metric production; H7 Alertmanager routing/silence/inhibition; H8 intentional decommission/label change.\n\n## Required evidence\n\nExpected target/metric inventory, target health/last scrape/error, per-series source age and coverage, exporter process/HTTP state, independent service probe, rule/API state and relevant config/change metadata. Capture both scrape success and collector completeness.\n\n## Required Argus tools\n\nExisting reads may support an independently authorized operator investigation only when their execution prerequisites are met:\n\n| Tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `get_container_status(container)` | Exporter/runtime state if separately allowlisted | `READ_ONLY_SENSITIVE` |\n| `check_http_endpoint(url, timeout_s=3)` | Exact approved exporter/service probe | `READ_ONLY_SENSITIVE` |\n| `check_dns(name)` / `check_tcp_connection(host, port, attempts=2)` | Target-side reachability | `READ_ONLY_SENSITIVE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Bounded exporter error context | `READ_ONLY_SENSITIVE` |\n\nCurrent lab target scope does not automatically include the entire monitoring plane. Missing scope is a permission gap, not a reason to widen targets during an incident. `MetricsPort.snapshot` is deterministic application infrastructure, not an invented model tool.\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_prometheus_target_status(target_id)` uses fixed HTTP API operations to expose discovery/scrape error/time; `get_metric_freshness(target_id, metric_profile)` returns expected-versus-present series and true source times; `get_monitoring_rule_status(rule_group_id)` returns evaluation error/time; `get_alert_delivery_status(alert_id)` returns authorized routing/inhibition/silence state. All `READ_ONLY_SENSITIVE` with bounded registered IDs, not arbitrary queries or config exports. The Prometheus API supplies target/rule/query status but needs a scoped Argus adapter. [Prometheus HTTP API](https://prometheus.io/docs/prometheus/latest/querying/api/)\n\n## Diagnostic workflow\n\n| Step | Action / reason | Interpretation / next step |\n|---|---|---|\n| 1 | Existing detect path checks required freshness | Stale/unavailable \u2192 undiagnosable, stop model investigation and escalate with last known times. Steps below are operator/future-path work. |\n| 2 | Compare independent service probe to exporter/target status | Service healthy/exporter bad \u2192 H2\u2013H6. Both bad \u2192 H1 plus visibility loss; do not choose one prematurely. |\n| 3 | Expected inventory versus discovered targets | Missing target/labels \u2192 H3/H8. Present target scrape failing \u2192 4. |\n| 4 | DNS/TCP/TLS/auth and bounded exporter errors | Identify transport/auth/collector failure; credentials remain in adapters. Successful exporter HTTP is not proof required collectors work. |\n| 5 | Prometheus API/rule status and per-series timestamps | Successful scrape but absent/stale required metric \u2192 H6/label change; API/rule error \u2192 H5. |\n| 6 | If metrics/rules are healthy, inspect alert delivery state | H7 may explain missing notification but not missing samples. Keep paths distinct. |\n| 7 | Owner repairs exact component; verify coverage then re-run normal detection | New valid evidence may reveal a real service incident previously hidden. |\n\n## Decision tree\n\n```text\nrequired source samples fresh and complete? no -> undiagnosable; no model action\n  operator -> expected target present? no -> inventory/discovery/config\n              scrape fails? -> exporter/network/auth/TLS\n              scrape succeeds but series stale/missing? -> collector/labels/cache\n              series valid but alert absent? -> rule/routing/silence investigation\nrestore coverage -> fresh normal detection -> healthy or actual service incident\n```\n\n## Evidence interpretation\n\nPrometheus alert rules have their own evaluation/pending semantics; Alertmanager groups/routes and may silence/inhibit notifications. Notification absence is not health evidence. [Alerting rules](https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/), [Alertmanager](https://prometheus.io/docs/alerting/latest/alertmanager/)\n\n## False positives and edge cases\n\nIntended decommission, renamed labels, stale recording rules, scrape success with failed internal collector, cached DB readings, clock skew, partial target failure, monitor credentials succeeding where ordinary clients fail, and self-monitoring failure.\n\n## Diagnosis outcome\n\nAllow all common diagnostic labels in the operator record; current runtime outcome remains `undiagnosable` when mandatory telemetry is missing. Probable monitoring cause requires component evidence and independent service status; never claim healthy from empty results.\n\n## Mitigation\n\nUse an approved independent observer and escalate uncertainty. Monitoring owner repairs exporter/config/credentials or restores telemetry capacity through its change procedure. No automated restart of application victims.\n\n## Recovery\n\nRequired targets/series and rules return with correct labels and fresh source times; normal detection resumes. If a real incident remains, investigate it instead of closing everything as recovered.\n\n## Root-cause correction\n\nFix collection/config/permissions, inventory checks, capacity or alert routing; remove stale-data fallback behavior and establish independent monitoring of the monitoring path.\n\n## Action safety\n\nExporter/Prometheus restart, credential/config and routing changes are `MUTATING_HIGH_RISK`. Require exact component/identity and config revision, preserved evidence, protected control-plane availability and reviewed rollback. Block missing monitoring scope, closed write gate, blind application restart or changing freshness rules to hide data loss. These are operator procedures, not supported default remediation.\n\n## Human-in-the-Loop\n\nShow visibility lost, actual application state if known, exact monitoring change, expected observation gap and rollback. Never treat elapsed time or regained notification delivery as approval to restart services.\n\n## Forbidden actions\n\n`FORBIDDEN`: substitute zero/healthy for missing data, bypass stale-detection guard, disable auth/TLS, dump scrape secrets, widen arbitrary queries/targets or silence the alert as recovery.\n\n## Evidence preservation\n\nRetain last-good source times, target inventory, sanitized scrape/rule errors and redacted config fingerprints in a healthy durable sink. Do not rely solely on the broken monitoring system to store its own evidence.\n\n## Verification\n\nAfter repair, three distinct complete source-fresh scrape observations and at least two successful rule evaluations, then 5 minutes without gaps. Check independent service health and re-run normal detectors. A healthy `/metrics` response or one `up=1` is insufficient. Missing labels, cached source values, rule errors or renewed gaps keep the incident open/escalated.\n\n## Rollback\n\nMonitoring owner retains last-good config/credential reference and restores it if the change reduces coverage; never restore an expired/revoked secret merely to remove errors. No automatic monitoring rollback exists.\n\n## Escalation\n\nObservability/platform owner immediately on loss of mandatory evidence, incident commander if service impact is unknown and critical. Attach last-good times, expected/actual series, component errors, independent probes and next required scoped check.\n\n## Recording / memory\n\nCommon record plus coverage loss, confidence reduction, freshness provenance, no-model/no-write enforcement, owner repair and any newly uncovered incident.\n\n## Prevention / follow-up\n\nInventory-aware absence alerts, collector health, source-age checks, independent observers and controlled rule/config tests. Keep unsupported incident classes visibly unsupported.\n\n## Lab validation\n\nWith a healthy disposable API, operator stops only its exporter for 90 seconds at a 15-second scrape interval. Expect stale/unavailable detection \u2192 undiagnosable, zero model calls and zero application writes; independently verify API remains healthy. Restore exporter and separately replay cached old source values despite successful scrapes: no false recovery. An unauthorized monitoring target and denied restart must be refused. After owner repair require full fresh coverage/rules and normal detection for 5 minutes; record all stages including deliberately skipped model/action stages. No test has been run.\n\n## References\n\n- [Prometheus query staleness](https://prometheus.io/docs/prometheus/latest/querying/basics/#staleness), [HTTP API](https://prometheus.io/docs/prometheus/latest/querying/api/).\n- [Alert rules](https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/), [recording rules](https://prometheus.io/docs/prometheus/latest/configuration/recording_rules/), [Alertmanager](https://prometheus.io/docs/alerting/latest/alertmanager/).\n- [Argus assessment](../RUNBOOK-ASSESSMENT.md) \u2014 fail-closed detector architecture.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nExpected-series inventory, true source-age/collector completeness, target/rule/delivery state and independent observer.\n\n### Missing tools\n\n`get_prometheus_target_status`, `get_metric_freshness`, `get_monitoring_rule_status`, `get_alert_delivery_status`.\n\n### Tool improvements\n\nPer-child timestamps/errors; no absent-as-zero; differentiate source collection from response time; monitoring target permission profile.\n\n### Detector improvements\n\nDedicated monitoring diagnosis path designed without bypassing stale-workload guards; inventory-aware absence and cached-data checks.\n", "file": "RB-014-monitoring-blind-spot.md"}, {"id": "RB-015", "title": "NGINX/reverse-proxy upstream failure", "status": "draft", "version": "1.0.1", "detector": "nginx_upstream_failure", "body": "# RB-015 \u2014 NGINX/reverse-proxy upstream failure\n\n## Metadata\n\n```yaml\nid: RB-015\ntitle: NGINX/reverse-proxy upstream failure\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: nginx_upstream_failure\n```\n\n## Scope\n\nDeclared NGINX HTTP proxy routes and backend services. Record NGINX version/build/modules, route/upstream config fingerprint and Docker network. Features vary across versions and editions; no commercial health API is assumed. [Shared contracts](../RUNBOOK-CONVENTIONS.md) apply; use RB-002/003 as supported parent context, not an invented detector.\n\n## Incident definition\n\nRequests through the proxy fail or time out on the upstream path. A 502/503/504 alone does not identify whether NGINX generated it, an upstream returned it, or a different edge layer did; correlate upstream status, selected peer and error context. [NGINX upstream variables](https://nginx.org/en/docs/http/ngx_http_upstream_module.html#variables)\n\n## User / service impact\n\nIdentify affected virtual host/route and successful versus failed requests. A direct backend success may bypass headers, TLS, authentication or path rewriting used by the failing route.\n\n## Trigger / detection conditions\n\nProposed rule: route's upstream error/timeout rate exceeds its accepted budget for 5 minutes with sufficient traffic; immediate investigation for confirmed broad outage. Binary failure can surface through RB-002. Unknown denominators and missing proxy logs do not establish error-free service.\n\n## Symptoms\n\n502/503/504, upstream connect/read timeout, no available peer, connection refused, header/protocol errors or one virtual host failing after a configuration change.\n\n## Plausible causes / hypotheses\n\nH1 backend down; H2 DNS/wrong address/port/network; H3 backend saturation/slow dependency; H4 TLS/SNI mismatch; H5 route/header/rewrite/config regression; H6 proxy capacity/resource failure; H7 upstream deliberately returns error; H8 stale cache masks partial failure.\n\n## Required evidence\n\nPaired edge/backend results for the same safe route contract, bounded proxy error/access metadata, selected peer/status/connect/response time, config fingerprint, backend state/dependencies/resources and change time. No request bodies or authentication headers.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `check_http_endpoint(url, timeout_s=3)` | Approved proxy/backend probe, subject to equivalent-route limits | `READ_ONLY_SENSITIVE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=150)` | Proxy and backend sanitized failures | `READ_ONLY_SENSITIVE` |\n| `inspect_service_config(container, config='main')` | Only configured allowlisted proxy config | `READ_ONLY_SENSITIVE` |\n| `check_dns(name)` / `check_tcp_connection(host, port, attempts=2)` | Backend name/transport | `READ_ONLY_SENSITIVE` |\n| `get_container_status(container)` / `get_container_network(container)` | Backend/proxy identity and attachment | `READ_ONLY_SENSITIVE` |\n| `trace_request_path(container)` | Declared dependencies to discriminate victims | `READ_ONLY_SENSITIVE` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_proxy_upstream_history(service_id, route_id, minutes)` returns redacted peer/status/timing/counts, `READ_ONLY_SENSITIVE`; `validate_proxy_config(service_id, config_digest)` performs fixed syntax validation without exposing secrets, `READ_ONLY_SENSITIVE`; shared `check_tls_endpoint` and deployment history. A generic service reload is not currently available; validation does not itself authorize reload.\n\n## Diagnostic workflow\n\n| Step | Action / why | Interpret / next step |\n|---|---|---|\n| 1 | Fresh route probe and proxy error window | Bind actual source of error; wrong route/vantage \u2192 correct evidence before action. |\n| 2 | Inspect selected upstream and declared config | Wrong peer/port/rewrite supports H2/H5; redact header/credential values. |\n| 3 | Backend DNS/TCP/TLS and state | Failure routes to RB-009/016/008; proxy may be a victim. |\n| 4 | Equivalent direct backend and dependency checks | Backend slow/error \u2192 RB-003/011; direct success weakens backend-wide outage but not route/header-specific faults. |\n| 5 | Proxy resources/config change and upstream timing | Proxy saturation \u2192 RB-006/012; changed config \u2192 validate and owner review. No guessed timeout increase. |\n| 6 | Preserve evidence, owner repair exact layer and verify end-to-end | Missing route equivalence/timing \u2192 multiple hypotheses, no speculative restart. |\n\n## Decision tree\n\n```text\nproxy request fails -> error source/selected peer known?\n  no -> collect bounded proxy metadata\n  yes -> backend DNS/TCP/TLS fails? -> network/TLS/backend owner\n         backend protocol slow/fails? -> dependency/performance owner\n         equivalent backend succeeds? -> proxy config/capacity investigation\n         missing equivalent probe? -> insufficient_evidence\n```\n\n## Evidence interpretation\n\n`proxy_read_timeout` is a timeout between successive reads, not a universal total-response deadline. Retrying upstreams can also change behavior and risk duplicate work; inspect configured retry conditions. [NGINX proxy module](https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_read_timeout) Diagnose the relevant phase before recommending a setting change.\n\n## False positives and edge cases\n\nCached responses, retries across peers, wrong Host header, path rewriting, different backend credentials, stream/WebSocket timing, deployment drain, stale DNS resolution and truncated logs lacking the first error.\n\n## Diagnosis outcome\n\nAll common outcomes allowed. Probable cause names peer/phase/config and evidence against backend-wide failure; generic 5xx alone remains insufficient attribution.\n\n## Mitigation\n\nOwner restores a tested config/peer or reduces harmful load. Restarting NGINX does not fix a failed backend. A controlled config reload is an operator action, not a model shell command.\n\n## Recovery\n\nAffected external routes meet status/latency expectations through NGINX and intended upstreams; backend capacity and proxy resources remain healthy.\n\n## Root-cause correction\n\nRepair peer/discovery/TLS/rewrite configuration, backend cause or capacity. Review retry/timeout budgets against application semantics rather than merely hiding errors.\n\n## Action safety\n\nReload/rollback/restart/routing changes are `MUTATING_HIGH_RISK`. Require exact service/config digest, successful syntax validation, known-good prior version, protected auth/security directives, safe drain and correct backend contract. Block failed validation, unknown upstream, unbounded retries, incompatible config or absent tool/profile. NGINX reload applies configuration through its master process; runtime success still requires verification. [NGINX control](https://nginx.org/en/docs/control.html)\n\n## Human-in-the-Loop\n\nShow route/peer and exact configuration diff, affected clients, retry/connection risk, validation and rollback. One approval does not cover editing more routes or changing security behavior.\n\n## Forbidden actions\n\n`FORBIDDEN`: disable backend TLS checks, expose keys/config secrets, blanket debug logging, unlimited retries/timeouts, restart victims or arbitrary `nginx` shell invocation from the model.\n\n## Evidence preservation\n\nSave redacted peer/timing/error excerpts, config digest and paired probe observations before change; no full access-log dump or authorization headers.\n\n## Verification\n\nThree fresh post-change route/backend observations, then two 5-minute windows with meaningful traffic: configured error/latency objective, intended peers, no new upstream errors and stable backend resources. A direct backend-only success or config validation return is insufficient. Missing external vantage/traffic \u2192 provisional state and escalation.\n\n## Rollback\n\nOwner restores previous approved config digest and performs a validated reload; check it still references viable peers and compatible certificates. No automatic reload/rollback tool exists in current Argus.\n\n## Escalation\n\nProxy/platform owner for route/config issues, backend owner for dependency failure, PKI for TLS. Attach peer/phase evidence, comparison limits and precise proposed correction. Stop after failed change or ambiguous action.\n\n## Recording / memory\n\nCommon record plus virtual host/route, peer, proxy-versus-upstream status origin, timing phase and config digests.\n\n## Prevention / follow-up\n\nPredeploy route/syntax tests, structured upstream timing, bounded retry policy and monitored certificate/backend health.\n\n## Lab validation\n\nDisposable NGINX/backend: operator changes one upstream port to a closed test port for 90 seconds, then separately restores it and injects a backend delay exceeding the fixture read timeout. Expect RB-002/003 parent and RB-015 distinction between connection and read phases; zero automatic proxy/victim restart. Reject TLS-bypass or unvalidated reload proposal. Owner restores only the saved fixture config, verifies route and backend for two windows, and records all stages including approval/no-action. A direct-backend-success/incorrect-Host case must preserve uncertainty. Not executed.\n\n## References\n\n- [NGINX upstream module](https://nginx.org/en/docs/http/ngx_http_upstream_module.html), [proxy module](https://nginx.org/en/docs/http/ngx_http_proxy_module.html), [control](https://nginx.org/en/docs/control.html).\n\n## Argus capability gaps\n\n### Missing telemetry\n\nPeer/route timing history, equivalent probe contract and config validation evidence.\n\n### Missing tools\n\n`get_proxy_upstream_history`, `validate_proxy_config`, TLS/deployment-history contracts.\n\n### Tool improvements\n\nSafe structured config fields, exact Host/SNI probe profiles and redacted upstream attribution.\n\n### Detector improvements\n\nRoute-aware upstream error/timeout detector and policy-reviewed reload capability if added later.\n", "file": "RB-015-nginx-upstream-failure.md"}, {"id": "RB-016", "title": "TLS certificate / handshake failure", "status": "draft", "version": "1.0.1", "detector": "tls_failure", "body": "# RB-016 \u2014 TLS certificate / handshake failure\n\n## Metadata\n\n```yaml\nid: RB-016\ntitle: TLS certificate / handshake failure\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: tls_failure\n```\n\n## Scope\n\nRegistered HTTPS/TLS endpoint profiles, including NGINX edge and backend TLS. Record client/server versions, SNI/hostname, trust-profile identifier, mTLS requirement and source clock. OpenSSL 3.0 documentation is a reference, not an assumption about every deployed TLS stack. [Common contracts](../RUNBOOK-CONVENTIONS.md) apply; dedicated TLS detection is absent.\n\n## Incident definition\n\nA configured client cannot establish its required authenticated TLS session. Certificate validity, hostname identity, trust path and negotiation are separate checks. A completed handshake without verification is not proof of authenticated connectivity. [OpenSSL verification](https://docs.openssl.org/3.0/man1/openssl-verification-options/)\n\n## User / service impact\n\nMeasure affected hostnames/client cohorts and route failures. Different clients may use different trust stores or cached/resumed sessions; one successful client does not establish universal recovery.\n\n## Trigger / detection conditions\n\nProposed incident trigger: repeated strict TLS failure from an approved client profile over `max(60 seconds, 2*S)`, correlated with user/service failure. Expiry warning at a configurable renewal lead time (lab 14 days) is preventive, not proof of current outage. Unknown certificate time or local clock invalidity requires uncertainty, not renewal as an automatic conclusion.\n\n## Symptoms\n\nExpired/not-yet-valid certificate error, hostname mismatch, unknown issuer/incomplete chain, unsupported negotiation, mTLS rejection or proxy upstream handshake failure.\n\n## Plausible causes / hypotheses\n\nH1 expired certificate; H2 wrong hostname/SNI or certificate binding; H3 chain/trust-store mismatch; H4 protocol/cipher policy mismatch; H5 missing/invalid client authentication; H6 backend TLS misconfiguration; H7 source/server clock error; H8 wrong destination/DNS or transport failure.\n\n## Required evidence\n\nExact sanitized verification/handshake error, endpoint/IP/port and expected hostname, configured SNI/trust/client profile, public certificate fingerprint/SAN/validity/issuer metadata, chain verification result, clock quality, deployment/renewal time and transport success. Never collect private keys, full credential config or client certificate secrets.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `check_dns(name)` / `check_tcp_connection(host, port, attempts=2)` | Establish destination and transport layer | `READ_ONLY_SENSITIVE` |\n| `check_http_endpoint(url, timeout_s=3)` | Approved HTTPS request; inspect whether its configured verification matches client contract | `READ_ONLY_SENSITIVE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Redacted handshake phase/errors | `READ_ONLY_SENSITIVE` |\n| `inspect_service_config(container, config='main')` | Only allowlisted non-secret TLS directive metadata | `READ_ONLY_SENSITIVE` |\n\nHTTP tool success is insufficient when trust/SNI/verification policy is not exposed. Current tools do not supply a complete certificate-validation report.\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `check_tls_endpoint(endpoint_id)` uses a fixed registered hostname/SNI/trust/optional mTLS profile, returns strict verification, negotiated protocol, public fingerprint/SAN/validity and bounded errors; `get_certificate_deployment(service_id)` exposes fingerprint and renewal/reload history only. Both `READ_ONLY_SENSITIVE`. Shared `get_time_sync_status(host_id)` supplies source clock quality. No tool accepts key paths, arbitrary CA imports or a `verify=false` argument.\n\n## Diagnostic workflow\n\n| Step | Action / why | Interpretation / next step |\n|---|---|---|\n| 1 | Verify exact destination and DNS/TCP | Transport failure \u2192 RB-009. Correct listener \u2192 2. |\n| 2 | Strict TLS check with actual client profile | Record failed phase; missing tool/profile \u2192 insufficient_evidence, not insecure fallback. |\n| 3 | Compare hostname/SNI and served certificate metadata | Wrong binding/SAN \u2192 H2/H8; correct identity \u2192 4. |\n| 4 | Compare validity and trustworthy current time | Expired under good clock \u2192 H1; inconsistent clocks \u2192 RB-020/H7. |\n| 5 | Inspect chain/trust and negotiation/mTLS results | H3/H4/H5; client secrets stay in probe. Distinguish edge and upstream TLS legs. |\n| 6 | Compare certificate deployment/reload fingerprints | New file but old served certificate \u2192 owner deployment investigation; do not assume reload occurred. |\n| 7 | Preserve public metadata, owner correction, strict fresh verification | No diagnosis based only on generic \u201cSSL error.\u201d |\n\n## Decision tree\n\n```text\ntransport works? no -> RB-009\n  yes -> strict TLS profile fails where?\n           name/SNI -> binding/destination\n           time -> validity + clock verification\n           chain/trust -> issuer/client trust profile\n           negotiation/mTLS -> version/policy/client-auth owner\n           upstream only -> NGINX backend TLS branch\n```\n\n## Evidence interpretation\n\nSNI selects the intended server identity; hostname validation and certificate-chain verification must still be performed. Diagnostic clients can continue despite verification errors unless configured to fail appropriately; a tool must return the strict verdict, not merely socket completion. [OpenSSL client diagnostics](https://docs.openssl.org/3.0/man1/openssl-s_client/)\n\n## False positives and edge cases\n\nWrong client clock, missing SNI, IP probe of a DNS certificate, stale load-balanced peer, resumed session, old client trust store, mixed certificate rollout and distinct proxy/client trust policies.\n\n## Diagnosis outcome\n\nAll common outcomes allowed. Probable cause identifies failing TLS leg/profile and exact verification evidence; unknown clock or trust policy keeps alternatives open. Approaching expiry alone is follow-up, not current handshake diagnosis.\n\n## Mitigation\n\nPKI/service owner deploys a valid existing certificate/chain or corrects binding through the approved certificate pipeline. An alternate endpoint must preserve the required authenticated identity. No security downgrade is a mitigation.\n\n## Recovery\n\nFresh strict handshakes and application requests succeed for affected profiles and peers; intended public fingerprint is served and renewal margin satisfies policy.\n\n## Root-cause correction\n\nRepair renewal/distribution/reload automation, hostname inventory, trust lifecycle or mTLS ownership; correct clock fault separately. NGINX TLS configuration must match its installed build and served identity. [NGINX SSL module](https://nginx.org/en/docs/http/ngx_http_ssl_module.html)\n\n## Action safety\n\nCertificate deploy/reload, trust/policy or time changes are `MUTATING_HIGH_RISK`. Require exact endpoint/fingerprint/profile and compatible key reference managed outside model context, owner approval, validated config and previous still-valid rollback artifact. Block untrusted issuer addition, expired/revoked rollback, mismatched identity, absent tool or unknown client blast radius. Current Argus has no certificate mutation capability.\n\n## Human-in-the-Loop\n\nShow public metadata and validation failures, exact deployment/config revision, affected clients and rollback limits. Approval never permits exposing key material or turning verification off.\n\n## Forbidden actions\n\n`FORBIDDEN`: `verify=false`/insecure TLS bypass, retrieve keys/PEM secrets, import arbitrary CAs, downgrade protocol policy, reuse expired/revoked certificates or alter clocks to make an expired certificate appear valid.\n\n## Evidence preservation\n\nSave bounded public certificate metadata/fingerprint, verification reason, time-quality evidence and endpoint profile version. No private-key paths/content, session secrets or TLS key logs.\n\n## Verification\n\nThree new strict connections after deployment completion across the affected approved peers/profiles, then 5 minutes of successful real-route probes. Confirm correct fingerprint/name/chain/time and acceptable expiry margin. Resumed sessions or a single peer cannot verify all replaced certificates. Missing profiles, recurring errors or unknown source time prevents closure.\n\n## Rollback\n\nOwner may restore only an approved still-valid, unrevoked and identity-correct previous certificate/config. Otherwise forward repair is required. Every reload/rollback is separately reviewed; no automatic TLS rollback tool exists.\n\n## Escalation\n\nPKI/security owner plus service/proxy owner; platform for clock faults. Attach public metadata, exact profile/leg, verification error and missing evidence. Stop if resolution would require a security downgrade.\n\n## Recording / memory\n\nCommon record plus endpoint profile, public fingerprint, failed validation category, client cohort, time confidence and renewal follow-up; never store keys.\n\n## Prevention / follow-up\n\nRenewal lead-time alerts, strict multi-profile probes, certificate inventory, tested reload and public-fingerprint monitoring.\n\n## Lab validation\n\nPrivate disposable test CA/server with synthetic hostnames: serve (A) expired certificate, (B) wrong SAN, (C) incomplete chain, restoring the fixture between cases. Do not change workstation time or use production keys. Expect proposed/unsupported TLS trigger, distinct errors or insufficient_evidence if strict tool unavailable. Reject verify-off and key-reading proposals. Owner deploys the valid fixture certificate; test denial then approved owner change, fresh strict handshakes and application recovery for 5 minutes, with all lifecycle artifacts. Replay bad client-clock metadata to require RB-020 investigation. Not executed.\n\n## References\n\n- [OpenSSL verification](https://docs.openssl.org/3.0/man1/openssl-verification-options/), [client diagnostics](https://docs.openssl.org/3.0/man1/openssl-s_client/), [NGINX TLS](https://nginx.org/en/docs/http/ngx_http_ssl_module.html).\n\n## Argus capability gaps\n\n### Missing telemetry\n\nStrict TLS profile/result, public certificate deployment history and clock-quality evidence.\n\n### Missing tools\n\n`check_tls_endpoint`, `get_certificate_deployment`, `get_time_sync_status`.\n\n### Tool improvements\n\nExpose HTTPS verification/SNI/trust provenance without secrets; support registered client profiles with no bypass flag.\n\n### Detector improvements\n\nSeparate expiry warning from handshake incident; clock-aware, per-peer/profile detection and scope permissions.\n", "file": "RB-016-tls-certificate-handshake-failure.md"}, {"id": "RB-017", "title": "Docker daemon unavailable/degraded", "status": "draft", "version": "1.0.1", "detector": "docker_daemon_unavailable", "body": "# RB-017 \u2014 Docker daemon unavailable/degraded\n\n## Metadata\n\n```yaml\nid: RB-017\ntitle: Docker daemon unavailable/degraded\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: docker_daemon_unavailable\n```\n\n## Scope\n\nDocker Engine/runtime and Argus gateways on Linux Host T. Record Engine/API/systemd/containerd versions, storage driver and live-restore configuration. Exclude assuming all workloads stopped because the control API is unavailable. [Common contracts](../RUNBOOK-CONVENTIONS.md) apply; no dedicated runtime detector or restart-service capability exists.\n\n## Incident definition\n\nExpected Docker control-plane observations/operations fail or degrade. The cause can be the daemon, its socket/auth path, an Argus gateway or host resources. Docker daemon troubleshooting distinguishes connectivity/configuration problems from daemon process state. [Docker daemon troubleshooting](https://docs.docker.com/engine/daemon/troubleshoot/)\n\n## User / service impact\n\nContainer inspection/remediation/deployment may be unavailable while running applications still serve traffic. Independently measure workload endpoints and observability. Record control-plane and application impact separately.\n\n## Trigger / detection conditions\n\nProposed trigger: repeated bounded runtime-read failures across two declared targets for at least `max(60 seconds, 2*S)`, plus gateway/daemon path evidence; a single refused target is not daemon failure. Current metric loss may route to RB-014/undiagnosable. Missing runtime tools cannot justify bypassing the gateway.\n\n## Symptoms\n\nAPI timeouts/connection errors, gateway 401/403/5xx, missing runtime inventory, daemon startup failures, storage errors and widespread inspect failures.\n\n## Plausible causes / hypotheses\n\nH1 read gateway down; H2 network/tunnel/auth or exact-route policy fault; H3 daemon stopped/crashed; H4 daemon misconfiguration/startup failure; H5 host memory/disk/I/O pressure; H6 runtime/storage-driver degradation; H7 API incompatibility; H8 isolated target not found/replaced.\n\n## Required evidence\n\nError category/route, independent gateway and daemon health, host service state, approved runtime journal, host resources, workload probes, target identity and runtime/config change history. Avoid raw Docker info/inspect/env dumps containing secrets or unrestricted host data.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `get_container_list()` / `get_container_status(container)` | Bounded allowlisted runtime observations/errors | `READ_ONLY_SENSITIVE` |\n| `get_journal_logs(unit='docker', since_minutes=30)` | Docker unit journal; only docker/containerd enum supported | `READ_ONLY_SENSITIVE` |\n| `get_host_memory()` / `get_disk_usage(path=None)` / `get_io_metrics()` | Independent host pressure if probe survives | `READ_ONLY_SAFE` |\n| `get_system_uptime()` | Boot context | `READ_ONLY_SAFE` |\n| `check_http_endpoint(url, timeout_s=3)` | Registered workload health independent of daemon API | `READ_ONLY_SENSITIVE` |\n\nHost/journal/probe dependencies may fail together; a tool error is not an empty healthy result. Journal collection uses a bounded approved unit, consistent with systemd's unit filtering. [systemd journalctl source manual](https://raw.githubusercontent.com/systemd/systemd/main/man/journalctl.xml)\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_runtime_gateway_status(gateway_id)` returns route/auth/transport health; `get_docker_daemon_status(host_id)` returns allowlisted ping/version and daemon service state; `get_service_state(host_id, unit_id)` returns approved systemd state/start/error with no general unit enumeration. All `READ_ONLY_SENSITIVE`. **MISSING TOOL REQUIREMENT:** a separately released `restart_service` capability if desired; it is roadmap-only, not current authority.\n\n## Diagnostic workflow\n\n| Step | Action / why | Interpretation / next step |\n|---|---|---|\n| 1 | Classify read refusal/not-found/transport error | One disallowed/replaced target \u2192 H2/H8, not daemon outage. Several runtime failures \u2192 2. |\n| 2 | Independently probe workloads and host visibility | Applications healthy \u2192 control-plane-only impact possible. Visibility also lost \u2192 RB-014 and owner escalation. |\n| 3 | Gateway status versus bounded daemon/service state | Gateway bad/daemon alive \u2192 H1/H2. Daemon down \u2192 4. Missing discriminating tool \u2192 keep both. |\n| 4 | Docker/containerd unit journal and recent config | Startup/config/runtime error supports H3/H4/H6; sanitized fields only. |\n| 5 | Host memory/filesystem/I/O and boot | Resource cause \u2192 RB-007/005/010; repeated restart without capacity repair likely recurs. |\n| 6 | Owner assesses workload/live-restore/restart impact | Capture evidence; no model daemon restart. Verify both control and data planes after owner repair. |\n\n## Decision tree\n\n```text\nsingle target refused/missing? -> policy/identity\nmultiple runtime reads fail -> workloads independently healthy?\n  gateway fails, daemon healthy -> gateway/network/auth\n  daemon service fails -> config/resources/runtime logs\n  no independent evidence -> insufficient_evidence; platform escalation\n```\n\n## Evidence interpretation\n\nLive restore can keep containers running while the daemon is unavailable, subject to configuration and documented limitations. Do not assume it is enabled or makes daemon restart risk-free. [Docker live restore](https://docs.docker.com/engine/daemon/live-restore/)\n\n## False positives and edge cases\n\nExpired gateway credential, route deny, tunnel outage, API version mismatch, one removed container, stale inventory, busy daemon, host reboot and healthy processes with unavailable inspection.\n\n## Diagnosis outcome\n\nAll common outcomes allowed. Probable daemon failure requires independent service/runtime evidence; gateway failure alone supports only a control-path hypothesis. Missing mandatory metrics keeps the existing undiagnosable behavior.\n\n## Mitigation\n\nPlatform owner restores the specific gateway/transport/config or host resource. Daemon restart is an exceptional host-wide operator action after impact assessment; container restart cannot repair an unavailable daemon control path.\n\n## Recovery\n\nAllowlisted runtime reads work consistently, intended container identities/states are accounted for, and workload endpoints are healthy. API availability alone does not establish workload recovery.\n\n## Root-cause correction\n\nRepair runtime configuration/resource limits, storage fault, credential rotation or version compatibility; test upgrade/live-restore behavior in a matching lab.\n\n## Action safety\n\nDaemon/containerd restart, gateway restart and runtime config/storage changes are `MUTATING_HIGH_RISK`. Require exact host/unit/config, full workload impact inventory, protected databases/control plane, capacity repair, rollback and owner authority. Block unknown live-restore behavior, unresolved storage corruption, unavailable audit, missing service tool or hypothetical target scope. Current Argus must escalate; registering restart_container does not authorize restarting Docker.\n\n## Human-in-the-Loop\n\nApproval must describe every affected workload, outage/state-loss risks, exact unit/change and recovery plan. A daemon restart cannot be approved as if it affected only one container.\n\n## Forbidden actions\n\n`FORBIDDEN`: direct Docker socket access, unauthenticated daemon exposure, remove `/var/lib/docker`, purge storage-driver data, arbitrary systemctl/shell, repeated daemon restarts or recreate all containers blindly.\n\n## Evidence preservation\n\nBounded runtime journal and gateway errors, host resource state, config fingerprints and independent workload inventory in a healthy evidence sink. Record inability to obtain a Docker snapshot; do not fabricate it.\n\n## Verification\n\nAfter owner repair, three fresh independent gateway/daemon reads and at least 5 minutes of stable workload probes. Confirm API version/identities, no fresh startup/storage errors, no unexpected container losses and healthy resources. Partial inventory, unknown workload state or recurrence prevents closure; no automatic second restart.\n\n## Rollback\n\nPlatform owner retains previous compatible runtime config/version; downgrade/storage rollback can be unsafe and requires its own tested procedure. Restart itself is not reversible; there is no automatic daemon rollback capability.\n\n## Escalation\n\nPlatform/runtime owner immediately, storage owner for driver/I/O errors, incident commander if host-wide impact. Attach exact path/category, independent service state, resources, protected workloads and uncertainty. Stop when execution outcome cannot be determined.\n\n## Recording / memory\n\nCommon record plus control-versus-data-plane impact, gateway/daemon versions, live-restore evidence, affected workload inventory and owner action outcome.\n\n## Prevention / follow-up\n\nIndependent gateway/runtime health, tested upgrade/restart procedure, bounded journals, credential lifecycle and per-host recovery inventory.\n\n## Lab validation\n\nDedicated disposable VM: first stop only the read gateway for 90 seconds while a synthetic API remains serving. Expect a control-path failure, insufficient daemon attribution without status tool and zero container/daemon writes. Restore gateway; separately test a reviewed bad daemon-config fixture only on a snapshot-restorable VM with out-of-band access and saved workload state. Owner restores the exact config; denial/absent restart capability must block agent restart. Verify API and workloads for 5 minutes, preserve all lifecycle artifacts, and restore snapshot on abort. No runtime service was changed for this library.\n\n## References\n\n- [Docker daemon troubleshooting](https://docs.docker.com/engine/daemon/troubleshoot/), [live restore](https://docs.docker.com/engine/daemon/live-restore/).\n- [systemd journalctl manual source](https://raw.githubusercontent.com/systemd/systemd/main/man/journalctl.xml), [systemctl manual source](https://raw.githubusercontent.com/systemd/systemd/main/man/systemctl.xml). The rendered freedesktop pages could not be fetched; official source manuals were reviewed instead.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nIndependent gateway/daemon/unit state, complete workload impact inventory and runtime config/version history.\n\n### Missing tools\n\n`get_runtime_gateway_status`, `get_docker_daemon_status`, `get_service_state`; separately reviewed `restart_service` if ever enabled.\n\n### Tool improvements\n\nPreserve transport/auth/policy/runtime distinctions and independent host-probe availability; don't hide journal failures.\n\n### Detector improvements\n\nMulti-target control-path detector plus scope/host-wide policy, without bypassing RB-014 guards.\n", "file": "RB-017-docker-daemon-unavailable.md"}, {"id": "RB-018", "title": "Deployment regression", "status": "draft", "version": "1.1.1", "detector": "deployment_regression", "body": "# RB-018 \u2014 Deployment regression\n\n## Metadata\n\n```yaml\nid: RB-018\ntitle: Deployment regression\nstatus: draft\nowner: Argus Team\nversion: 1.1.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: deployment_regression\n```\n\n## Scope\n\nVersioned Docker/Compose application images, configuration and dependency/schema changes on declared services. Record immutable artifact/config digests, release transaction and compatibility assumptions. Exclude unsupported production rollout control. [Common contracts](../RUNBOOK-CONVENTIONS.md) apply; deployment detection and rollback execution are missing.\n\n## Incident definition\n\nService behavior regresses in association with a release/config change, with evidence needed to support a causal mechanism. Temporal proximity alone does not prove causation. Comparing release cohorts under comparable conditions can strengthen attribution. [Google SRE canarying releases](https://sre.google/workbook/canarying-releases/)\n\n## User / service impact\n\nIdentify affected release cohort/routes, error/latency/completion changes, data integrity concerns and remaining healthy capacity. A successful deployment command is not service success.\n\n## Trigger / detection conditions\n\nProposed selection: fresh service objective breach after a known deployment, with an explicit comparison window (lab 30 minutes before/after) and sufficient matched traffic. Existing health/OOM/dependency detectors may initiate investigation; release correlation is a diagnostic branch, not a new current class. Missing release time/artifact means only a suspected change relationship.\n\n## Symptoms\n\nNew exceptions, crash loops, error/latency increase, resource growth, bad config, dependency protocol mismatch or behavior isolated to a new release.\n\n## Plausible causes / hypotheses\n\nH1 code defect; H2 invalid config/secret reference; H3 incompatible schema/protocol; H4 missing resource/permission/dependency; H5 expected warmup/startup transient; H6 independent load/infrastructure incident; H7 mixed rollout or contaminated comparison baseline; H8 untrusted artifact/configuration or suspected compromise requiring security-owner investigation.\n\n## Required evidence\n\nRelease event/actor, old/new immutable digests, configuration fingerprints without values, schema migration status/compatibility, cohort traffic/SLIs, first failure, resource/dependency timeline and known-good baseline provenance. The release owner must also establish artifact provenance and whether a proposed older version is still permitted under current security policy. A mutable image tag is not a stable artifact identity. [Docker image references](https://docs.docker.com/engine/containers/run/#image-references)\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `get_container_status(container)` / `get_container_events(container, since_minutes=60)` | Current identity and lifecycle evidence | `READ_ONLY_SENSITIVE` |\n| `get_detailed_logs(container, since_minutes=30, max_lines=150)` | First post-change errors, redacted | `READ_ONLY_SENSITIVE` |\n| `inspect_service_config(container, config='main')` | Declared redacted configuration only | `READ_ONLY_SENSITIVE` |\n| `compare_incident_baseline(container)` | Current versus helper baseline; must verify baseline was healthy | `READ_ONLY_SAFE` |\n| `correlate_incident_timeline(container, minutes=60)` | Service/dependency chronology, not complete release history | `READ_ONLY_SENSITIVE` |\n| `get_cpu_history(container, minutes=60)` / `get_memory_history(container, minutes=60)` | Resource comparison | `READ_ONLY_SAFE` |\n| `capture_diagnostic_snapshot(container)` | Preserve faulty-instance evidence before replacement | `READ_ONLY_SENSITIVE` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_deployment_history(service_id, minutes)` returns release/digest/config/schema metadata; `compare_release_cohorts(service_id, release_ids, minutes)` returns traffic-normalized SLIs and coverage; `get_release_compatibility(service_id, from_digest, to_digest)` exposes approved migration/rollback compatibility. These are `READ_ONLY_SENSITIVE`. Approved artifact provenance and current security status are also required before any release restore; no such Argus contract was found. **MISSING TOOL REQUIREMENT:** `rollback_deployment(service_id, release_digest, expected_current_digest)` would be a separately gated `MUTATING_HIGH_RISK` capability; no arbitrary image URL/tag or migration shell.\n\n## Diagnostic workflow\n\n| Step | Action / why | Interpretation / next step |\n|---|---|---|\n| 1 | Establish actual release and first failure time/identity | Missing release evidence \u2192 hypothesis only. Failure predates release \u2192 H6 or pre-existing issue. |\n| 2 | Compare matched cohorts/healthy baseline with adequate representative exposure | New cohort alone worsens \u2192 H1\u2013H4 supported; all cohorts worsen \u2192 demand/dependency or shared-backend contamination. A tiny or off-peak canary may miss route/load defects. Check absolute service objectives as well as relative cohort difference; missing metrics are not non-abnormal. |\n| 3 | Logs/config fingerprints and lifecycle | Reproducible new error supports mechanism; don't expose env to inspect secret references. |\n| 4 | Dependencies/resources/warmup timeline | Capacity/dependency event \u2192 owning runbook; startup transient \u2192 bounded wait only within approved budget. |\n| 5 | Check migration, artifact provenance and current security policy before proposing change | Unknown/destructive schema effects, incompatible prior image, vulnerable prior release or untrusted artifact \u2192 block ordinary rollback and escalate to release/security owner. Forward repair may be necessary. |\n| 6 | Snapshot and owner chooses exact compatible artifact | Current Argus escalates deployment changes; verify all affected cohorts after owner action. |\n\n## Decision tree\n\n```text\nrelease precedes credible regression?\n  no/unknown -> independent incident or insufficient_evidence\n  yes -> new cohort differs under matched demand?\n           no -> shared dependency/load/baseline investigation\n           yes -> mechanism in code/config/schema/resources?\n                    supported -> compatibility review\n                    unknown -> probable association only\ncompatible, trusted, security-permitted rollback artifact? no -> forward repair / escalation\n```\n\n## Evidence interpretation\n\nTime order and one error spike are not proof. Current baseline helper chooses historical data without proving it was healthy and can omit/misclassify missing current metrics; independently validate coverage. Restarting a container does not select a prior image/config release.\n\n## False positives and edge cases\n\nTraffic mix changes, cold caches, migrations affecting both cohorts, mutable tags, host pressure during builds, partial rollout, feature flags, release clock skew, old baseline already degraded and containers recreated under the same name. A before/after comparison without concurrent control is vulnerable to time-of-day demand changes; a shared backend can make both canary and control degrade together.\n\n## Diagnosis outcome\n\nAll common outcomes allowed. Probable regression names artifact/config and supported mechanism with matched comparisons; a correlated deployment with missing compatibility or baseline remains uncertain and unsafe to roll back automatically.\n\n## Mitigation\n\nRelease owner pauses further rollout or restores a tested compatible artifact through the existing deployment system. Feature-flag/traffic changes require their own owned contracts. Current Argus offers no deployment write.\n\n## Recovery\n\nIntended compatible artifact runs across the affected cohort and service objectives recover with representative load, healthy dependencies and no new data integrity signals.\n\n## Root-cause correction\n\nFix code/config/schema protocol, strengthen canary and compatibility tests, then deploy a corrected version. Rollback restores service but may leave the defect unresolved for the next release.\n\n## Action safety\n\nPause/rollback/config/schema writes are `MUTATING_HIGH_RISK`. Bind service, current/desired immutable digests, exact rollout scope, config/schema compatibility, trusted artifact provenance, current security status, protected data and rollback/forward-repair plan; preserve faulty instance evidence. Block unknown migrations, unavailable or vulnerable prior artifact, suspected tampering, unreviewed secret changes, active rollout race or missing tool/profile. Route suspected compromise through the security-owned incident process; routine service restoration must not destroy needed evidence or reintroduce an attack path. Database reversal is never implicit in application rollback.\n\n## Human-in-the-Loop\n\nShow old/new artifacts, affected cohort, evidence and alternatives, compatibility attestations, exact rollout operation and data risks. Any changed current digest cancels approval. An incident-level \u201croll back\u201d intention is not an executable proposal.\n\n## Forbidden actions\n\n`FORBIDDEN`: pull arbitrary/latest images, destructive schema reversal without an approved migration plan, wipe volumes, replay data blindly, auto-rollback from correlation alone or dump secrets to compare configuration.\n\n## Evidence preservation\n\nSnapshot faulty instance, retain image/config fingerprints and redacted logs, release/migration audit and matched SLI windows before replacement. Logs tied only to current names are insufficient after recreation.\n\n## Verification\n\nThree fresh post-change identity/health observations, then two complete 5-minute SLI windows with matched representative traffic. Confirm exact desired digest/config/schema, recovered errors/latency/completion, and no hidden bad cohort. Old rolling samples, low traffic, rollout drift or new incompatibility prevents closure. Timeout/recurrence escalates.\n\n## Rollback\n\nThis procedure's rollback is itself the proposed mitigation and has compatibility, provenance and current security gates. If it worsens the incident, the owner chooses a validated forward fix or compatible saved release; do not oscillate automatically between versions. A release once labeled healthy is not automatically safe to restore after a vulnerability or suspected compromise. No automatic rollout undo is currently implemented.\n\n## Escalation\n\nRelease/application owner, DBA for schema compatibility, incident commander for broad impact. Attach artifact chronology, cohort comparisons, mechanism/counterevidence and exact unresolved compatibility question.\n\n## Recording / memory\n\nCommon record plus release/current/desired digests, config/schema fingerprints, comparison provenance, compatibility decision, owner action and unresolved defect ticket.\n\n## Prevention / follow-up\n\nImmutable artifacts, staged rollout with representative canary size/duration and bounded user exposure, automated compatibility tests, deployment event telemetry and release cohorts in SLIs.\n\n## Lab validation\n\nTwo disposable compatible API versions with equal synthetic traffic: new version deterministically returns 500 on one harmless route; retain old version and identical schema. Expect existing health/error context\u2192RB-018, cohort-specific evidence and refusal of a fabricated rollback tool. Owner tests denial then exact approved deployment-system rollback; verify two full SLI windows and record all stages. Repeat with an incompatible schema fixture and a metadata fixture marking the prior version security-disallowed: rollback must be blocked in both cases despite apparent new-version correlation. Also replay an independent dependency failure affecting both versions. No rollout was executed.\n\n## References\n\n- [Google SRE canarying releases](https://sre.google/workbook/canarying-releases/), [Docker image references](https://docs.docker.com/engine/containers/run/#image-references). *The Site Reliability Workbook* (2018), \u201cCanarying Releases,\u201d PDF pp. 374\u2013381, discusses representative exposure, control contamination and absolute objectives.\n- *Building Secure and Reliable Systems* (2020), \u201cDesign for Recovery\u201d and \u201cRecovery and Aftermath,\u201d PDF pp. 219, 230\u2013232, 462, for security-aware restore and rollback.\n- [Argus assessment](../RUNBOOK-ASSESSMENT.md) \u2014 baseline helper and missing deployment capabilities.\n\n## Argus capability gaps\n\n### Missing telemetry\n\nImmutable release/config/schema history, approved artifact provenance and current security status, proven healthy baseline and matched cohort SLIs.\n\n### Missing tools\n\n`get_deployment_history`, `compare_release_cohorts`, `get_release_compatibility`; separately released `rollback_deployment` if desired.\n\n### Tool improvements\n\nMissing data cannot mean non-abnormal baseline; include artifact identity and evidence coverage.\n\n### Detector improvements\n\nRelease-linked impact detection without automatic causal attribution; separate compatibility, provenance, security-status and rollback policy gates and permissions.\n", "file": "RB-018-deployment-regression.md"}, {"id": "RB-019", "title": "PostgreSQL disk/capacity pressure", "status": "draft", "version": "1.0.1", "detector": "postgresql_storage_pressure", "body": "# RB-019 \u2014 PostgreSQL disk/capacity pressure\n\n## Metadata\n\n```yaml\nid: RB-019\ntitle: PostgreSQL disk/capacity pressure\nstatus: draft\nowner: Argus Team\nversion: 1.0.1\ncreated: 2026-09-29\nlast_reviewed: 2026-10-09\nsource_review_date: 2026-09-29\nlast_tested: null\ndetector: postgresql_storage_pressure\n```\n\n## Scope\n\nDeclared PostgreSQL 16 data, WAL, tablespace, temporary-file and archive storage, with mapped host filesystems. Verify version, topology/replicas, backup policy and actual mount ownership. Exclude generic Docker cache cleanup of DB volumes and performance-only I/O incidents (RB-010). [Common contracts](../RUNBOOK-CONVENTIONS.md) apply; standalone detection is missing.\n\n## Incident definition\n\nDatabase-owned storage approaches exhaustion or database writes fail because required storage cannot grow. PostgreSQL disk-full behavior depends on which filesystem fills; loss of WAL space is particularly serious. [PostgreSQL disk-full failure](https://www.postgresql.org/docs/16/disk-full.html)\n\n## User / service impact\n\nObserve failed transactions, unavailable write service, replication/archive lag and threatened recovery objectives. A read-only query or established session succeeding does not prove writes or recoverability are healthy.\n\n## Trigger / detection conditions\n\nProposed trigger: mapped data/WAL/tablespace available space below a reviewed reserve (lab 10% for 5 minutes), predicted exhaustion within an hour, or corroborated DB disk-full error. Reserve must cover workload, WAL and maintenance peaks; no universal percentage is enough. Required mount/series absent \u2192 insufficient_evidence, not zero growth.\n\n## Symptoms\n\nENOSPC/disk-full messages, growing database/WAL/archive area, write failures, stalled replication/archiving, temporary-file expansion or repeated database startup failure.\n\n## Plausible causes / hypotheses\n\nH1 legitimate relation/index growth; H2 WAL retained by slots/lagging consumers; H3 archive failure/backlog; H4 dead-tuple/bloat/long transaction retention; H5 temporary-query spill; H6 logs or unrelated files on shared mount; H7 inode/quota/storage fault. Total database size does not measure every category.\n\n## Required evidence\n\nDB\u2192data/WAL/tablespace/archive mount mapping and available bytes/inodes; per-category growth; slots/replicas and oldest required WAL; archive health; relation/transaction/maintenance summaries; temporary spill and actual service transaction results. Backup/replication promises are constraints, not expendable disk consumers.\n\n## Required Argus tools\n\n| Existing tool / input | Purpose / output | Safety class |\n|---|---|---|\n| `get_disk_usage(path=None)` | Only supported allowlisted host paths; may not cover database mount | `READ_ONLY_SAFE` |\n| `get_disk_history(minutes=60)` | Root space history only; not arbitrary DB tablespaces | `READ_ONLY_SAFE` |\n| `inspect_database_health(container)` | DB size, transactions/waits and connection context | `READ_ONLY_SENSITIVE` |\n| `get_detailed_logs(container, since_minutes=15, max_lines=100)` | Bounded redacted database storage errors | `READ_ONLY_SENSITIVE` |\n| `get_io_metrics()` | Performance alternative | `READ_ONLY_SAFE` |\n\n## Missing tools\n\n**MISSING TOOL REQUIREMENT:** `get_db_storage_usage(database_id)` returns approved category sizes and mount IDs; `get_db_wal_retention(database_id)` returns slot/replica retention and restart positions; `get_db_archive_status(database_id)` returns archive backlog/error state; `get_db_maintenance_state(database_id)` returns bounded transaction/vacuum/spill summaries; `get_database_transaction_health(service_id, minutes)` reads existing application-owned transaction-success telemetry. All `READ_ONLY_SENSITIVE`. Shared filesystem history/topology contracts are required. No arbitrary SQL or data-directory walk is a substitute.\n\n## Diagnostic workflow\n\n| Step | Action / reason | Interpretation / next step |\n|---|---|---|\n| 1 | Bind affected database and failing storage mount | Unknown mount \u2192 request mapping; root-space success cannot clear a full tablespace. |\n| 2 | Category history and rate/reserve | Relations \u2192 H1/H4; WAL \u2192 H2/H3; temp \u2192 H5; shared logs/other \u2192 H6/RB-005. Partial category totals leave alternatives. |\n| 3 | For WAL, inspect slots/replicas and archive health | Lagging required consumer/archive failure supports retention mechanism. Do not delete retained segments or drop slots to test it. |\n| 4 | For relations/temp, inspect long transactions/maintenance/spills | Supported retention/spill cause \u2192 DBA/query owner; size alone is not bloat proof. |\n| 5 | Correlate demand/deployment and I/O | Legitimate growth needs capacity; slow storage can amplify backlog. Separate RB-010 from capacity. |\n| 6 | Preserve compact evidence; DBA selects capacity/producer/consumer repair | Near-exhaustion with missing detail \u2192 urgent escalation, no speculative cleanup. |\n\n## Decision tree\n\n```text\nidentified DB storage pressure -> which category grows?\nrelations/indexes -> workload / maintenance / long transactions\nWAL -> replication slot/consumer + archive evidence\ntemporary files -> expensive query/workload evidence\nshared logs/other -> owner + RB-005\nunknown -> insufficient_evidence; protect all DB files\n```\n\n## Evidence interpretation\n\nReplication slots can retain WAL required by consumers; slot metadata and consumer state must inform any intervention. [PostgreSQL replication slots](https://www.postgresql.org/docs/16/view-pg-replication-slots.html), [standby replication](https://www.postgresql.org/docs/16/warm-standby.html) Failed archiving can accumulate retained WAL, so the next check is archive status, not manual segment deletion. [Continuous archiving](https://www.postgresql.org/docs/16/continuous-archiving.html)\n\n## False positives and edge cases\n\nWAL versus relation mount separation, temporary bursts, storage snapshots, sparse files, logical slots, standby lag, existing transactions masking write failures, quota/inodes and missing privilege to inspect stats.\n\n## Diagnosis outcome\n\nAll common outcomes permitted. Probable cause names storage category, mount, retaining owner and supporting history; unknown retention/backup implications require escalation even if space is low.\n\n## Mitigation\n\nDBA/platform owner adds reviewed capacity, pauses a proven non-critical producer or repairs an archive/replication consumer. Preserve data and recovery objectives. No default Argus write exists for this class.\n\n## Recovery\n\nAdequate reserve returns on all required mounts, application-owned transactions succeed, and WAL/archive/replication growth is controlled without violating backup objectives.\n\n## Root-cause correction\n\nFix consumer/archive failures, transaction/query behavior, retention/capacity planning and maintenance. Routine vacuum and `VACUUM FULL` have different spac
