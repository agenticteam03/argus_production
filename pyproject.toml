[project]
name = "argus"
version = "0.2.0"
description = "Argus v1.8: SRE incident-diagnosis agent on two real hosts (vm-095, vm-166)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "PyYAML>=6",
  "PyJWT[crypto]>=2.8",                         # ACR-0018: EdDSA token signing needs cryptography
  "pwdlib[argon2]>=0.2",
  "openai>=1.66",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2,<3.3",
  "psycopg-pool>=3.2",
  "langgraph>=1.2,<1.3",                        # T-0013: the v1.8 skeleton as a graph
  "langgraph-checkpoint-postgres>=3.1,<3.2",    # T-0013: resume an investigation after a crash
  "croniter>=6,<7",                             # T-0014: the scheduler's cron expressions (pure Python)
  "mcp>=2.3,<2.4",                              # T-0021: the tools process (stdio MCP; pure Python)
]

[project.scripts]
argus = "argus.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100"]
dev = ["pre-commit>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.setuptools.package-data]
argus = ["runbooks/*.md"]   # the reviewed runbook library (D-002)

[tool.ruff.lint]
# OP-014 step 5: the default rules (pyflakes and the pycodestyle errors) on the production code, in CI. E731 (a
# named lambda) is style only and used on purpose in a few places.
ignore = ["E731"]
