# Signal catalogue: name → PromQL template ($host, $name). Every template filters on argus_host.
# Used by detection (MetricsPort) and by the metrics.* capabilities. Free-form PromQL is never accepted.
restarts_10m:          'clamp_min((argus_container_restart_count{argus_host="$host",container="$name"} and on(argus_host,container) (time() - argus_container_created_seconds{argus_host="$host",container="$name"} < 600)) or on(argus_host,container) (argus_container_restart_count{argus_host="$host",container="$name"} - argus_container_restart_count{argus_host="$host",container="$name"} offset 10m), 0)'
oom_killed:            'argus_container_oom_killed{argus_host="$host",container="$name"}'
last_exit_code:        'argus_container_last_exit_code{argus_host="$host",container="$name"}'
health_unhealthy:      'argus_container_health_unhealthy{argus_host="$host",container="$name"}'
dependency_probe_min:  'min(argus_probe_success{argus_host="$host",owner="$name"})'
# ACR-0021: the exporter's probe of each declared dependency of the owner (one series per `dependency`), read by the
# topology's links only (MetricsPort.dependency_probes); never a detector signal.
dependency_probe_success:     'argus_probe_success{argus_host="$host",owner="$name"}'
dependency_probe_duration_s:  'argus_probe_duration_seconds{argus_host="$host",owner="$name"}'
container_memory_bytes: 'argus_container_memory_bytes{argus_host="$host",container="$name"}'
container_restart_count: 'argus_container_restart_count{argus_host="$host",container="$name"}'
# T-0020 (db-probe /metrics): ordinary-slot usage sustained for 5 minutes (RB-004 calibration default); unknown
# capacity (usable 0) gives no value. db_up 0 = the database could not be read (unknown, not healthy).
db_connection_usage:   'min_over_time((argus_db_connections_used{argus_host="$host",container="$name"} / (argus_db_connections_usable{argus_host="$host",container="$name"} > 0))[5m:30s])'
db_up:                 'argus_db_up{argus_host="$host",container="$name"}'
# T-0022 (node-exporter, cAdvisor; for SC-05/SC-06 later). Host signals take $host only; the root filesystem.
host_disk_used_ratio:  '1 - node_filesystem_avail_bytes{argus_host="$host",mountpoint="/"} / node_filesystem_size_bytes{argus_host="$host",mountpoint="/"}'
host_cpu_busy_ratio:   '1 - avg(rate(node_cpu_seconds_total{argus_host="$host",mode="idle"}[5m]))'
host_memory_available_ratio: 'node_memory_MemAvailable_bytes{argus_host="$host"} / node_memory_MemTotal_bytes{argus_host="$host"}'
container_cpu_throttled_ratio: 'rate(container_cpu_cfs_throttled_periods_total{argus_host="$host",name="$name"}[5m]) / (rate(container_cpu_cfs_periods_total{argus_host="$host",name="$name"}[5m]) > 0)'
# T-0029 (SC-08, RB-015): the share of the exporter's probes through a declared endpoint that got a gateway error
# (502/504: the proxy's own answer when its upstream fails or is too slow) over 5 minutes; the worst endpoint.
http_gateway_error_ratio_5m: 'max(avg_over_time(argus_http_probe_gateway_error{argus_host="$host",owner="$name"}[5m]))'
# T-0028 (SC-06, RB-006): the share of the container's CPU periods throttled at its quota (cAdvisor CFS counters), its
# minimum over 5 minutes; no value for a container without a quota (no periods). The rate window is 3m: cAdvisor
# stamps its samples at each housekeeping (35-53 s apart on vm-166), so a 1m window rarely holds two samples.
container_cpu_throttled_ratio_5m: 'min_over_time((rate(container_cpu_cfs_throttled_periods_total{argus_host="$host",name="$name"}[3m]) / (rate(container_cpu_cfs_periods_total{argus_host="$host",name="$name"}[3m]) > 0))[5m:30s])'
# T-0028: how much of its CPU quota the container uses (usage / (quota / period)), the 5-minute minimum. The throttled
# share counts only the periods the container ran in, so a bursty container far below its quota can show a high
# share (argus-lab-api on vm-166: 0.61 throttled at 0.04 of its quota): saturation needs both.
container_cpu_quota_used_ratio_5m: 'min_over_time((rate(container_cpu_usage_seconds_total{argus_host="$host",name="$name"}[3m]) / on(name) (container_spec_cpu_quota{argus_host="$host",name="$name"} / container_spec_cpu_period{argus_host="$host",name="$name"}))[5m:30s])'
# T-0024 (SC-05, RB-005): every DECLARED mount of the host target ($mounts, from the inventory), not only `/`.
# The worst mount's used ratio, its minimum over 5 minutes; the soonest time to full (hours) at the 15-minute fill rate
# (no value when nothing is growing).
host_disk_used_ratio_5m: 'max(min_over_time((1 - node_filesystem_avail_bytes{argus_host="$host",mountpoint=~"$mounts"} / node_filesystem_size_bytes{argus_host="$host",mountpoint=~"$mounts"})[5m:30s]))'
host_disk_hours_to_full: 'min(node_filesystem_avail_bytes{argus_host="$host",mountpoint=~"$mounts"} / (-deriv(node_filesystem_avail_bytes{argus_host="$host",mountpoint=~"$mounts"}[15m]) > 0)) / 3600'
# T-0027 (RB-014): how many of the host's scrape targets are down (`up == 0`); 0 when all are up. A target down leaves
# the signals it feeds empty: the class monitoring_blind_spot, never a healthy host.
# T-0043: plus the expected jobs every host scrapes (exporter, node-exporter, cAdvisor) that have no `up` series at all.
scrape_targets_down:   '(count(up{argus_host="$host"} == 0) or vector(0)) + (3 - (count(up{argus_host="$host",job=~"argus-v18-(exporter|node-exporter|cadvisor)"}) or vector(0)))'
# Freshness gate (not a detector signal): the host's exporter scrape must be up, otherwise detection is undiagnosable.
_scrape_up:            'up{argus_host="$host",job="argus-v18-exporter"}'
# T-0036 (metric histories, ARCHITECTURE §12 Level 2): read only by the metrics.* capabilities, never by a detector.
# A container's CPU cores in use (cAdvisor; 3m rate: its samples are 35-53 s apart).
container_cpu_cores:   'rate(container_cpu_usage_seconds_total{argus_host="$host",name="$name"}[3m])'
# The fullest of the host's DECLARED mounts ($mounts from the inventory, as detection reads them).
host_disk_used_ratio_mounts: 'max(1 - node_filesystem_avail_bytes{argus_host="$host",mountpoint=~"$mounts"} / node_filesystem_size_bytes{argus_host="$host",mountpoint=~"$mounts"})'
# The host's received + sent bytes per second on its real interfaces (node-exporter; not lo, veth, docker, br-).
# cAdvisor runs with its network metrics disabled (memory, deploy/monitoring/compose.monitoring.yml): no per-container
# traffic until that is decided (T-0036 step 2).
host_network_bytes_per_s: 'sum(rate(node_network_receive_bytes_total{argus_host="$host",device!~"lo|veth.*|docker.*|br-.*"}[3m]) + rate(node_network_transmit_bytes_total{argus_host="$host",device!~"lo|veth.*|docker.*|br-.*"}[3m]))'

# ACR-0021 / T-0045 B1: where the UI draws its warning and critical lines (display values, not detection). `critical`
# equals the detector's own threshold where a detector reads the signal (tests/test_t0045_b1_thresholds.py pins it).
# direction `above`: worse as the value rises; `below`: worse as it falls. Optional `unit` (text) and `scale` (> 0) are
# display hints passed through to the answer. Validated at startup (a bad entry stops the API).
thresholds:
  host_cpu_busy_ratio:                {warning: 0.75, critical: 0.90, direction: above}
  host_memory_available_ratio:        {warning: 0.25, critical: 0.10, direction: below}
  host_disk_used_ratio:               {warning: 0.75, critical: 0.90, direction: above}
  restarts_10m:                       {warning: 2,    critical: 3,    direction: above}
  container_cpu_quota_used_ratio_5m:  {warning: 0.70, critical: 0.80, direction: above}
  container_cpu_throttled_ratio_5m:   {warning: 0.25, critical: 0.50, direction: above}
  db_connection_usage:                {warning: 0.75, critical: 0.90, direction: above}
  http_gateway_error_ratio_5m:        {warning: 0.10, critical: 0.50, direction: above}
  host_disk_used_ratio_5m:            {warning: 0.85, critical: 0.90, direction: above}
