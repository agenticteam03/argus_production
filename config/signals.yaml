# Signal catalogue: name → PromQL template ($host, $name). Every template filters on argus_host.
# Used by detection (MetricsPort) and by the metrics.* capabilities. Free-form PromQL is never accepted.
restarts_10m:          'max_over_time(argus_container_restart_count{argus_host="$host",container="$name"}[10m]) - min_over_time(argus_container_restart_count{argus_host="$host",container="$name"}[10m])'
oom_killed:            'argus_container_oom_killed{argus_host="$host",container="$name"}'
last_exit_code:        'argus_container_last_exit_code{argus_host="$host",container="$name"}'
health_unhealthy:      'argus_container_health_unhealthy{argus_host="$host",container="$name"}'
dependency_probe_min:  'min(argus_probe_success{argus_host="$host",owner="$name"})'
container_memory_bytes: 'argus_container_memory_bytes{argus_host="$host",container="$name"}'
container_restart_count: 'argus_container_restart_count{argus_host="$host",container="$name"}'
# T-0020 (db-probe /metrics): ordinary-slot usage sustained for 5 minutes (RB-004 calibration default); unknown
# capacity (usable 0) gives no value. db_up 0 = the database could not be read (unknown, not healthy).
db_connection_usage:   'min_over_time((argus_db_connections_used{argus_host="$host",container="$name"} / (argus_db_connections_usable{argus_host="$host",container="$name"} > 0))[5m:30s])'
db_up:                 'argus_db_up{argus_host="$host",container="$name"}'
# T-0022 (node-exporter, cAdvisor; for SC-05/SC-06 later). Host signals take $host only; the root filesystem.
host_disk_used_ratio:  '1 - node_filesystem_avail_bytes{argus_host="$host",mountpoint="/"} / node_filesystem_size_bytes{argus_host="$host",mountpoint="/"}'
host_cpu_busy_ratio:   '1 - avg(rate(node_cpu_seconds_total{argus_host="$host",mode="idle"}[5m]))'
host_memory_available_ratio: 'node_memory_MemAvailable_bytes{argus_host="$host"} / node_memory_MemTotal_bytes{argus_host="$host"}'
container_cpu_throttled_ratio: 'rate(container_cpu_cfs_throttled_periods_total{argus_host="$host",name="$name"}[5m]) / (rate(container_cpu_cfs_periods_total{argus_host="$host",name="$name"}[5m]) > 0)'
# Freshness gate (not a detector signal): the host's exporter scrape must be up, otherwise detection is undiagnosable.
_scrape_up:            'up{argus_host="$host",job="argus-v18-exporter"}'
