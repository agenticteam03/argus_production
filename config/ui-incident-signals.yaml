# ACR-0017: the charts around an incident (GET /api/v1/incidents/{id}/metrics). For each incident class, the named
# signals (config/signals.yaml) the UI draws, in order; `default` for an incident without a class. Validated at
# startup: an unknown signal, class, key or scope stops the API (as routing.yaml does).
#   signal   a name from config/signals.yaml
#   title    what the chart is called in the UI
#   scope    target (the incident's target, default) or host (the incident's host); never another host
#   unit     shown after the value ("%", "MiB", "cores", "h"; empty for a count or a 0/1 state)
#   scale    multiplies each value (100 for a 0-1 ratio shown in %, 1/1048576 for bytes shown in MiB)
#   max      the chart's top (optional; the UI uses the largest value otherwise)
#   fired    true for the signal the class's detector fires on (drawn in red)
#   kind     what the series measures, for the UI's icon and grouping (ACR-0021): memory, restarts, cpu,
#            latency, health, disk, database, network or other (default); validated
default:
  - {signal: host_cpu_busy_ratio, title: "Host CPU busy", scope: host, unit: "%", scale: 100, max: 100, kind: cpu}
  - {signal: host_memory_available_ratio, title: "Host memory available", scope: host, unit: "%", scale: 100, max: 100, kind: memory}

classes:
  dependency_unavailable:
    - {signal: dependency_probe_min, title: "Dependency probe (1 = reachable)", max: 1, fired: true, kind: network}
    - {signal: container_restart_count, title: "Restarts (total)", kind: restarts}
    - {signal: host_cpu_busy_ratio, title: "Host CPU busy", scope: host, unit: "%", scale: 100, max: 100, kind: cpu}
    - {signal: host_memory_available_ratio, title: "Host memory available", scope: host, unit: "%", scale: 100, max: 100, kind: memory}
  container_restart_loop:
    - {signal: restarts_10m, title: "Restarts in 10 min", fired: true, kind: restarts}
    - {signal: container_memory_bytes, title: "Memory", unit: "MiB", scale: 0.00000095367431640625, kind: memory}
    - {signal: oom_killed, title: "OOM killed (1 = yes)", max: 1, kind: memory}
    - {signal: container_cpu_cores, title: "CPU", unit: "cores", kind: cpu}
  health_check_failed:
    - {signal: health_unhealthy, title: "Health check failing (1 = yes)", max: 1, fired: true, kind: health}
    - {signal: restarts_10m, title: "Restarts in 10 min", kind: restarts}
    - {signal: container_memory_bytes, title: "Memory", unit: "MiB", scale: 0.00000095367431640625, kind: memory}
  postgresql_connection_exhaustion:
    - {signal: db_connection_usage, title: "Connection slots used", unit: "%", scale: 100, max: 100, fired: true, kind: database}
    - {signal: db_up, title: "Database up (1 = yes)", max: 1, kind: database}
  nginx_upstream_failure:
    - {signal: http_gateway_error_ratio_5m, title: "Gateway errors", unit: "%", scale: 100, max: 100, fired: true, kind: network}
    - {signal: restarts_10m, title: "Restarts in 10 min", kind: restarts}
  worker_stalled:
    - {signal: jobs_processed_rate, title: "Processed jobs per second", unit: "jobs/s", fired: true}
    - {signal: queue_depth, title: "Jobs waiting", unit: "jobs", fired: true}
    - {signal: worker_last_processed_age_s, title: "Seconds since last processed job", unit: "s", fired: true}
  cpu_saturation:
    - {signal: container_cpu_throttled_ratio_5m, title: "CPU periods throttled", unit: "%", scale: 100, max: 100, fired: true, kind: cpu}
    - {signal: container_cpu_quota_used_ratio_5m, title: "CPU quota used", unit: "%", scale: 100, max: 100, kind: cpu}
  disk_pressure:
    - {signal: host_disk_used_ratio_5m, title: "Disk used", unit: "%", scale: 100, max: 100, fired: true, kind: disk}
    - {signal: host_disk_hours_to_full, title: "Hours until full", unit: "h", kind: disk}
  monitoring_blind_spot:
    - {signal: scrape_targets_down, title: "Scrape targets down", fired: true, kind: health}
