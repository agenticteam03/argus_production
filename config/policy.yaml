# Argus v1.8 policy (data) for the two-VM deployment. The engine is argus/policy/engine.py; policy_version = SHA-256 of this file.
profile: production
max_tool_level: 3          # Level 3 (ARCHITECTURE §12.2): knowledge.runbook, database.health
allowed_safety_classes: [READ_ONLY_SAFE, READ_ONLY_SENSITIVE]

capabilities:
  container.list:          {max_per_incident: 4}
  container.status:        {max_per_incident: 8}
  container.resources:     {max_per_incident: 6}
  container.logs:          {max_per_incident: 6}
  container.health:        {max_per_incident: 6}
  container.events:        {max_per_incident: 4}
  container.processes:     {max_per_incident: 4}   # T-0037: offered to no class yet
  docker.disk_usage:       {max_per_incident: 2}
  container.detailed_logs: {max_per_incident: 4}
  container.search_logs:   {max_per_incident: 6}
  host.cpu:                {max_per_incident: 4}
  host.memory:             {max_per_incident: 4}
  host.uptime:             {max_per_incident: 2}
  host.disk_usage:         {max_per_incident: 4}
  host.load:               {max_per_incident: 3}   # T-0019 batch 2, Level 2: host-probe verbs (§4.6), read-only,
  host.top_cpu:            {max_per_incident: 3}   # bounded; process names only (never command lines), containers by id
  host.top_memory:         {max_per_incident: 3}
  host.kernel_oom_records: {max_per_incident: 2}
  host.io:                 {max_per_incident: 3}
  host.directory_sizes:    {max_per_incident: 3}   # declared mounts only (inventory `mounts`), one filesystem
  host.socket_summary:     {max_per_incident: 2}   # offered to no class yet (tag `sockets`)
  host.read_file:          {max_per_incident: 3}   # T-0019 batch 3b, Level 3: under `inspection` below (files: none yet)
  host.service_config:     {max_per_incident: 2}   # Level 3: the listed config files (nginx_upstream_failure)
  host.journal:            {max_per_incident: 2}   # Level 3: allowlisted units, rsyslog's text (offered to no class yet)
  host.process_details:    {max_per_incident: 3}   # Level 3: never cmdline or environ (offered to no class yet)
  network.resolve_dns:     {max_per_incident: 4}
  network.tcp_connect:     {max_per_incident: 4}
  network.http_probe:      {max_per_incident: 4}
  network.connectivity:    {max_per_incident: 3}   # T-0019 batch 3c, Level 2: read gateway; two allowlisted containers, network names only
  metrics.memory_history:  {max_per_incident: 4}
  metrics.restart_history: {max_per_incident: 4}
  metrics.cpu_history:     {max_per_incident: 4}   # T-0036: offered to no class yet
  metrics.disk_history:    {max_per_incident: 4}
  metrics.network_history: {max_per_incident: 4}
  metrics.compare_baseline: {max_per_incident: 2}  # T-0038, Level 3: offered to no class yet
  analysis.anomaly_summary: {max_per_incident: 1}  # T-0047 H5 (ACR-0024 §3.7), Level 3: offered to no class yet
  analysis.diagnostic_snapshot: {max_per_incident: 1}   # T-0034, Level 3, §12.7: combined; offered to no class yet
  knowledge.prior_incidents: {max_per_incident: 2}   # T-0039, Level 3, in-worker: offered to no class yet
  analysis.trace_request_path: {max_per_incident: 1}   # T-0040, Level 3, combined: offered to no class yet
  network.link_states:     {max_per_incident: 2}   # T-0046 L4, Level 2, in-worker: offered to no class yet (tag `link_states`)
  knowledge.runbook:       {max_per_incident: 3}   # in-worker: reads the runbook library (branch runbooks)
  knowledge.reference:     {max_per_incident: 3}   # T-0056 (ACR-0034), Level 3, in-worker: offered to no class yet
  database.health:         {max_per_incident: 3}   # T-0019, Level 3: db-probe; allowlisted databases only (inventory
                                                   # `database`), monitoring role, no rows, no SQL text

# T-0019 batch 3a: the inspection policy (ARCHITECTURE §4.7). What a file, log or process read may touch, per target.
# Checked by the engine before execution (rule `inspection`) and re-checked by the host probe from its rendered copy
# (ops/render_target_config.py). Deny patterns win; argus/policy/inspection.py adds a built-in deny floor the data
# cannot remove. `files` starts empty (decided 2026-10-12, conantkd): a path is added, exactly, when a case needs it,
# and reviewed on its own. `journal` reads rsyslog's text copy (/var/log/syslog) filtered by unit (batch 3b).
inspection:
  targets:
    vm-166/container:argus-lab-nginx:
      service_config: [/opt/argus-v18/app/deploy/lab/nginx/default.conf]   # the host file bind-mounted :ro (SC-08)
    vm-166/host:vm-166:
      files: []
      journal: {units: [docker.service, containerd.service], max_lines: 200}
      processes: true
    vm-095/host:vm-095:
      files: []
      journal: {units: [docker.service, containerd.service], max_lines: 200}
      processes: true
  deny: [environment_variables, /run/secrets/, /opt/argus-v18/secrets/, /root/, /etc/shadow,
         "*.key", "*.pem", .env, "*token*", "*password*"]
  limits: {max_lines: 500, max_bytes: 65536}
  arbitrary_exec: false     # true refuses startup

write_gate:
  open:
    - capability: container.start
      target: vm-166/container:argus-lab-cache
    - capability: container.restart
      target: vm-166/container:argus-lab-jobworker
    - capability: network.restore
      target: vm-166/container:argus-lab-api
