# Argus v1.8 inventory — two real hosts. Endpoints only (no credentials; those live in /opt/argus-v18/secrets).
# vm-095 = VM 0.95 (agent host + light target host): its executors are reached on the local Docker network.
# vm-166 = VM 0.166 (primary target + monitoring): reached through an SSH tunnel over port 22.
# Ports follow the port matrix in brain/IMPLEMENTATION_PLAN.md (section "Ports and networks").
hosts:
  vm-095:
    alertmanager: http://argus-v18-alertmanager:9093    # T-0022: read by the scheduler (not an executor)
    executors:
      docker_read:   http://argus-v18-read-gateway:8700
      host_probe:    http://argus-v18-host-probe:8700
      network_probe: http://argus-v18-network-probe:8700
      prometheus:    http://argus-v18-prometheus:9090
  vm-166:
    alertmanager: http://argus-v18-tunnel:18091          # T-0022: through the tunnel (not an executor)
    # Reached through the restricted SSH tunnel sidecar on vm-095 (encrypted path, v1.8 §3.2); on vm-166
    # these services listen on 127.0.0.1 only. Changing transport later = changing only these URLs.
    executors:
      docker_read:   http://argus-v18-tunnel:18701
      host_probe:    http://argus-v18-tunnel:18702
      network_probe: http://argus-v18-tunnel:18703
      db_probe:      http://argus-v18-tunnel:18704     # T-0019: only hosts with a database have one
      prometheus:    http://argus-v18-tunnel:18090

targets:
  # --- vm-095 (light target host) -----------------------------------------------------------------
  - ref: vm-095/host:vm-095
    mounts: ["/"]
  - ref: vm-095/container:argus-lab-worker        # SC-02 non-OOM crash loop (same name as on vm-166)
    service:
      role: worker
      kind: stateless
      owner: platform
      criticality: low
      data: ephemeral
      safe_actions: [container.start, container.restart]
      never: [container.stop]
  - ref: vm-095/container:argus-lab-api           # healthy control twin of vm-166's api (SC-09)
    service:
      role: api
      kind: stateless
      owner: platform
      criticality: medium
      data: ephemeral
      safe_actions: [container.start, container.restart]
      never: [container.stop]
  # --- vm-166 (primary target host) ---------------------------------------------------------------
  - ref: vm-166/host:vm-166
    mounts: ["/", "/srv/argus-lab-fill"]
  - ref: vm-166/container:argus-lab-worker        # SC-01 OOM restart loop
    service:
      role: worker
      kind: stateless
      owner: platform
      criticality: low
      data: ephemeral
      safe_actions: [container.start, container.restart, container.update_resources]
      never: [container.stop]
  - ref: vm-166/container:argus-lab-jobworker      # SC-10 (RB-022): Redis queue consumer
    profile: scenario
    depends_on: [vm-166/container:argus-lab-cache]
    service:
      role: worker
      kind: stateless
      owner: platform
      criticality: low
      data: ephemeral
      safe_actions: [container.restart]
      never: [container.stop]
  - ref: vm-166/container:argus-lab-nginx         # SC-08 (T-0029): a reverse proxy in front of a slow upstream
    profile: scenario
    depends_on: [vm-166/container:argus-lab-slow]
    http_endpoints: ["http://argus-lab-nginx:8080/"]  # probed by the exporter (T-0029): 502/504 = a gateway error
  - ref: vm-166/container:argus-lab-slow          # SC-08: answers after DELAY_S, longer than nginx's proxy_read_timeout
    profile: scenario
    tcp_ports: [8080]
  - ref: vm-166/container:argus-lab-burner        # SC-06 (T-0028): a busy loop under a 0.3-core CPU quota
    profile: scenario
  - ref: vm-166/container:argus-lab-filler        # SC-05: fills /srv/argus-lab-fill (the lab filesystem)
    profile: scenario
    depends_on: [vm-166/host:vm-166]              # writes to the host's lab filesystem: in a host incident's scope (§5)
  - ref: vm-166/container:argus-lab-api           # SC-03 victim of its dependency
    depends_on: [vm-166/container:argus-lab-cache]
    tcp_ports: [8080]
    http_endpoints: ["http://argus-lab-api:8080/health"]
    networks: [argus-lab-app]                     # ACR-0035: its declared network (network.restore)
    service:
      role: api
      kind: stateless
      owner: platform
      criticality: medium
      data: ephemeral
      safe_actions: [container.start, container.restart, network.restore]
      never: [container.stop]
  - ref: vm-166/container:argus-lab-cache
    tcp_ports: [6379]
    networks: [argus-lab-app]                     # ACR-0035: its declared network (network.restore)
    service:
      role: cache
      kind: stateless
      owner: platform
      criticality: low
      data: ephemeral
      safe_actions: [container.start, container.restart]
      never: [container.stop]
  - ref: vm-166/container:argus-lab-client        # SC-07 victim: cannot reach its backend (only on argus-lab-app)
    profile: scenario
    depends_on: [vm-166/container:argus-lab-api]
    networks: [argus-lab-app]                     # E2E-2: its assigned network (container.status compares)
  - ref: vm-166/container:argus-lab-backend       # SC-07: healthy, but only on argus-lab-iso (the wrong network)
    profile: scenario
    tcp_ports: [8080]
    networks: [argus-lab-app]                     # E2E-2: assigned to the lab's app network, like its client
  - ref: vm-166/container:argus-lab-db            # T-0019 / SC-04: lab PostgreSQL, TESTING ONLY (see compose.lab.yml)
    database: {dbname: argus_lab, port: 5432}     # read by argus-v18-db-probe with the argus_monitor role
    tcp_ports: [5432]
    service:
      role: database
      kind: database
      owner: data-team
      criticality: high
      data: persistent
      safe_actions: []
      never: [container.restart, container.stop, container.pause]
  - ref: vm-166/container:argus-lab-leaker        # SC-04 (T-0020): leaks idle-in-transaction sessions on argus-lab-db
    profile: scenario
    depends_on: [vm-166/container:argus-lab-db]
