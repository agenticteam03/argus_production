# Action card: container.start (ACR-0019 §3.4, Phase 17)
name: container.start
model_name: start_container
executor: action-gateway
route: /containers/{name}/start
parameters:
  timeout: {type: int, min: 1, max: 30}
identity_fields: [container_id]
preconditions:
  - 'state == "exited" or state == "created"'
useful_when:
  - "Container is stopped or crashed"
  - "Dependency service is offline (e.g. SC-03 cache)"
not_useful_when:
  - "Container is already running"
verify:
  signal: up
  expected: 1
  window_sec: 30
# No rollback: the state before this action is the outage itself, and a service card can forbid stopping the service
# it was started for (the cache's `never` lists container.stop).
rollback: "none: the previous state is the unavailable service itself"
sources:
  - RB-003
