global: {scrape_interval: 15s, evaluation_interval: 15s,
         external_labels: {argus_host: vm-166}}   # T-0043: an alert without the label (absent()) is still this host's
rule_files: ["/etc/prometheus/alerts.yml"]
alerting:                                 # T-0022: the host's own Argus-owned Alertmanager
  alertmanagers:
    - static_configs:
        - targets: ["argus-v18-alertmanager:9093"]
scrape_configs:
  - job_name: argus-v18-exporter
    static_configs:
      - targets: ["argus-v18-exporter:8700"]
        labels: {argus_host: vm-166}
  - job_name: argus-v18-db-probe          # T-0020: slot usage of the allowlisted databases (argus_db_*)
    authorization: {type: Bearer, credentials_file: /etc/prometheus/secrets/db_probe_token}
    static_configs:
      - targets: ["argus-v18-db-probe:8700"]
        labels: {argus_host: vm-166}
  - job_name: argus-lab-jobworker         # SC-10 / RB-022: queue progress and backlog
    static_configs:
      - targets: ["argus-lab-jobworker:8080"]
        labels: {argus_host: vm-166, container: argus-lab-jobworker}
  - job_name: argus-v18-node-exporter      # T-0022: host CPU, memory, disk, load
    static_configs:
      - targets: ["argus-v18-node-exporter:9100"]
        labels: {argus_host: vm-166}
  - job_name: argus-v18-cadvisor           # T-0022: per-container CPU, memory, throttling
    static_configs:
      - targets: ["argus-v18-cadvisor:8080"]
        labels: {argus_host: vm-166}
