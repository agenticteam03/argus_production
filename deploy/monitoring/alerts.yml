groups:
  - name: argus-v18
    rules:
      - alert: ContainerRestartLoop          # OP-005: counts like the signal restarts_10m (young-first; a gap is unknown)
        expr: clamp_min((argus_container_restart_count and on(argus_host,container) (time() - argus_container_created_seconds < 600)) or on(argus_host,container) (argus_container_restart_count - argus_container_restart_count offset 10m), 0) >= 3
        annotations: {summary: "container restarted 3+ times in 10 minutes"}
      - alert: ContainerUnhealthy
        expr: argus_container_health_unhealthy == 1
        for: 1m
        annotations: {summary: "Docker health check reports unhealthy"}
      - alert: DependencyProbeFailed
        expr: argus_probe_success == 0
        for: 1m
        annotations: {summary: "a declared dependency is not reachable"}
      - alert: DbConnectionsExhausted      # T-0020 / RB-004: ordinary slots above 90 % for 5 minutes. Meant to match
        # the detector's signal db_connection_usage (min_over_time over 5m): `for: 5m` on the raw ratio is the same test
        expr: argus_db_connections_used / (argus_db_connections_usable > 0) >= 0.9
        for: 5m
        annotations: {summary: "a database has used 90 %+ of its usable connection slots for 5 minutes"}
      - alert: HostDiskPressure            # T-0022/T-0024 (node-exporter): any real filesystem above 90 % for 5 minutes
        expr: max by (argus_host) (1 - node_filesystem_avail_bytes{job="argus-v18-node-exporter",fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{job="argus-v18-node-exporter",fstype=~"ext4|xfs|btrfs"}) >= 0.9
        for: 5m
        annotations: {summary: "a filesystem of the host is above 90 % used for 5 minutes"}
      - alert: HttpGatewayErrors           # T-0029 / RB-015: half or more of the exporter's probes through a declared
        # endpoint got 502/504 (the proxy's answer when its upstream fails) over 5 minutes. `owner` names the target.
        expr: max by (argus_host, owner) (avg_over_time(argus_http_probe_gateway_error[5m])) >= 0.5
        for: 2m
        annotations: {summary: "the proxy {{ $labels.owner }} answers 502/504: its upstream fails or is too slow"}
      - alert: ArgusScrapeTargetDown       # T-0027 / RB-014: an Argus scrape target down for two scrape intervals+ (the
        # monitoring blind spot class). The gate exporter's own outage also fires it; that incident ends undiagnosable.
        expr: up{job=~"argus-v18-.*"} == 0
        for: 2m
        annotations: {summary: "scrape target {{ $labels.job }} is down: its signals are unknown"}
      - alert: ContainerCpuThrottled       # T-0028 / RB-006: an Argus container throttled at its CPU quota in half or more
        # of its CPU periods AND using 80 %+ of its quota, for 5 minutes (the detector's test). cAdvisor names the
        # container `name`; the intake reads `container`. 3m rates: cAdvisor's samples are 35-53 s apart. The quota
        # condition keeps bursty containers out (argus-lab-api on vm-166: 61 % throttled at 4 % of its quota).
        expr: label_replace((rate(container_cpu_cfs_throttled_periods_total{name=~"argus-.*"}[3m]) / (rate(container_cpu_cfs_periods_total{name=~"argus-.*"}[3m]) > 0) >= 0.5) and on(argus_host, name) (rate(container_cpu_usage_seconds_total{name=~"argus-.*"}[3m]) / on(argus_host, name) (container_spec_cpu_quota{name=~"argus-.*"} / container_spec_cpu_period{name=~"argus-.*"}) >= 0.8), "container", "$1", "name", "(.*)")
        for: 5m
        annotations: {summary: "container {{ $labels.name }} is throttled at its CPU quota and uses all of it"}
