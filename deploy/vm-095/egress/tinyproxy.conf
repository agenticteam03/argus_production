# argus-v18-egress: CONNECT to port 443 of the names in /etc/tinyproxy/filter only (policies/NETWORK.md).
Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 20
LogLevel Notice
# argus-v18-sched (the scheduler, the alert route) and argus-v18-core; nothing else may use it
Allow 172.30.4.0/24
Allow 172.30.0.0/24
ConnectPort 443
FilterType ere
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
DisableViaHeader Yes
