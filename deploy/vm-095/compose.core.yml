# vm-095 (VM 0.95) — Argus v1.8 core: the tunnel (Phase 3), Postgres, the system of record (Phase 5; no host port,
# reachable only on argus-v18-core), and three Argus programs from ONE image (T-0014, ARCHITECTURE §3):
#   argus-v18-agent      `argus api`       API + webhook; never investigates (name kept: CLI, docs and ops use it)
#   argus-v18-worker     `argus worker`    claims queued incidents with a lease, runs and resumes them; no host port
#   argus-v18-scheduler  `argus scheduler` submits the checks of deploy/scheduler/schedules.yaml; only the database
# Rollback (single process, as before T-0014): ARGUS_AGENT_CMD=serve for argus-v18-agent, and stop argus-v18-worker
# and argus-v18-scheduler (`serve` takes back every running run at start, so never run it next to a live worker).
# Network argus-v18-core uses an explicit subnet chosen from ranges unused on both VMs (discovery 2026-10-01).
# Network argus-v18-sched (ACR-0018 §18, phase 16) is internal: no route out. The scheduler is on it alone with what it
# reads (Postgres, the tunnel, vm-095's Prometheus and Alertmanager) and argus-v18-egress, its only way out (OCI).
# Network argus-v18-action (phase 20, X-3) is internal: the tunnel and the worker only, for vm-166's action gateway.
name: argus-v18-core
services:
  argus-v18-tunnel:
    build: ./tunnel
    image: argus-v18-tunnel:1
    container_name: argus-v18-tunnel
    command: ["argus-v18-tunnel@${ARGUS_VM166_PRIVATE_IP:?set it in /opt/argus-v18/hosts.env and pass --env-file}"]
    volumes:
      - /opt/argus-v18/secrets/tunnel:/secrets:ro
    networks:                           # reachable ONLY by Argus containers; no host port published
      argus-v18-core: {}
      argus-v18-sched: {}
      argus-v18-action:                 # phase 20: the gateway forward listens on this address alone
        ipv4_address: 172.30.5.2
        # X-5: the worker's name for vm-166's gateway, on this internal network only, now that write_gate.open names
        # a pair (the write-gate check accepts the name resolving only then)
        aliases: [argus-v18-action-gateway]
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.2
    pids_limit: 16
    restart: unless-stopped
  argus-v18-postgres:
    image: postgres:16-alpine
    container_name: argus-v18-postgres
    environment:
      POSTGRES_USER: argus_owner          # owner: migrations only (ops/db-migrate.sh); the agent uses argus_runtime
      POSTGRES_DB: argus
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_owner_password
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30", "-c", "work_mem=2MB"]
    volumes:
      - argus-v18-pgdata:/var/lib/postgresql/data
      - /opt/argus-v18/secrets/postgres/owner_password:/run/secrets/pg_owner_password:ro
    networks: [argus-v18-core, argus-v18-sched]   # no host port
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus_owner -d argus"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.4
    pids_limit: 100
    restart: unless-stopped
  argus-v18-agent:
    build: {context: ../.., dockerfile: Dockerfile}
    image: argus-v18-agent:1
    container_name: argus-v18-agent
    command: ["python", "-m", "argus", "${ARGUS_AGENT_CMD:-api}"]   # T-0014: api; rollback: serve
    ports:
      - "127.0.0.1:18000:8000"          # humans / Swagger / CLI — loopback only, reached through SSH -L
    volumes:
      - argus-v18-agent-data:/data
      - /opt/argus-v18/app/config:/app/config:ro
      # T-0021 (§12.6): the api never investigates, so it gets no executor token, only these files. The rollback
      # ARGUS_AGENT_CMD=serve (investigates in-process) needs the folder back: /opt/argus-v18/secrets/agent:/run/argus-secrets:ro
      - /opt/argus-v18/secrets/agent/db_password:/run/argus-secrets/db_password:ro
      - /opt/argus-v18/secrets/agent/jwt_signing_key:/run/argus-secrets/jwt_signing_key:ro
      # ACR-0018 phase 16 step 2: the Ed25519 key; with it the API signs and accepts EdDSA only. The file must exist
      # before `up` (a missing bind source becomes a directory). Rollback: remove this line and recreate the agent.
      - /opt/argus-v18/secrets/agent/jwt_ed25519_key:/run/argus-secrets/jwt_ed25519_key:ro
      - /opt/argus-v18/secrets/agent/openai_api_key:/run/argus-secrets/openai_api_key:ro   # only for llm_configured
      # ACR-0034 local tier: an administrator's approval installs a staged source (the worker reads /corpus read-only)
      - /opt/argus-v18/corpus:/corpus
      - /opt/argus-v18/corpus-staging:/corpus-staging
    environment:
      ARGUS_CORPUS_DIR: /corpus
      ARGUS_CORPUS_STAGING_DIR: /corpus-staging
      ARGUS_RUNNER: ${ARGUS_RUNNER:-langgraph}          # T-0013 (verified 2026-10-04); rollback: ARGUS_RUNNER=plain
      ARGUS_DB_BACKEND: ${ARGUS_DB_BACKEND:-postgres}   # rollback: ARGUS_DB_BACKEND=sqlite (the SQLite file is kept)
      ARGUS_LLM_MODEL: ${ARGUS_LLM_MODEL:-gpt-5.6-luna}
      ARGUS_MAX_READS_PER_STEP: "2"
      ARGUS_MAX_STEPS: "8"
      ARGUS_LANGFUSE_UI_URL: ${ARGUS_LANGFUSE_UI_URL:-}        # ACR-0013: operator link only; empty = no link
      ARGUS_LANGFUSE_PROJECT_ID: ${ARGUS_LANGFUSE_PROJECT_ID:-}
      ARGUS_HOME_HOST: vm-095                          # ACR-0017: the map marks the host Argus runs on
      # ACR-0018 phase 16 step 3 (D2): the UI's DNS name and https origin, from hosts.env (never in Git); empty = the
      # second-factor routes answer 503
      ARGUS_WEBAUTHN_RP_ID: ${ARGUS_WEBAUTHN_RP_ID:-}
      ARGUS_WEBAUTHN_ORIGIN: ${ARGUS_WEBAUTHN_ORIGIN:-}
      # ACR-0043: the operator console's routes (off: 404). The UI image takes the same variable (deploy/ui/compose.ui.yml)
      ARGUS_OPERATOR_CONSOLE: ${ARGUS_OPERATOR_CONSOLE:-0}
    networks: [argus-v18-core]          # reaches vm-095 executors directly and vm-166 through argus-v18-tunnel
    depends_on:
      argus-v18-tunnel: {condition: service_started}
      argus-v18-postgres: {condition: service_healthy}
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.6
    pids_limit: 200
    restart: unless-stopped
  argus-v18-worker:                     # T-0014: the only program that investigates (executors, model, graph)
    image: argus-v18-agent:1            # the same image, built by argus-v18-agent
    container_name: argus-v18-worker
    command: ["python", "-m", "argus", "worker"]
    volumes:
      - argus-v18-agent-data:/data
      - /opt/argus-v18/app/config:/app/config:ro
      # the only container with the executor tokens; in mcp mode only its tools process (argus-tools) can read them
      - /opt/argus-v18/secrets/agent:/run/argus-secrets:ro
      # ACR-0034: the installed reference corpus (`argus corpus import`), read-only here; empty = no corpus
      - /opt/argus-v18/corpus:/corpus:ro
    environment:
      ARGUS_CORPUS_DIR: /corpus
      ARGUS_CORPUS_RETRIEVAL: ${ARGUS_CORPUS_RETRIEVAL:-keyword}   # hybrid: Weaviate ranks, keyword search the fallback
      ARGUS_WEAVIATE_URL: http://argus-v18-weaviate:8080   # read only when hybrid; unreachable = keyword fallback
      ARGUS_RUNNER: ${ARGUS_RUNNER:-langgraph}
      ARGUS_DB_BACKEND: ${ARGUS_DB_BACKEND:-postgres}
      ARGUS_TOOL_CATALOGUE: ${ARGUS_TOOL_CATALOGUE:-mcp}   # T-0021 (OD-3, ACR-0002): mcp on vm-095; rollback: direct
      ARGUS_LLM_MODEL: ${ARGUS_LLM_MODEL:-gpt-5.6-luna}
      ARGUS_MAX_READS_PER_STEP: "2"
      ARGUS_MAX_STEPS: "8"
      ARGUS_WORKER_LEASE_S: "300"                     # claim renewed every 100 s; a dead worker's run waits <= 300 s
      ARGUS_TRACING_ENABLED: ${ARGUS_TRACING_ENABLED:-0}   # ACR-0013: off unless "1"; also needs the worker-only Langfuse key files
      # ACR-0016: Langfuse Cloud (EU) in hosts.env, e.g. https://cloud.langfuse.com/api/public/otel/v1/traces; unset = private stack
      ARGUS_TRACING_ENDPOINT: ${ARGUS_TRACING_ENDPOINT:-http://argus-v18-langfuse-web:3000/api/public/otel/v1/traces}
      ARGUS_SCHEDULE_MAX_QUEUED_AGE_S: "900"          # a scheduled check not started within 15 min is stale_skipped
      # X-5 (phase 20): the supervised-action path, off unless hosts.env sets ARGUS_ACTION_PATH=1 in the release window;
      # the token file is in secrets/agent (never in Git); the gateway is the tunnel's forward above
      ARGUS_ACTION_PATH: ${ARGUS_ACTION_PATH:-0}
      ARGUS_ACTION_GATEWAY_URL: http://argus-v18-action-gateway:18705
      ARGUS_ACTION_TOKEN_FILE: /run/argus-secrets/action_token
      ARGUS_ACTION_DAILY_HOST_CAP: "2"
      ARGUS_HOME_HOST: vm-095                          # TASK-61: its Alertmanager carries the approval notice
    # no host port; reaches vm-095 executors directly and vm-166 through the tunnel; argus-v18-action: phase 20's
    # gateway forward, which only the worker reaches
    networks: [argus-v18-core, argus-v18-action]
    depends_on:
      argus-v18-tunnel: {condition: service_started}
      argus-v18-postgres: {condition: service_healthy}
    stop_grace_period: 120s             # SIGTERM: the current run finishes (or its lease expires and it resumes)
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.6
    pids_limit: 200
    restart: unless-stopped
  argus-v18-scheduler:                  # T-0014: driver only (rule 15): writes intake rows, never detectors/model/graph
    image: argus-v18-agent:1
    container_name: argus-v18-scheduler
    command: ["python", "-m", "argus", "scheduler"]
    volumes:
      - /opt/argus-v18/app/config:/app/config:ro                      # inventory: schedule targets must exist
      - /opt/argus-v18/app/deploy/scheduler:/app/schedules:ro         # the image has no deploy/ folder
      - /opt/argus-v18/secrets/agent/db_password:/run/argus-secrets/db_password:ro   # the database; no executor tokens
      # ACR-0018 step 5: the signed daily audit digest. Its own folder, never secrets/agent/ (the worker mounts all of
      # that): the key that signs and the create-only credential of the OCI bucket. The scheduler is the only reader.
      - /opt/argus-v18/secrets/digest/audit_digest_ed25519_key:/run/argus-secrets/audit_digest_ed25519_key:ro
      - /opt/argus-v18/secrets/digest/oci_digest:/run/argus-secrets/oci_digest:ro
    environment:
      ARGUS_DB_BACKEND: postgres        # the scheduler needs the shared database (no SQLite rollback for it)
      ARGUS_SCHEDULES: /app/schedules/schedules.yaml
      ARGUS_SCHEDULE_MIN_INTERVAL_S: "300"
      ARGUS_AUDIT_DIGEST_SINK: ${ARGUS_AUDIT_DIGEST_SINK:-}   # oci:<namespace>/<bucket> in hosts.env; unset = no sink
      HTTPS_PROXY: http://argus-v18-egress:8888        # ACR-0018 §18: the OCI sink's only way out (policies/NETWORK.md)
      NO_PROXY: argus-v18-postgres,argus-v18-tunnel,argus-v18-prometheus,argus-v18-alertmanager,localhost
    networks: [argus-v18-sched]         # internal: no route out; https leaves only through argus-v18-egress
    depends_on:
      argus-v18-postgres: {condition: service_healthy}
      argus-v18-egress: {condition: service_started}
    mem_limit: 256m                     # was 160m: the OCI SDK adds ~19 MB at start, and the digest reads the whole chain
    memswap_limit: 256m
    cpus: 0.2
    pids_limit: 50
    restart: unless-stopped
  argus-v18-corpus:                     # ACR-0034 local tier: stages ONE allowlisted source; never installs (T-0057)
    image: argus-v18-agent:1
    container_name: argus-v18-corpus
    profiles: [corpus]                  # off by default: `docker compose --profile corpus run --rm argus-v18-corpus
                                        #   python -m argus corpus fetch --source <name>`
    command: ["python", "-m", "argus", "corpus", "fetch", "--help"]
    volumes:
      - /opt/argus-v18/app/config:/app/config:ro                      # the allowlist (config/corpus/*.yaml)
      - /opt/argus-v18/corpus-staging:/corpus-staging                 # its only writable path; no secret is mounted
    environment:
      ARGUS_CORPUS_STAGING_DIR: /corpus-staging
      HTTPS_PROXY: http://argus-v18-egress:8888        # not in egress/filter yet: needs a per-client filter first
    working_dir: /app
    networks: [argus-v18-sched]         # internal: no route out; https leaves only through argus-v18-egress
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m                     # a source's archive is read in memory (the Linux tree is ~250 MB)
    memswap_limit: 768m
    cpus: 0.5
    pids_limit: 50
  argus-v18-egress:                     # ACR-0018 §18: CONNECT :443 to OCI Object Storage and the Telegram API only
    build: ./egress
    image: argus-v18-egress:1
    container_name: argus-v18-egress
    networks: [argus-v18-sched, argus-v18-core]   # in from the internal network, out through the core bridge
    read_only: true
    tmpfs: [/run/tinyproxy, /var/log/tinyproxy]
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.1
    pids_limit: 30
    restart: unless-stopped
  argus-v18-weaviate:                   # ACR-0034 (design of ACR-0015): ranks reference passages; derived from the bundle
    image: semitechnologies/weaviate:1.38.18
    container_name: argus-v18-weaviate
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      CLUSTER_HOSTNAME: node1
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      PERSISTENCE_LSM_ACCESS_STRATEGY: pread      # segments read with pread, not mmap: less page-cache churn (LF-3)
      DEFAULT_VECTORIZER_MODULE: none             # Argus supplies the vectors; no model runs here
      ENABLE_MODULES: ""
      ENABLE_API_BASED_MODULES: "false"           # 1.38 enables ~40 API modules (text2vec-openai, generative-*) otherwise
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"   # argus-v18-core only, no host port: the worker is the one client
      QUERY_DEFAULTS_LIMIT: "20"
      LIMIT_RESOURCES: "true"
      GOMEMLIMIT: 640MiB                          # ~85 % of mem_limit (DEPLOY-7f137da: 425 MiB idle at 400)
      GOMAXPROCS: "1"
      DISABLE_TELEMETRY: "true"
      LOG_LEVEL: warning
    volumes: [argus-v18-weaviate-data:/var/lib/weaviate]
    networks: [argus-v18-core]          # no host port; the worker reaches it, nothing else needs to
    # trial 2026-10-15 (#155): 210 MiB peak with 6,510 objects; DEPLOY-7f137da: 425 MiB idle with 20,251 after the index
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.5
    pids_limit: 256
    restart: unless-stopped
networks:
  argus-v18-core:
    name: argus-v18-core
    ipam:
      config: [{subnet: 172.30.0.0/24}]
  argus-v18-sched:
    name: argus-v18-sched
    internal: true
    ipam:
      config: [{subnet: 172.30.4.0/24}]
  argus-v18-action:                     # phase 20 (X-3): internal; the tunnel and the worker only
    name: argus-v18-action
    internal: true
    ipam:
      config: [{subnet: 172.30.5.0/24}]
volumes:
  argus-v18-agent-data:
    name: argus-v18-agent-data
  argus-v18-weaviate-data:
    name: argus-v18-weaviate-data
  argus-v18-pgdata:
    name: argus-v18-pgdata
