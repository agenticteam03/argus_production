# SC-08 (T-0029): argus-lab-nginx proxies to argus-lab-slow, which answers after DELAY_S (5 s). The 2 s read timeout
# makes nginx answer 504 Gateway Timeout: the upstream failure RB-015 describes. Lab only.
server {
    listen 8080;
    location / {
        proxy_pass http://argus-lab-slow:8080;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }
}
