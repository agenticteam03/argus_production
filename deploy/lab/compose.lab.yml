# Synthetic workloads (argus-lab-*). Profiles: base (always-on baseline), sc01, sc02, … (one failure at a time).
# On the argus-lab-app network (SC-07's backend: argus-lab-iso); hard limits; no published ports.
name: argus-lab-workloads
x-lim: &lim {mem_limit: 48m, memswap_limit: 48m, cpus: 0.2, pids_limit: 32}
services:
  argus-lab-cache:                      # vm-166 baseline (dependency of argus-lab-api)
    <<: *lim
    image: redis:7-alpine
    container_name: argus-lab-cache
    profiles: [base-166]
    networks: [argus-lab-app]
    tmpfs: [/data]                      # no anonymous Docker volume (redis declares VOLUME /data)
    restart: unless-stopped
  argus-lab-api:                        # vm-166 baseline: depends on argus-lab-cache
    <<: *lim
    image: python:3.12-alpine
    container_name: argus-lab-api
    profiles: [base-166]
    command: ["python", "-u", "/w/api.py"]
    volumes: ["./workloads:/w:ro"]
    networks: [argus-lab-app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 4s
      retries: 2
    restart: unless-stopped
  argus-lab-db:                         # vm-166 baseline, TESTING ONLY (T-0019): gives the db-probe a database to
    image: postgres:16-alpine           # measure and a healthy reference before SC-04. A production deployment does
    container_name: argus-lab-db        # not need it: the probe points at the real database (inventory `database`).
    profiles: [base-166]
    command: ["postgres", "-c", "max_connections=20", "-c", "superuser_reserved_connections=3",
              "-c", "shared_buffers=16MB"]                   # 20 slots: RB-004's lab case (SC-04 fills them)
    environment:
      POSTGRES_DB: argus_lab
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - /opt/argus-v18/secrets/lab-db/postgres_password:/run/secrets/postgres_password:ro
      - /opt/argus-v18/secrets/lab-db/monitor_password:/run/secrets/monitor_password:ro
      - /opt/argus-v18/secrets/lab-db/app_password:/run/secrets/app_password:ro          # SC-04's ordinary role
      - ./db-init:/docker-entrypoint-initdb.d:ro                # creates argus_monitor (pg_monitor only)
    tmpfs: ["/var/lib/postgresql/data:size=96m"]              # no Docker volume; a restart starts empty
    networks: [argus-lab-app]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "argus_lab"]
      interval: 15s
      timeout: 4s
      retries: 3
    restart: unless-stopped
  argus-lab-leaker:                     # SC-04 (vm-166): opens sessions on argus-lab-db and never ends their transaction
    <<: *lim
    image: postgres:16-alpine           # only for psql; no server runs here
    container_name: argus-lab-leaker
    profiles: [sc04]
    entrypoint: ["sh", "/w/leaker.sh"]
    environment: {PGHOST: argus-lab-db, PGDATABASE: argus_lab, PGUSER: argus_lab_app, PGAPPNAME: argus-lab-leaker,
                  SESSIONS: "16"}       # 16 of 17 usable slots = 94 % (the monitoring role still gets in)
    volumes:
      - ./workloads:/w:ro
      - /opt/argus-v18/secrets/lab-db/app_password:/run/secrets/app_password:ro
    networks: [argus-lab-app]
    restart: "no"
  argus-lab-api-twin:                   # vm-095 baseline: SAME container name, no dependency, healthy
    <<: *lim
    image: python:3.12-alpine
    container_name: argus-lab-api
    profiles: [base-095]
    environment: {CACHE_HOST: none}
    command: ["python", "-u", "/w/api.py"]
    volumes: ["./workloads:/w:ro"]
    networks: [argus-lab-app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 4s
      retries: 2
    restart: unless-stopped
  argus-lab-worker-oom:                 # SC-01 (vm-166): OOM restart loop
    image: python:3.12-alpine
    container_name: argus-lab-worker
    profiles: [sc01]
    command: ["python", "-u", "/w/oom_worker.py"]
    volumes: ["./workloads:/w:ro"]
    networks: [argus-lab-app]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.2
    pids_limit: 32
    restart: on-failure
  argus-lab-worker-crash:               # SC-02 (vm-095): non-OOM crash loop, SAME container name
    <<: *lim
    image: python:3.12-alpine
    container_name: argus-lab-worker
    profiles: [sc02]
    command: ["python", "-u", "/w/crash_worker.py"]
    volumes: ["./workloads:/w:ro"]
    networks: [argus-lab-app]
    restart: on-failure
  argus-lab-backend:                    # SC-07 (vm-166): healthy, but ONLY on argus-lab-iso (the wrong network)
    <<: *lim
    image: python:3.12-alpine
    container_name: argus-lab-backend
    profiles: [sc07]
    environment: {CACHE_HOST: none}
    command: ["python", "-u", "/w/api.py"]
    volumes: ["./workloads:/w:ro"]
    networks: [argus-lab-iso]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 4s
      retries: 2
    restart: unless-stopped
  argus-lab-client:                     # SC-07 (vm-166): on argus-lab-app, cannot resolve argus-lab-backend
    <<: *lim
    image: python:3.12-alpine
    container_name: argus-lab-client
    profiles: [sc07]
    command: ["python", "-u", "/w/client.py"]
    volumes: ["./workloads:/w:ro"]
    networks: [argus-lab-app]
    restart: unless-stopped
networks:
  argus-lab-app: {external: true, name: argus-lab-app}
  argus-lab-iso:                        # SC-07 only: created with the profile, removed by its `down`
    name: argus-lab-iso
    ipam: {config: [{subnet: 172.30.3.0/24}]}
