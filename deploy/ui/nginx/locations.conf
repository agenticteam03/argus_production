# argus-v18-ui, the routes (ACR-0011 §3.1 rows 3, 5, 9). Included in each server block.
# The API: ONLY the routes of contracts/ui-api.json, each with its method (tests/test_acr0011_ui_edge.py keeps the
# two equal). Everything else under /api/ is 404 here, so /docs, /openapi.json, POST /api/v1/investigations,
# approvals, /metrics and the webhook never leave vm-095.
limit_conn argus_conn 20;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;

# Every proxied request: Argus learns it came through the edge (a login is then read-only) and who the client is.
# proxy_set_header replaces a client's own X-Argus-Edge / X-Real-IP, so a browser cannot forge them.
set $argus_edge "public";

location = /api/v1/auth/token {
    limit_except POST { deny all; }
    limit_req zone=argus_login burst=5 nodelay;
    include /etc/nginx/argus/proxy.conf;
}
location = /api/v1/me             { limit_except GET { deny all; } limit_req zone=argus_api burst=20 nodelay; include /etc/nginx/argus/proxy.conf; }
location = /api/v1/incidents      { limit_except GET { deny all; } limit_req zone=argus_api burst=20 nodelay; include /etc/nginx/argus/proxy.conf; }
location = /api/v1/escalations    { limit_except GET { deny all; } limit_req zone=argus_api burst=20 nodelay; include /etc/nginx/argus/proxy.conf; }
location = /api/v1/targets        { limit_except GET { deny all; } limit_req zone=argus_api burst=20 nodelay; include /etc/nginx/argus/proxy.conf; }
# ACR-0012: the one POST besides the login. The API decides who may (an investigate token of an operator or approver)
# and applies the per-principal quotas; the edge only limits the rate per address and the size of the request.
location = /api/v1/investigations {
    limit_except POST { deny all; }
    limit_req zone=argus_invest burst=2 nodelay;
    client_max_body_size 4k;
    include /etc/nginx/argus/proxy.conf;
}
location ~ ^/api/v1/incidents/[A-Za-z0-9_-]+$          { limit_except GET { deny all; } limit_req zone=argus_api burst=20 nodelay; include /etc/nginx/argus/proxy.conf; }
location ~ ^/api/v1/incidents/[A-Za-z0-9_-]+/events$   { limit_except GET { deny all; } limit_req zone=argus_api burst=20 nodelay; include /etc/nginx/argus/proxy.conf; }
location ~ ^/api/v1/evidence/[A-Za-z0-9_-]+$           { limit_except GET { deny all; } limit_req zone=argus_api burst=20 nodelay; include /etc/nginx/argus/proxy.conf; }
location /api/ { return 404; }

# Swagger and the OpenAPI schema stay on the loopback listener (§7.1); without these the SPA fallback would answer.
location = /docs         { return 404; }
location = /redoc        { return 404; }
location = /openapi.json { return 404; }

# The runbooks: only to a request whose bearer token passes GET /api/v1/me (ACR-0011 §3.1 row 9).
location /runbooks/ {
    limit_except GET { deny all; }
    limit_req zone=argus_api burst=40 nodelay;
    auth_request /_argus_auth;
    alias /usr/share/nginx/runbooks/;
    types { application/json json; text/markdown md; }
    default_type text/plain;
}
location = /_argus_auth {
    internal;
    proxy_pass http://argus_api/api/v1/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Argus-Edge $argus_edge;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

# The built React app; any other path is a client route.
location /assets/ { expires 7d; try_files $uri =404; }
location / { try_files $uri /index.html; }
