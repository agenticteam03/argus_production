# argus-v18-ui, http context (ACR-0011 §3.1 rows 5, 8, 9, 10). Included by both server templates.
server_tokens off;
client_max_body_size 8k;
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 15s;

# Request limits per client address. A burst absorbs a page load; beyond it, 429.
limit_req_zone $binary_remote_addr zone=argus_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=argus_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=argus_invest:10m rate=6r/m;   # ACR-0012: starting investigations
limit_conn_zone $binary_remote_addr zone=argus_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Access log without the Authorization header, the login body or the query string (only the path).
log_format argus_json escape=json '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
                                  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
                                  '"duration_s":$request_time,"upstream_s":"$upstream_response_time"}';
access_log /dev/stdout argus_json;

# Docker's DNS, re-asked every 10 s: recreating argus-v18-agent (every deployment) gives it a new address, and a name
# resolved once at start answered 502 until a reload (AFTER-MERGE 2026-10-14). `resolve` needs the shared zone.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ACR-0018 phase 16 step 4, amended by ACR-0037 and ACR-0038: the private path. /api/v1/ops/ (every privileged route)
# and an `ops` token's runbook reads pass only when $argus_ops_ok is 1; anything else is 404, as if the route did not
# exist. $argus_ops_ok is defined by ONE of two files, which 05-argus-mode.envsh copies to conf.d at start:
#   ops-mode-certificate.conf (the default): a client certificate of the team's CA, not revoked;
#   ops-mode-passkey.conf (ARGUS_OPS_PASSKEY_ONLY=on): any TLS request; the API's login, two security keys and the
#     step-up are then the whole proof.
# Either way it is 0 on the loopback (plain HTTP) server, so the private path never passes there.

upstream argus_api {
    zone argus_api_upstream 64k;
    server argus-v18-agent:8000 resolve;   # the API on argus-v18-core; never :8001 (the webhook)
    keepalive 8;
}
