# argus-v18-ui: how an allowed API request reaches argus-v18-agent:8000 (included by each API location).
proxy_pass http://argus_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Argus-Edge $argus_edge;      # ACR-0011: a login through the edge is read-only
proxy_set_header X-Argus-Ops $argus_ops_ok;      # ACR-0032: 1 only on the private path; an ops token needs it
proxy_set_header X-Argus-Ops-Cert $ssl_client_verify;   # ACR-0038: SUCCESS when the edge verified a team certificate (audit)
proxy_set_header X-Real-IP $remote_addr;         # the client, for the login limits and audit
proxy_set_header X-Forwarded-For $remote_addr;   # replaced, never appended to the client's own value
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_buffering on;
