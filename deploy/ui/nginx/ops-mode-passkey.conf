# ACR-0038: ARGUS_OPS_PASSKEY_ONLY=on. The private path needs no client certificate: any TLS request reaches it, and the
# API's private login (password, a human approver with two security keys), the session's security key and the per-decision
# step-up are the proof. Plain HTTP (the loopback server) never passes. Copied by 05-argus-mode.envsh.
map $https $argus_ops_ok {
    default 0;
    "on" 1;
}
