# ACR-0018 phase 16 step 4: the client-certificate half of the private path, included in the public server only when
# ARGUS_OPS_PATH=on (05-argus-mode.envsh copies it to /etc/nginx/ops/). The CA certificate and its CRL are files on
# vm-095 (/opt/argus-v18/edge-ops, mounted read-only); the CA's private key never is (ops/edge-ca.sh, on a laptop).
# "optional": a browser without a certificate still gets the public UI; one with a bad or revoked certificate gets 404
# (not nginx's 400 page), so the private path is not revealed.
ssl_client_certificate /etc/argus-ops/ca.crt;
ssl_crl                /etc/argus-ops/crl.pem;
ssl_verify_client      optional;
ssl_verify_depth       1;
error_page 495 = @argus_ops_not_found;
location @argus_ops_not_found { return 404; }
