# ACR-0018 phase 16 step 4 (ACR-0037): the private path needs a client certificate of the team's CA, not revoked.
# The default; 05-argus-mode.envsh copies it to /etc/nginx/conf.d/00-argus-ops-mode.conf unless ARGUS_OPS_PASSKEY_ONLY=on.
map $ssl_client_verify $argus_ops_ok {
    default 0;
    "SUCCESS" 1;
}
