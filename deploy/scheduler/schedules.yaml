# Scheduled health checks (T-0014, ARCHITECTURE §7.3), read by `argus scheduler`.
# Each due slot submits a `check` investigation of the target (identity: id + slot time, so never twice).
# A healthy check ends after detection with no model call. A busy target is coalesced, not run twice.
# Fields: id, cron (5 fields, UTC), target (must be in config/inventory.yaml), reason, enabled.
# The minimum interval is ARGUS_SCHEDULE_MIN_INTERVAL_S (default 300 s); the scheduler refuses a faster cron.
#
# Shipped with no active schedule: a deploy changes nothing until a schedule is enabled on purpose.
schedules:
  - id: lab-worker-health
    cron: "*/15 * * * *"
    target: "vm-166/container:argus-lab-worker"
    reason: "scheduled health investigation"
    enabled: false

# T-0022 (ACR-0003): this deployment's transport profile is restricted-ssh (forward-only), so firing alerts are
# PULLED: every every_s seconds the scheduler reads each host's Argus-owned Alertmanager (inventory `alertmanager`)
# and opens an incident per firing alert (identity fingerprint + startsAt: never twice). Minimum every_s: 30.
reconcile_firing_alerts:
  enabled: true
  every_s: 60
  # T-0035 (ACR-0009): the monitoring heartbeat per host. Needs the ArgusMonitoringHeartbeat rule
  # (deploy/monitoring/alerts.yml) loaded in every host's Prometheus (recreate argus-v18-prometheus after a deploy that
  # changes alerts.yml): a host without a fresh heartbeat resolves no alert and, after grace_s, opens a "Host
  # monitoring unavailable" incident. stale_after_s: at least two ticks. Measured on Alertmanager 0.34.0 (T-0035 step
  # 2): updatedAt renewed every 60-75 s, endsAt = updatedAt + 240 s; 180 s tolerates one missed renewal and declares a
  # loss before the hosts' other alerts expire.
  monitoring_heartbeat:
    enabled: true
    stale_after_s: 180
    grace_s: 300
  # T-0046 L3 (ACR-0025): on each tick, read every owner's dependency probes on its own host's Prometheus and record a
  # link_event row (migration 009) when a declared container link changes state, and once at startup. On since T-0046
  # L5 (2026-10-21, vm-095); `enabled: false` turns it off again (the table stays).
  link_states:
    enabled: true

# ACR-0018 (phase 16): the audit hash chain (migration 011) is verified at the scheduler's start and every every_s
# seconds (minimum 3600); the result is a `security` audit event. A broken chain is logged as an error; its alert to
# the team waits for the team's alert route (ARCHITECTURE §18).
audit_chain:
  enabled: true
  every_s: 86400

# ACR-0018 step 5: the signed daily digest of the audit chain (the last chained row of each closed UTC day), put once
# in the store outside the VMs (`ARGUS_AUDIT_DIGEST_SINK`) and signed with the audit digest key (secret
# `audit_digest_ed25519_key`). Off until both exist; enabled without them it records `security.audit_digest_unconfigured`
# and ships nothing. A broken chain is never signed.
audit_digest:
  enabled: false
  every_s: 86400
