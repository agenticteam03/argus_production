# Scheduled health checks (T-0014, ARCHITECTURE §7.3), read by `argus scheduler`.
# Each due slot submits a `check` investigation of the target (identity: id + slot time, so never twice).
# A healthy check ends after detection with no model call. A busy target is coalesced, not run twice.
# Fields: id, cron (5 fields, UTC), target (must be in config/inventory.yaml), reason, enabled.
# The minimum interval is ARGUS_SCHEDULE_MIN_INTERVAL_S (default 300 s); the scheduler refuses a faster cron.
#
# Shipped with no active schedule: a deploy changes nothing until a schedule is enabled on purpose.
schedules:
  - id: lab-worker-health
    cron: "*/15 * * * *"
    target: "vm-166/container:argus-lab-worker"
    reason: "scheduled health investigation"
    enabled: false

# T-0022 (ACR-0003): this deployment's transport profile is restricted-ssh (forward-only), so firing alerts are
# PULLED: every every_s seconds the scheduler reads each host's Argus-owned Alertmanager (inventory `alertmanager`)
# and opens an incident per firing alert (identity fingerprint + startsAt: never twice). Minimum every_s: 30.
reconcile_firing_alerts:
  enabled: true
  every_s: 60
  # T-0035 (ACR-0009): the monitoring heartbeat per host. Off until both hosts' Prometheus run the
  # ArgusMonitoringHeartbeat rule (deploy/monitoring/alerts.yml): turned on, a host without a fresh heartbeat resolves
  # no alert and, after grace_s, opens a "Host monitoring unavailable" incident. stale_after_s: at least two ticks.
  monitoring_heartbeat:
    enabled: false
    stale_after_s: 180
    grace_s: 300
